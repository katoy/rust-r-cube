name: Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry and git index
        uses: actions/cache@v4
        id: cargo-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache sccache binary
        uses: actions/cache@v4
        id: sccache-bin
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-sccache-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-bin-

      - name: Cache sccache state
        uses: actions/cache@v4
        id: sccache-cache
        with:
          path: |
            ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache target directory
        uses: actions/cache@v4
        id: cargo-target
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.rust }}-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Install sccache (only on cache miss)
        if: steps.sccache-bin.outputs.cache-hit != 'true'
        run: |
          cargo install sccache --locked || true

      - name: Show rustc and sccache
        run: |
          rustc --version || true
          which sccache || true

      - name: Prefetch dependencies
        run: |
          cargo fetch --locked || true

      - name: Build
        env:
          RUSTC_WRAPPER: $HOME/.cargo/bin/sccache
        run: cargo build --workspace --verbose

      - name: Test
        env:
          RUSTC_WRAPPER: $HOME/.cargo/bin/sccache
        run: cargo test --workspace --verbose
