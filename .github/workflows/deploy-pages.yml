name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-3x3-web-2:
    name: Test 3x3-web-2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3x3-web-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown

      - name: Check locked dependencies on MSRV
        run: |
          cargo +1.87.0 check --locked --all-targets
          cargo +1.87.0 check --locked --lib --target wasm32-unknown-unknown

      - name: Restore stable default toolchain
        run: rustup default stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: 3x3-web-2/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Rust formatting & clippy check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --release

      - name: Run review guardrail checks
        run: npm run check:guardrails

      - name: Web format check
        run: npm run format:check

      - name: Build WASM & Web bundle
        run: npm run build

      - name: Generate camera test images
        run: npm run generate-test-images

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-playwright-test-results
          path: 3x3-web-2/test-results/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build WASM Applications
    needs: [test-3x3-web-2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: "v0.21.14"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            2x2-web/target
            3x3-web/target
          key: ${{ runner.os }}-cargo-build-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-wasm-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: 3x3-web-2/package-lock.json

      - name: Build 2x2-web with Trunk
        run: |
          cd 2x2-web
          trunk build --release --public-url /rust-r-cube/

      - name: Build 3x3-web with Trunk
        run: |
          cd 3x3-web
          trunk build --release --public-url /rust-r-cube/3x3/

      - name: Build 3x3-web-2
        run: |
          cd 3x3-web-2
          npm ci
          npm run build

      - name: Prepare final dist
        run: |
          mkdir -p final_dist
          cp -r 2x2-web/dist/* final_dist/
          mkdir -p final_dist/3x3
          cp -r 3x3-web/dist/* final_dist/3x3/
          mkdir -p final_dist/3x3-v2
          cp -r 3x3-web-2/dist/* final_dist/3x3-v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
