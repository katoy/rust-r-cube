[package]
name = "rubiks-cube-2x2"
version = "0.1.0"
edition = "2021"
authors = ["katoy <youichikato@gmail.com>"]
description = "高速双方向BFSソルバー搭載の2x2ルービックキューブGUIアプリ"
repository = "https://github.com/katoy/rust-r-cube"
license = "MIT"
keywords = ["rubiks-cube", "solver", "gui", "game"]
categories = ["games", "visualization"]
autobins = false

[lib]
name = "rubiks_cube_2x2"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# デスクトップ用バイナリ（wasm32では無効）
[[bin]]
name = "rubiks-cube-2x2"
path = "src/bin/rubiks-cube-2x2.rs"
required-features = ["desktop"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rand = "0.8"
glam = "0.30.9"
rustc-hash = "2.1"
thiserror = "2.0"
tracing = "0.1"
rayon = "1.10"

# Web用の依存関係
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Blob", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader", "BlobPropertyBag"] }
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

# デスクトップ用の依存関係
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"

[features]
default = ["desktop"]
desktop = []

[profile.release]
opt-level = 3
lto = true
