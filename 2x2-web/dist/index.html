<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rustで実装した2x2ルービックキューブのGUIプログラム">
    <title>2x2 ルービックキューブ</title>
    
<script type="module">
import init, * as bindings from '/rubiks-cube-2x2-856150d78a115824.js';
const wasm = await init({ module_or_path: '/rubiks-cube-2x2-856150d78a115824_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
        }

        #loading h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ffffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* エラーメッセージのスタイル */
        #error {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
        }

        /* ソルバープログレスオーバーレイ */
        #solver-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #solver-overlay.active {
            display: flex;
        }

        .solver-progress-container {
            background-color: #2d2d2d;
            border-radius: 12px;
            padding: 30px;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .solver-progress-container h2 {
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 1.5em;
        }

        .solver-progress-bar {
            width: 100%;
            height: 30px;
            background-color: #444;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .solver-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .solver-elapsed-time {
            color: #aaa;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .solver-status-text {
            color: #fff;
            margin-top: 10px;
            font-size: 0.95em;
        }
    </style>
<link rel="modulepreload" href="/rubiks-cube-2x2-856150d78a115824.js" crossorigin="anonymous" integrity="sha384-J/dqw4W4WjFf3VgcqJRu6/qdO00wUeJj8CQ0i6ey9qwI4MqkenW74zjxKLgFVK0z"><link rel="modulepreload" href="/snippets/rubiks-cube-2x2-b7de590f2ad053bb/inline0.js" crossorigin="anonymous" integrity="sha384-OaW0PlvsU8SrHqOqS9dmTpO7eY6FOi5UvDN5LU7c3Bew94SBzCuGQ+Tas2mF+mFM"><link rel="preload" href="/rubiks-cube-2x2-856150d78a115824_bg.wasm" crossorigin="anonymous" integrity="sha384-tmZzucx/Vu8TV1Ia14xUrx8Apj3g1tCU4wb+U/QPLYheEEGY5z3U3odjGfVB6g72" as="fetch" type="application/wasm"></head>

<body>
    <div id="loading">
        <h1>🎮 2x2 ルービックキューブ</h1>
        <div class="spinner"></div>
        <p>読み込み中...</p>
    </div>

    <div id="error">
        <h2>エラーが発生しました</h2>
        <p id="error-message"></p>
    </div>

    <!-- ソルバープログレスオーバーレイ -->
    <div id="solver-overlay">
        <div class="solver-progress-container">
            <h2>🧩 解法を探索中...</h2>
            <div class="solver-elapsed-time" id="solver-elapsed-time">経過時間: 0.0秒</div>
            <div class="solver-status-text">お待ちください（通常5〜15秒かかります）</div>
        </div>
    </div>

    <canvas id="the_canvas_id"></canvas>

    <script>
        // ソルバープログレス表示（経過時間付き）
        let solverStartTime = null;
        let solverElapsedInterval = null;

        window.showSolverProgress = function () {
            const overlay = document.getElementById('solver-overlay');
            const elapsedText = document.getElementById('solver-elapsed-time');

            // オーバーレイを表示
            overlay.classList.add('active');

            // 経過時間の計測開始
            solverStartTime = Date.now();
            elapsedText.textContent = '経過時間: 0.0秒';

            // 100msごとに経過時間を更新
            solverElapsedInterval = setInterval(() => {
                const elapsed = (Date.now() - solverStartTime) / 1000;
                elapsedText.textContent = `経過時間: ${elapsed.toFixed(1)}秒`;
            }, 100);
        };

        window.hideSolverProgress = function () {
            const overlay = document.getElementById('solver-overlay');

            // インターバルをクリア
            if (solverElapsedInterval) {
                clearInterval(solverElapsedInterval);
                solverElapsedInterval = null;
            }

            // オーバーレイを非表示
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 300);
        };

        // Trunkが自動挿入したWASMモジュールの読み込み完了を待つ
        window.addEventListener('TrunkApplicationStarted', async (event) => {
            try {
                // Rustのstart関数を呼び出してアプリを起動
                await window.wasmBindings.start('the_canvas_id');

                // ローディング画面を非表示
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Failed to start application:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = error.toString();
            }
        });
    </script>
</body>

</html>
