<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rustで実装した2x2ルービックキューブのGUIプログラム">
    <title>2x2 ルービックキューブ</title>
    <link data-trunk rel="rust" data-target-name="rubiks_cube_2x2" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
        }

        #loading h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ffffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* エラーメッセージのスタイル */
        #error {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="loading">
        <h1>🎮 2x2 ルービックキューブ</h1>
        <div class="spinner"></div>
        <p>読み込み中...</p>
    </div>

    <div id="error">
        <h2>エラーが発生しました</h2>
        <p id="error-message"></p>
    </div>

    <canvas id="the_canvas_id"></canvas>

    <script>
        // Trunkが自動挿入したWASMモジュールの読み込み完了を待つ
        window.addEventListener('TrunkApplicationStarted', async (event) => {
            try {
                // Rustのstart関数を呼び出してアプリを起動
                await window.wasmBindings.start('the_canvas_id');

                // ローディング画面を非表示
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Failed to start application:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = error.toString();
            }
        });
    </script>
</body>

</html>
