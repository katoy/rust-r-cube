[package]
name = "cube-studio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser-native Rubik's cube studio powered by Rust"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-time = "1"

[profile.release]
opt-level = 3
lto = true

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
