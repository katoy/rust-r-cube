ティエラー\n    #[error(\"コーナーパリティエラー: {0}\")]\n    CornerParity(String),\n}\n\n/// Result型のエイリアス\npub type Result\u003cT\u003e = std::result::Result\u003cT, CubeError\u003e;\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","gui","app.rs"],"content":"use crate::cube::{Color, Cube, Move};\nuse crate::gui::constants::*;\nuse crate::gui::renderer_3d::{draw_cube_3d, View3D};\nuse crate::history::History;\nuse crate::solver;\nuse crate::statistics::Statistics;\nuse std::sync::mpsc::Receiver;\n\nuse web_time::Instant;\n\n#[cfg(not(target_arch = \"wasm32\"))]\nuse std::sync::mpsc::channel;\n#[cfg(not(target_arch = \"wasm32\"))]\nuse std::thread;\n\n#[cfg(target_arch = \"wasm32\")]\nuse wasm_bindgen::prelude::*;\n\n// WASM環境で確認ダイアログとUI更新後のコールバック実行\n#[cfg(target_arch = \"wasm32\")]\n#[wasm_bindgen(inline_js = \"\n    export function confirm_solver_start() {\n        console.log('🔍 confirm_solver_start called at', Date.now());\n        const result = confirm('Kociemba アルゴリズムによる解法を探索します。\\\\nよろしいですか？');\n        console.log('✅ confirm result:', result, 'at', Date.now());\n        return result;\n    }\n\n    // UI更新を待ってからコールバックを実行\n    // requestAnimationFrameを2回使うことで、確実に描画後に実行\n    export function schedule_after_render(callback) {\n        console.log('📅 Scheduling callback after render');\n        requestAnimationFrame(() =\u003e {\n            requestAnimationFrame(() =\u003e {\n                console.log('🎬 Executing callback after render');\n                callback();\n            });\n        });\n    }\n\")]\nextern \"C\" {\n    fn confirm_solver_start() -\u003e bool;\n\n    #[wasm_bindgen(js_name = schedule_after_render)]\n    fn schedule_after_render(callback: \u0026Closure\u003cdyn FnMut()\u003e);\n}\n\n/// スクランブルの最小手数\n#[allow(dead_code)]\nconst MIN_SCRAMBLE_MOVES: usize = 5;\n\n/// スクランブルの最大手数\nconst MAX_SCRAMBLE_MOVES: usize = 20;\n\n/// デフォルトのアニメーション時間(秒)\nconst DEFAULT_ANIMATION_DURATION: f32 = 0.3;\n\n/// アニメーション速度の最小値\n#[allow(dead_code)]\nconst MIN_ANIMATION_SPEED: f32 = 0.1;\n\n/// アニメーション速度の最大値\n#[allow(dead_code)]\nconst MAX_ANIMATION_SPEED: f32 = 2.0;\n\n/// ズーム倍率の制限\nconst ZOOM_MIN: f32 = 0.1;\nconst ZOOM_MAX: f32 = 5.0;\n\n/// キューブの表示モードを定義します。\n#[derive(Debug, PartialEq, Eq, Clone, Copy)]\npub enum ViewMode {\n    /// 2D 展開図のみ表示\n    TwoD,\n    /// 3D ビューのみ表示\n    ThreeD,\n    /// 2D と 3D を両方表示\n    Both,\n}\n\n/// ユーザーの入力状態を定義します。\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum InputState {\n    /// 通常の状態\n    Normal,\n    /// 6面スキャン入力モード\n    Scanning {\n        /// 現在入力中の面のインデックス (0-5: U, D, L, R, F, B)\n        face_index: usize,\n    },\n}\n\n/// アニメーションのイージング（加減速）モードを定義します。\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum EasingMode {\n    /// 通常 (加速してから減速)\n    EaseInOut,\n    /// 前半部分 (加速のみ、180度回転の分割前半などで使用)\n    EaseIn,\n    /// 後半部分 (減速のみ、180度回転の分割後半などで使用)\n    EaseOut,\n}\n\n/// 現在実行中のアニメーションの状態を管理する構造体。\n#[derive(Debug, Clone)]\npub struct AnimationState {\n    /// 実行中の操作\n    pub current_move: Move,\n    /// 進捗率 (0.0 から 1.0)\n    pub progress: f32,\n    /// アニメーション開始時刻\n    pub start_time: Instant,\n    /// アニメーションの総時間（秒）\n    pub duration: f32,\n    /// 使用するイージングモード\n    pub easing: EasingMode,\n}\n\nimpl AnimationState {\n    /// 新しいアニメーション状態を作成します（標準の EaseInOut）。\n    pub fn new(mv: Move, duration: f32) -\u003e Self {\n        Self {\n            current_move: mv,\n            progress: 0.0,\n            start_time: Instant::now(),\n            duration,\n            easing: EasingMode::EaseInOut,\n        }\n    }\n\n    /// イージングモードを指定して、新しいアニメーション状態を作成します。\n    pub fn with_easing(mv: Move, duration: f32, easing: EasingMode) -\u003e Self {\n        Self {\n            current_move: mv,\n            progress: 0.0,\n            start_time: Instant::now(),\n            duration,\n            easing,\n        }\n    }\n\n    /// 経過時間に基づいて進捗率を更新します。\n    ///\n    /// # 戻り値\n    ///\n    /// アニメーションが完了した（1.0 に達した）場合は `true` を返します。\n    pub fn update(\u0026mut self) -\u003e bool {\n        if self.duration \u003c= 0.001 {\n            self.progress = 1.0;\n            return true;\n        }\n        let elapsed = self.start_time.elapsed().as_secs_f32();\n        self.progress = (elapsed / self.duration).min(1.0);\n        self.progress \u003e= 1.0\n    }\n\n    /// イージングモードに基づいた現在の進捗率（計算値）を取得します。\n    pub fn eased_progress(\u0026self) -\u003e f32 {\n        let t = self.progress;\n        match self.easing {\n            EasingMode::EaseInOut =\u003e {\n                if t \u003c 0.5 {\n                    2.0 * t * t\n                } else {\n                    -1.0 + (4.0 - 2.0 * t) * t\n                }\n            }\n            EasingMode::EaseIn =\u003e t * t,\n            EasingMode::EaseOut =\u003e 1.0 - (1.0 - t) * (1.0 - t),\n        }\n    }\n}\n\n/// アプリケーションのメイン状態を保持する構造体。\npub struct CubeApp {\n    /// 現在のキューブの状態\n    cube: Cube,\n    /// 現在実行中のアニメーション（実行されていない場合は `None`）\n    animation: Option\u003cAnimationState\u003e,\n    /// 未実行の操作キュー\n    move_queue: Vec\u003c(Move, Option\u003cEasingMode\u003e, Option\u003cf32\u003e)\u003e,\n    /// アニメーションの速度（1手あたりの秒数）\n    pub animation_speed: f32,\n    /// ソルバーが見つけた解決手順（見つかっていない場合は `None`）\n    pub solution: Option\u003cVec\u003cMove\u003e\u003e,\n    /// 現在ソルバーが探索中かどうか\n    pub solving: bool,\n    /// ソルバーの現在の探索進捗率 (0.0 - 1.0)\n    pub solver_progress: f32,\n    /// ソルバーの状態テキスト（「探索中...」など）\n    pub solution_text: String,\n\n    /// 現在の表示モード（2D, 3D, Both）\n    pub view_mode: ViewMode,\n    /// 3Dビューのカメラ・倍率設定\n    pub view_3d: View3D,\n\n    /// ソルバーからの結果受信用レシーバ\n    solver_receiver: Option\u003cReceiver\u003csolver::Solution\u003e\u003e,\n    /// ソルバーからの進捗受信用レシーバ\n    progress_receiver: Option\u003cReceiver\u003cf32\u003e\u003e,\n\n    /// 解法手順をたどる際の現在のステップ番号\n    pub solution_step: usize,\n    /// 解法開始前のキューブの状態（リセット用）\n    pub solution_cube_state: Option\u003cCube\u003e,\n    /// アニメーション完了後にステップ番号を更新するための保留値\n    pending_solution_update: Option\u003cisize\u003e,\n\n    /// ソルバーがステッカーの向きを無視するかどうか\n    pub ignore_orientation: bool,\n\n    /// 探索開始時刻\n    pub solving_start_time: Option\u003cInstant\u003e,\n    /// 前回の探索にかかった時間（秒）\n    pub last_solve_duration: Option\u003cf32\u003e,\n\n    /// モードに応じた入力状態（通常、スキャンモード）\n    pub input_state: InputState,\n    /// 6面スキャン入力中の色データ一時保持用\n    pub input_buffer: [Option\u003cColor\u003e; 54],\n    /// 入力パネルで選択されている色\n    pub selected_input_color: Color,\n    /// 入力中のエラーメッセージ（不正なパリティなど）\n    pub input_error_message: String,\n\n    /// 開発者用オプション：パリティチェック（物理的妥当性）をスキップするか\n    pub skip_parity_check: bool,\n\n    /// 現在実行中のソルバータスクの種類\n    pub solver_task: SolverTask,\n\n    /// 解法時間などの統計情報\n    pub statistics: Statistics,\n\n    /// 手動操作の履歴 (Undo/Redo用)\n    pub history: History,\n\n    /// WASM環境でのソルバー起動ペンディング状態\n    #[cfg(target_arch = \"wasm32\")]\n    pending_solver_start: Option\u003c(SolverTask, bool, u8)\u003e, // (task, ignore_orientation, frames_to_wait)\n\n    /// WASM環境用: インクリメンタルソルバーの状態\n    #[cfg(target_arch = \"wasm32\")]\n    solver_state: Option\u003csolver::SolverState\u003e,\n\n    /// ファイル読み込み用のレシーバー\n    file_receiver: Option\u003cReceiver\u003cResult\u003cString, String\u003e\u003e\u003e,\n}\n\n/// ソルバーのタスク種類\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum SolverTask {\n    Normal, // 通常の解法探索\n}\n\nimpl Default for CubeApp {\n    fn default() -\u003e Self {\n        Self {\n            cube: Cube::new(),\n            animation: None,\n            move_queue: Vec::new(),\n            animation_speed: DEFAULT_ANIMATION_DURATION,\n            solution: None,\n            solving: false,\n            solver_progress: 0.0,\n            solution_text: String::new(),\n            view_mode: ViewMode::Both,\n            view_3d: View3D::default(),\n            solver_receiver: None,\n            progress_receiver: None,\n            solution_step: 0,\n            solution_cube_state: None,\n            pending_solution_update: None,\n            ignore_orientation: false,\n            solving_start_time: None,\n            last_solve_duration: None,\n            input_state: InputState::Normal,\n            input_buffer: [None; 54],\n            selected_input_color: Color::White,\n            input_error_message: String::new(),\n            skip_parity_check: false,\n            solver_task: SolverTask::Normal,\n            statistics: Statistics::new(),\n            history: History::new(),\n            file_receiver: None,\n            #[cfg(target_arch = \"wasm32\")]\n            pending_solver_start: None,\n            #[cfg(target_arch = \"wasm32\")]\n            solver_state: None,\n        }\n    }\n}\n\nimpl CubeApp {\n    pub fn new(cc: \u0026eframe::CreationContext\u003c'_\u003e) -\u003e Self {\n        tracing::info!(\"CubeApp::new starting\");\n        // 日本語フォントを設定\n        Self::setup_custom_fonts(\u0026cc.egui_ctx);\n\n        // 必要に応じてフォントサイズを調整\n        let mut style = (*cc.egui_ctx.style()).clone();\n        style.text_styles.insert(\n            egui::TextStyle::Body,\n            egui::FontId::new(UI_BODY_FONT_SIZE, egui::FontFamily::Proportional),\n        );\n        style.text_styles.insert(\n            egui::TextStyle::Button,\n            egui::FontId::new(UI_BODY_FONT_SIZE, egui::FontFamily::Proportional),\n        );\n        style.text_styles.insert(\n            egui::TextStyle::Heading,\n            egui::FontId::new(UI_HEADING_FONT_SIZE, egui::FontFamily::Proportional),\n        );\n        cc.egui_ctx.set_style(style);\n\n        tracing::info!(\"CubeApp::new calling Self::default()\");\n        let app = Self::default();\n        tracing::info!(\"CubeApp::new finishing\");\n        app\n    }\n\n    /// 回転操作をキューに追加\n    pub fn queue_move(\u0026mut self, mv: Move) {\n        self.move_queue.push((mv, None, None));\n        self.statistics.record_manual_move();\n        self.history.push(mv);\n    }\n\n    /// 複数の回転操作をキューに追加\n    pub fn queue_moves(\u0026mut self, moves: Vec\u003cMove\u003e) {\n        for mv in moves {\n            self.move_queue.push((mv, None, None));\n        }\n    }\n\n    /// スクランブル\n    pub fn scramble(\u0026mut self) {\n        self.cube = Cube::new();\n        self.cube.scramble(MAX_SCRAMBLE_MOVES);\n        self.solution = None;\n        self.solution_text.clear();\n        self.move_queue.clear();\n        self.history.clear();\n        self.animation = None;\n        self.pending_solution_update = None;\n    }\n\n    /// Undo: 最後の手動操作を取り消す\n    pub fn undo(\u0026mut self) {\n        if let Some(inverse_move) = self.history.undo() {\n            self.move_queue.push((inverse_move, None, None));\n        }\n    }\n\n    /// Redo: 取り消した操作をやり直す\n    pub fn redo(\u0026mut self) {\n        if let Some(mv) = self.history.redo() {\n            self.move_queue.push((mv, None, None));\n        }\n    }\n\n    /// リセット\n    pub fn reset(\u0026mut self) {\n        self.cube = Cube::new();\n        self.cancel_solve();\n        self.animation = None;\n        self.pending_solution_update = None;\n    }\n\n    /// ソルバーの探索を中止\n    pub fn cancel_solve(\u0026mut self) {\n        self.solving = false;\n        self.solution = None;\n        self.solution_text.clear();\n        self.solver_receiver = None;\n        self.progress_receiver = None;\n        self.move_queue.clear();\n\n        #[cfg(target_arch = \"wasm32\")]\n        {\n            self.solver_state = None;\n        }\n    }\n\n    /// ソルバー実行（通常）\n    pub fn solve(\u0026mut self) {\n        #[cfg(target_arch = \"wasm32\")]\n        {\n            // WASM環境では、状態を変更する前に確認ダイアログを表示\n            if !confirm_solver_start() {\n                // ユーザーがキャンセルした場合は何もせずに終了\n                return;\n            }\n            self.solve_without_confirm();\n        }\n\n        #[cfg(not(target_arch = \"wasm32\"))]\n        {\n            self.start_solver_internal(SolverTask::Normal, self.ignore_orientation);\n        }\n    }\n\n    /// 確認ダイアログなしでソルバーを開始（テスト用および内部用）\n    pub fn solve_without_confirm(\u0026mut self) {\n        self.start_solver_internal(SolverTask::Normal, self.ignore_orientation);\n    }\n\n    /// 向きの自動復元を開始（即時）\n    pub fn start_restore_orientation(\u0026mut self) {\n        if let Err(e) = self.cube.restore_orientation_instantly() {\n            self.input_error_message = format!(\"向きの復元に失敗しました: {}\", e);\n        }\n    }\n\n    /// ソルバー実行の内部処理\n    fn start_solver_internal(\u0026mut self, task: SolverTask, ignore_orientation: bool) {\n        if self.solving {\n            return;\n        }\n\n        // WASM環境での処理\n        #[cfg(target_arch = \"wasm32\")]\n        {\n            // WASM環境: ペンディング状態を設定（2フレーム後に起動）\n            // これによりUIが確実に更新される時間を確保\n            self.pending_solver_start = Some((task, ignore_orientation, 2));\n            self.solving = true;\n            self.solver_task = task;\n            self.solver_progress = 0.0;\n            match task {\n                SolverTask::Normal =\u003e self.solution_text = \"探索中...\".to_string(),\n            }\n            self.solving_start_time = Some(Instant::now());\n            self.solution_cube_state = Some(self.cube.clone());\n            self.solution_step = 0;\n            return;\n        }\n\n        // デスクトップ環境: ここから実際のソルバー処理を開始\n        #[cfg(not(target_arch = \"wasm32\"))]\n        {\n            self.solving = true;\n            self.solver_task = task;\n            self.solver_progress = 0.0;\n\n            match task {\n                SolverTask::Normal =\u003e self.solution_text = \"探索中...\".to_string(),\n            }\n\n            self.solving_start_time = Some(Instant::now()); // 開始時刻を記録\n\n            // 解法開始時の状態を保存\n            self.solution_cube_state = Some(self.cube.clone());\n            self.solution_step = 0;\n\n            let cube_clone = self.cube.clone();\n            let (tx, rx) = channel();\n            let (progress_tx, progress_rx) = channel();\n            self.solver_receiver = Some(rx);\n            self.progress_receiver = Some(progress_rx);\n\n            // デスクトップ環境: 別スレッドで実行（UIをブロックしない）\n            thread::spawn(move || {\n                let max_depth = solver::DEFAULT_MAX_DEPTH;\n                println!(\n                    \"ソルバー開始: 深度{}まで探索 (タスク: {:?})\",\n                    max_depth, task\n                );\n                let solution = solver::solve_with_progress(\n                    \u0026cube_clone,\n                    max_depth,\n                    ignore_orientation,\n                    Some(progress_tx),\n                );\n                println!(\n                    \"ソルバー完了: 解が{}\",\n                    if solution.found {\n                        \"見つかりました\"\n                    } else {\n                        \"見つかりませんでした\"\n                    }\n                );\n                if solution.found {\n                    println!(\"解の手数: {}\", solution.moves.len());\n                }\n                if let Err(e) = tx.send(solution) {\n                    eprintln!(\"ソルバー結果の送信に失敗しました: {:?}\", e);\n                }\n            });\n        }\n    }\n\n    /// アニメーション更新\n    fn update_animation(\u0026mut self) {\n        if let Some(ref mut anim) = self.animation {\n            if anim.update() {\n                // アニメーション完了\n                self.animation = None;\n\n                // ソルーション再生中の場合、ステップ数を更新\n                if let Some(delta) = self.pending_solution_update {\n                    if delta \u003e 0 {\n                        self.solution_step += delta as usize;\n                    } else if delta \u003c 0 {\n                        self.solution_step = self.solution_step.saturating_sub((-delta) as usize);\n                    }\n                    self.pending_solution_update = None;\n                }\n            }\n        } else if let Some((mv, easing_override, duration_override)) =\n            self.move_queue.first().copied()\n        {\n            // 次の操作を開始\n            self.move_queue.remove(0);\n\n            if let Some(easing) = easing_override {\n                // 指定されたイージングで実行 (分割後半など)\n                let duration = duration_override.unwrap_or(self.animation_speed);\n                self.cube.apply_move(mv);\n                self.animation = Some(AnimationState::with_easing(mv, duration, easing));\n            } else if let Some(single_mv) = mv.split_to_single() {\n                // 180度回転の場合、90度回転2回に分割する\n                // F2をF1枚分の時間で終わらせるため、各アニメーションの長さは半分\n                let half_duration = self.animation_speed * ANIMATION_SPLIT_DURATION_FACTOR;\n\n                // 1回目の90度回転 (加速のみ)\n                self.cube.apply_move(single_mv);\n                self.animation = Some(AnimationState::with_easing(\n                    single_mv,\n                    half_duration,\n                    EasingMode::EaseIn,\n                ));\n                // 2回目の90度回転 (減速のみ) をキューの先頭に挿入\n                self.move_queue.insert(\n                    0,\n                    (single_mv, Some(EasingMode::EaseOut), Some(half_duration)),\n                );\n            } else {\n                // 通常の90度回転\n                self.cube.apply_move(mv);\n                self.animation = Some(AnimationState::new(mv, self.animation_speed));\n            }\n        }\n    }\n\n    /// ソルバーの結果を確認\n    fn check_solver_result(\u0026mut self) {\n        if let Some(rx) = \u0026self.solver_receiver {\n            if let Ok(solution) = rx.try_recv() {\n                self.solving = false;\n                self.solver_receiver = None;\n                self.progress_receiver = None;\n\n                // 所要時間を計算\n                if let Some(start_time) = self.solving_start_time.take() {\n                    let duration = start_time.elapsed().as_secs_f32();\n                    self.last_solve_duration = Some(duration);\n                }\n\n                if solution.found {\n                    match self.solver_task {\n                        SolverTask::Normal =\u003e {\n                            self.solution = Some(solution.moves.clone());\n                            let duration_text = if let Some(d) = self.last_solve_duration {\n                                format!(\" ({:.2}秒)\", d)\n                            } else {\n                                String::new()\n                            };\n                            self.solution_text =\n                                format!(\"解法: {} 手{}\", solution.moves.len(), duration_text);\n                            self.solution_step = 0;\n                            // 自動実行はしない（ステップ操作で手動実行）\n                        }\n                    }\n                } else {\n                    self.solution = None;\n                    match self.solver_task {\n                        SolverTask::Normal =\u003e {\n                            self.solution_text = \"解が見つかりませんでした\".to_string()\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    /// ソルバーの進捗を確認\n    fn check_progress(\u0026mut self) {\n        if let Some(rx) = \u0026self.progress_receiver {\n            while let Ok(progress) = rx.try_recv() {\n                self.solver_progress = progress;\n            }\n        }\n    }\n\n    /// キューブの状態を取得\n    pub fn cube(\u0026self) -\u003e \u0026Cube {\n        \u0026self.cube\n    }\n\n    /// 描画に使用するキューブを取得\n    ///\n    /// スキャンモード中は入力バッファから一時キューブを生成して返し、\n    /// 通常モードは実際のキューブを返します。\n    pub fn display_cube(\u0026self) -\u003e Cube {\n        match \u0026self.input_state {\n            InputState::Scanning { .. } =\u003e {\n                // スキャンモード中: 入力バッファから一時キューブを生成\n                // 未入力のステッカーはデフォルトの色（グレー風）にする\n                let mut colors = [Color::Gray; 54];\n\n                for (i, maybe_color) in self.input_buffer.iter().enumerate() {\n                    if let Some(color) = maybe_color {\n                        colors[i] = *color;\n                    }\n                }\n\n                Cube::from_colors(\u0026colors).unwrap_or_else(|_| Cube::new())\n            }\n            InputState::Normal =\u003e {\n                // 通常モード: 実際のキューブを返す\n                self.cube.clone()\n            }\n        }\n    }\n\n    /// 編集中の面のインデックスを取得（ハイライト表示用）\n    ///\n    /// スキャンモード中は現在編集中の面のインデックス（0-5）を返し、\n    /// 通常モードはNoneを返します。\n    pub fn editing_face_index(\u0026self) -\u003e Option\u003cusize\u003e {\n        match \u0026self.input_state {\n            InputState::Scanning { face_index } =\u003e Some(*face_index),\n            InputState::Normal =\u003e None,\n        }\n    }\n\n    /// アニメーション状態を取得\n    pub fn animation(\u0026self) -\u003e Option\u003c\u0026AnimationState\u003e {\n        self.animation.as_ref()\n    }\n\n    /// 解法の次のステップへ進む\n    pub fn solution_step_forward(\u0026mut self) {\n        if self.animation.is_some() || !self.move_queue.is_empty() {\n            return;\n        }\n        if let Some(solution) = \u0026self.solution {\n            if self.solution_step \u003c solution.len() {\n                let mv = solution[self.solution_step];\n                self.move_queue.push((mv, None, None));\n                self.pending_solution_update = Some(1);\n            }\n        }\n    }\n\n    /// 解法の前のステップへ戻る\n    pub fn solution_step_backward(\u0026mut self) {\n        if self.animation.is_some() || !self.move_queue.is_empty() {\n            return;\n        }\n        if let Some(solution) = \u0026self.solution {\n            if self.solution_step \u003e 0 {\n                let mv = solution[self.solution_step - 1];\n                let inverse_mv = mv.inverse();\n                self.move_queue.push((inverse_mv, None, None));\n                self.pending_solution_update = Some(-1);\n            }\n        }\n    }\n\n    /// 解法の最初へ戻る\n    pub fn solution_step_reset(\u0026mut self) {\n        if let Some(cube_state) = \u0026self.solution_cube_state {\n            self.cube = cube_state.clone();\n            self.solution_step = 0;\n        }\n    }\n\n    /// 解法を最後まで実行\n    pub fn solution_step_to_end(\u0026mut self) {\n        if let Some(solution) = \u0026self.solution {\n            // アニメーション中は実行しない\n            if self.animation.is_some() {\n                return;\n            }\n\n            // 残りの手を全て即座に適用\n            while self.solution_step \u003c solution.len() {\n                let mv = solution[self.solution_step];\n                self.cube.apply_move(mv);\n                self.solution_step += 1;\n            }\n        }\n    }\n\n    fn setup_custom_fonts(ctx: \u0026egui::Context) {\n        tracing::info!(\"setup_custom_fonts starting\");\n        let mut fonts = egui::FontDefinitions::default();\n\n        tracing::info!(\"Loading font data\");\n        fonts.font_data.insert(\n            \"NotoSansCJKjp\".to_owned(),\n            egui::FontData::from_static(include_bytes!(\n                \"../../assets/fonts/NotoSansCJKjp-Regular.otf\"\n            )),\n        );\n\n        tracing::info!(\"Setting font families\");\n        fonts\n            .families\n            .entry(egui::FontFamily::Proportional)\n            .or_default()\n            .insert(0, \"NotoSansCJKjp\".to_owned());\n\n        fonts\n            .families\n            .entry(egui::FontFamily::Monospace)\n            .or_default()\n            .insert(0, \"NotoSansCJKjp\".to_owned());\n\n        tracing::info!(\"Applying fonts to context\");\n        ctx.set_fonts(fonts);\n        tracing::info!(\"setup_custom_fonts finishing\");\n    }\n\n    /// 3Dビューの描画処理\n    fn show_3d_view(\u0026mut self, ui: \u0026mut egui::Ui) {\n        let available = ui.available_size();\n        let size = available.x.min(available.y);\n        let y_offset = (available.y - size) / 2.0;\n\n        if y_offset \u003e 0.0 {\n            ui.add_space(y_offset);\n        }\n\n        ui.horizontal(|ui| {\n            let x_offset = (ui.available_width() - size) / 2.0;\n            if x_offset \u003e 0.0 {\n                ui.add_space(x_offset);\n            }\n\n            // 描画領域 (正方形)\n            let rect_size = egui::vec2(size, size);\n            let (rect, response) = ui.allocate_at_least(rect_size, egui::Sense::drag());\n\n            // 3Dビュー操作\n            if response.dragged() {\n                self.view_3d.yaw += response.drag_delta().x * MOUSE_SENSITIVITY;\n                self.view_3d.pitch += response.drag_delta().y * MOUSE_SENSITIVITY;\n\n                // Pitch制限\n                self.view_3d.pitch = self.view_3d.pitch.clamp(\n                    -std::f32::consts::FRAC_PI_2 + VIEW3D_PITCH_LIMIT_MARGIN,\n                    std::f32::consts::FRAC_PI_2 - VIEW3D_PITCH_LIMIT_MARGIN,\n                );\n            }\n            // ズーム操作\n            let scroll_delta = ui.input(|i| i.raw_scroll_delta.y);\n            if scroll_delta != 0.0 {\n                self.view_3d.scale *= if scroll_delta \u003e 0.0 {\n                    ZOOM_FACTOR\n                } else {\n                    1.0 / ZOOM_FACTOR\n                };\n                self.view_3d.scale = self.view_3d.scale.clamp(ZOOM_MIN, ZOOM_MAX);\n            }\n\n            let display_cube = self.display_cube();\n            let highlight_face = self.editing_face_index();\n            draw_cube_3d(\n                ui,\n                rect,\n                \u0026display_cube,\n                self.animation.as_ref(),\n                \u0026self.view_3d,\n                highlight_face,\n            );\n        });\n    }\n\n    /// 2Dビューの描画処理\n    fn show_2d_view(\u0026mut self, ui: \u0026mut egui::Ui) {\n        let available = ui.available_size();\n        let size = available.x.min(available.y);\n\n        let (rect, _response) =\n            ui.allocate_exact_size(egui::vec2(available.x, size), egui::Sense::hover());\n\n        let display_cube = self.display_cube();\n        let highlight_face = self.editing_face_index();\n        crate::gui::renderer::draw_cube(\n            ui,\n            rect,\n            \u0026display_cube,\n            self.animation.as_ref(),\n            highlight_face,\n        );\n    }\n\n    // ============ 6面スキャン入力モード用メソッド ============\n\n    /// スキャンモードを開始\n    pub fn start_scanning_mode(\u0026mut self) {\n        self.input_state = InputState::Scanning { face_index: 0 };\n        self.input_buffer = [None; 54];\n        self.selected_input_color = Color::White;\n        self.input_error_message.clear();\n    }\n\n    /// スキャンモードをキャンセル\n    pub fn cancel_scanning_mode(\u0026mut self) {\n        self.input_state = InputState::Normal;\n        self.input_buffer = [None; 54];\n        self.input_error_message.clear();\n    }\n\n    /// 次の面へ進む\n    pub fn next_face(\u0026mut self) {\n        if let InputState::Scanning { face_index } = self.input_state {\n            if face_index \u003c 5 {\n                self.input_state = InputState::Scanning {\n                    face_index: face_index + 1,\n                };\n            }\n        }\n    }\n\n    /// 前の面へ戻る\n    pub fn prev_face(\u0026mut self) {\n        if let InputState::Scanning { face_index } = self.input_state {\n            if face_index \u003e 0 {\n                self.input_state = InputState::Scanning {\n                    face_index: face_index - 1,\n                };\n            }\n        }\n    }\n\n    /// 現在の面のステッカーに色を設定\n    /// position: 面内の位置 0-3 (左上、右上、左下、右下)\n    pub fn set_current_face_sticker(\u0026mut self, position: usize, color: Color) {\n        if let InputState::Scanning { face_index } = self.input_state {\n            let global_index = face_index * 9 + position;\n            if global_index \u003c 54 {\n                self.input_buffer[global_index] = Some(color);\n            }\n        }\n    }\n\n    /// 現在の面の指定位置のステッカー色を取得\n    pub fn get_current_face_sticker(\u0026self, position: usize) -\u003e Option\u003cColor\u003e {\n        if let InputState::Scanning { face_index } = self.input_state {\n            let global_index = face_index * 9 + position;\n            if global_index \u003c 54 {\n                return self.input_buffer[global_index];\n            }\n        }\n        None\n    }\n\n    /// 現在の面の名前を取得\n    pub fn get_current_face_name(\u0026self) -\u003e \u0026str {\n        if let InputState::Scanning { face_index } = self.input_state {\n            match face_index {\n                0 =\u003e \"Up (上面)\",\n                1 =\u003e \"Down (下面)\",\n                2 =\u003e \"Left (左面)\",\n                3 =\u003e \"Right (右面)\",\n                4 =\u003e \"Front (前面)\",\n                5 =\u003e \"Back (背面)\",\n                _ =\u003e \"不明\",\n            }\n        } else {\n            \"不明\"\n        }\n    }\n\n    /// 現在の面が全て入力済みかチェック\n    pub fn is_current_face_complete(\u0026self) -\u003e bool {\n        if let InputState::Scanning { face_index } = self.input_state {\n            let start = face_index * 9;\n            let end = start + 9;\n            return self.input_buffer[start..end].iter().all(|c| c.is_some());\n        }\n        false\n    }\n\n    /// スキャン完了（キューブに反映）\n    pub fn finish_scanning(\u0026mut self) {\n        // 全てのステッカーが入力されているかチェック\n        if self.input_buffer.iter().any(|c| c.is_none()) {\n            self.input_error_message = \"全ての面を入力してください\".to_string();\n            return;\n        }\n\n        // Option\u003cColor\u003eをColorに変換\n        let colors: [Color; 54] = self\n            .input_buffer\n            .iter()\n            .map(|c| c.expect(\"全ての色が入力されています\"))\n            .collect::\u003cVec\u003c_\u003e\u003e()\n            .try_into()\n            .expect(\"配列は54要素です\");\n\n        // 妥当性チェック\n        if let Err(e) = Cube::validate_colors(\u0026colors) {\n            self.input_error_message = e.to_string();\n            return;\n        }\n\n        // キューブに反映\n        let new_cube = match Cube::from_colors(\u0026colors) {\n            Ok(cube) =\u003e cube,\n            Err(e) =\u003e {\n                self.input_error_message = format!(\"キューブの作成に失敗: {}\", e);\n                return;\n            }\n        };\n\n        // パリティチェック（物理的に可能な配置かチェック）\n        if !self.skip_parity_check {\n            if let Err(e) = new_cube.is_valid_state() {\n                self.input_error_message = format!(\"無効なキューブ状態: {}\", e);\n                return;\n            }\n        }\n\n        self.cube = new_cube;\n        self.input_state = InputState::Normal;\n        self.input_buffer = [None; 54];\n        self.input_error_message.clear();\n\n        // 向きの自動復元（即時）\n        if let Err(e) = self.cube.restore_orientation_instantly() {\n            self.input_error_message = format!(\"警告: 向きの復元に失敗しました ({})\", e);\n        }\n\n        // 解法やアニメーションをクリア\n        self.solution = None;\n        self.solution_text.clear();\n        self.animation = None;\n        self.move_queue.clear();\n    }\n\n    /// キューブの状態をファイルに保存\n    pub fn save_to_file(\u0026self, path: \u0026str) -\u003e Result\u003c(), String\u003e {\n        // 現在表示されているキューブ（スキャン中なら入力バッファベース）を保存\n        let content = self.display_cube().to_file_format();\n        std::fs::write(path, content).map_err(|e| format!(\"ファイルの保存に失敗しました: {}\", e))\n    }\n\n    /// ファイルからキューブの状態を読み込み\n    pub fn load_from_file(\u0026mut self, path: \u0026str) -\u003e Result\u003cString, String\u003e {\n        let content = std::fs::read_to_string(path)\n            .map_err(|e| format!(\"ファイルの読み込みに失敗しました: {}\", e))?;\n\n        self.load_from_content(\u0026content)\n    }\n\n    /// 文字列（ファイル内容）からキューブの状態を読み込み\n    pub fn load_from_content(\u0026mut self, content: \u0026str) -\u003e Result\u003cString, String\u003e {\n        let loaded_cube = Cube::from_file_format(content).map_err(|e| e.to_string())?;\n\n        let mut warning = String::new();\n\n        // 読み込んだキューブに Gray (未設定) が含まれているかチェック\n        let has_gray = loaded_cube.stickers.iter().any(|s| s.color == Color::Gray);\n\n        if has_gray {\n            // スキャンモードとして復元\n            self.input_state = InputState::Scanning { face_index: 0 };\n            for (i, sticker) in loaded_cube.stickers.iter().enumerate() {\n                self.input_buffer[i] = if sticker.color == Color::Gray {\n                    None\n                } else {\n                    Some(sticker.color)\n                };\n            }\n            self.cube = Cube::new(); // 内部状態はリセット\n            warning = \"スキャン途中の状態を読み込みました\".to_string();\n        } else {\n            // 通常のキューブとして復元\n            let mut new_cube = loaded_cube;\n\n            // 全ての向きが0（旧形式またはリセット直後）の場合のみ、向きの自動復元を試みる\n            let all_zero_orientation = new_cube.stickers.iter().all(|s| s.orientation == 0);\n            if all_zero_orientation {\n                if let Err(e) = new_cube.restore_orientation_instantly() {\n                    warning = format!(\"警告: 向きの復元に失敗しました ({})\", e);\n                }\n            }\n\n            // パリティチェック（skip_parity_checkフラグで制御）\n            if !self.skip_parity_check {\n                if let Err(e) = new_cube.is_valid_state() {\n                    let parity_warning = format!(\"警告: 無効なキューブ状態です ({})\", e);\n                    warning = if warning.is_empty() {\n                        parity_warning\n                    } else {\n                        format!(\"{}\\n{}\", warning, parity_warning)\n                    };\n                }\n            }\n\n            self.cube = new_cube;\n            self.input_state = InputState::Normal;\n            self.input_buffer = [None; 54];\n        }\n\n        self.solution = None;\n        self.solution_text.clear();\n        self.animation = None;\n        self.move_queue.clear();\n        self.input_error_message.clear();\n\n        Ok(warning)\n    }\n\n    /// 保存ダイアログを表示して保存\n    #[cfg(not(target_arch = \"wasm32\"))]\n    pub fn save_with_dialog(\u0026mut self) {\n        let task = rfd::FileDialog::new()\n            .set_directory(\".\")\n            .add_filter(\"Text files\", \u0026[\"txt\"])\n            .set_file_name(\"cube_state.txt\")\n            .save_file();\n\n        if let Some(path) = task {\n            let path_str = path.to_string_lossy();\n            match self.save_to_file(\u0026path_str) {\n                Ok(_) =\u003e {\n                    self.input_error_message = format!(\n                        \"保存しました: {}\",\n                        path.file_name().unwrap_or_default().to_string_lossy()\n                    );\n                }\n                Err(e) =\u003e {\n                    self.input_error_message = format!(\"保存エラー: {}\", e);\n                }\n            }\n        }\n    }\n\n    /// Web版: ブラウザのダウンロード機能でファイルを保存\n    #[cfg(target_arch = \"wasm32\")]\n    pub fn save_with_dialog(\u0026mut self) {\n        use wasm_bindgen::JsCast;\n        use web_sys::{Blob, HtmlAnchorElement, Url};\n\n        let content = self.display_cube().to_file_format();\n        let array = js_sys::Uint8Array::from(content.as_bytes());\n        let blob_parts = js_sys::Array::new();\n        blob_parts.push(\u0026array);\n\n        let options = web_sys::BlobPropertyBag::new();\n        options.set_type(\"text/plain\");\n\n        match Blob::new_with_u8_array_sequence_and_options(\u0026blob_parts, \u0026options) {\n            Ok(blob) =\u003e match Url::create_object_url_with_blob(\u0026blob) {\n                Ok(url) =\u003e {\n                    let window = web_sys::window().expect(\"windowオブジェクト取得失敗\");\n                    let document = window.document().expect(\"documentオブジェクト取得失敗\");\n\n                    if let Ok(element) = document.create_element(\"a\") {\n                        let anchor: HtmlAnchorElement =\n                            element.dyn_into().expect(\"a要素へのキャスト失敗\");\n                        anchor.set_href(\u0026url);\n                        anchor.set_download(\"cube_state.txt\");\n                        anchor.click();\n\n                        let _ = Url::revoke_object_url(\u0026url);\n                        self.input_error_message =\n                            \"ダウンロードを開始しました: cube_state.txt\".to_string();\n                    } else {\n                        self.input_error_message = \"保存エラー: a要素の作成に失敗\".to_string();\n                    }\n                }\n                Err(_) =\u003e {\n                    self.input_error_message = \"保存エラー: URLの生成に失敗\".to_string();\n                }\n            },\n            Err(_) =\u003e {\n                self.input_error_message = \"保存エラー: Blobの作成に失敗\".to_string();\n            }\n        }\n    }\n\n    /// 読込ダイアログを表示して読み込み\n    #[cfg(not(target_arch = \"wasm32\"))]\n    pub fn load_with_dialog(\u0026mut self) {\n        let task = rfd::FileDialog::new()\n            .set_directory(\".\")\n            .add_filter(\"Text files\", \u0026[\"txt\"])\n            .pick_file();\n\n        if let Some(path) = task {\n            let path_str = path.to_string_lossy();\n            match self.load_from_file(\u0026path_str) {\n                Ok(warning) =\u003e {\n                    if warning.is_empty() {\n                        self.input_error_message = format!(\n                            \"読み込みました: {}\",\n                            path.file_name().unwrap_or_default().to_string_lossy()\n                        );\n                    } else {\n                        self.input_error_message = format!(\"読み込み完了: {}\", warning);\n                    }\n                }\n                Err(e) =\u003e {\n                    self.input_error_message = format!(\"読み込みエラー: {}\", e);\n                }\n            }\n        }\n    }\n\n    /// Web版: ブラウザのファイル選択機能でファイルを読み込み\n    #[cfg(target_arch = \"wasm32\")]\n    pub fn load_with_dialog(\u0026mut self) {\n        let (tx, rx) = std::sync::mpsc::channel();\n        self.file_receiver = Some(rx);\n\n        // WASM環境では、AsyncFileDialogを使用して非同期にファイルを選択\n        wasm_bindgen_futures::spawn_local(async move {\n            let task = rfd::AsyncFileDialog::new()\n                .add_filter(\"Text files\", \u0026[\"txt\"])\n                .pick_file();\n\n            if let Some(file_handle) = task.await {\n                let bytes = file_handle.read().await;\n                let content = String::from_utf8_lossy(\u0026bytes).to_string();\n                let _ = tx.send(Ok(content));\n            }\n        });\n    }\n\n    /// キーボード入力を処理\n    fn handle_input(\u0026mut self, ctx: \u0026egui::Context) {\n        // アニメーション中やソルブ中は入力を受け付けない（オプション）\n        // ここでは連打できるように許可するが、キューに追加される\n\n        // Shiftキーが押されているか確認\n        let shift = ctx.input(|i| i.modifiers.shift);\n\n        // 各キーの処理\n        let input = ctx.input(|i| {\n            let mut moves = Vec::new();\n\n            if i.key_pressed(egui::Key::R) {\n                moves.push(if shift { Move::Rp } else { Move::R });\n            }\n            if i.key_pressed(egui::Key::L) {\n                moves.push(if shift { Move::Lp } else { Move::L });\n            }\n            if i.key_pressed(egui::Key::U) {\n                moves.push(if shift { Move::Up } else { Move::U });\n            }\n            if i.key_pressed(egui::Key::D) {\n                moves.push(if shift { Move::Dp } else { Move::D });\n            }\n            if i.key_pressed(egui::Key::F) {\n                moves.push(if shift { Move::Fp } else { Move::F });\n            }\n            if i.key_pressed(egui::Key::B) {\n                moves.push(if shift { Move::Bp } else { Move::B });\n            }\n            moves\n        });\n\n        for mv in input {\n            self.queue_move(mv);\n        }\n\n        // 機能キー\n        if ctx.input(|i| i.key_pressed(egui::Key::S)) {\n            self.scramble();\n        }\n        if ctx.input(|i| i.key_pressed(egui::Key::Space)) \u0026\u0026 !self.solving {\n            self.solve();\n        }\n        if ctx.input(|i| i.key_pressed(egui::Key::Escape)) {\n            self.reset();\n        }\n    }\n\n    /// アプリケーションのコアロジックを更新します（UIレンダリング以外）\n    pub fn update_logic(\u0026mut self, ctx: \u0026egui::Context) {\n        // WASM環境: ペンディング状態のソルバーを起動\n        #[cfg(target_arch = \"wasm32\")]\n        if let Some((_task, ignore_orientation, mut frames_to_wait)) =\n            self.pending_solver_start.take()\n        {\n            if frames_to_wait \u003e 0 {\n                // まだ待機中：カウンターをデクリメントして再設定\n                frames_to_wait -= 1;\n                self.pending_solver_start = Some((_task, ignore_orientation, frames_to_wait));\n            } else {\n                // 待機完了：インクリメンタルソルバーを初期化\n                let max_depth = solver::DEFAULT_MAX_DEPTH;\n                self.solver_state = Some(solver::SolverState::new(\n                    \u0026self.cube,\n                    max_depth,\n                    ignore_orientation,\n                ));\n            }\n        }\n\n        // WASM環境: インクリメンタルソルバーのチャンク処理\n        #[cfg(target_arch = \"wasm32\")]\n        if let Some(state) = \u0026mut self.solver_state {\n            // 100ノード処理（約10-20ms）\n            let (_processed, is_complete) = state.process_chunk(100);\n\n            if is_complete {\n                // 完了: 結果を取得\n                if let Some(solution) = state.get_solution() {\n                    if solution.found {\n                        self.solution = Some(solution.moves.clone());\n                        let duration_text = if let Some(d) = self.last_solve_duration {\n                            format!(\" ({:.2}秒)\", d)\n                        } else if let Some(start_time) = self.solving_start_time {\n                            let duration = start_time.elapsed().as_secs_f32();\n                            self.last_solve_duration = Some(duration);\n                            format!(\" ({:.2}秒)\", duration)\n                        } else {\n                            String::new()\n                        };\n                        self.solution_text =\n                            format!(\"解法: {} 手{}\", solution.moves.len(), duration_text);\n                        self.solution_step = 0;\n                    } else {\n                        self.solution = None;\n                        self.solution_text = \"解が見つかりませんでした\".to_string();\n                    }\n                }\n\n                self.solving = false;\n                self.solver_state = None;\n            } else {\n                // 進捗更新\n                self.solver_progress = state.estimate_progress();\n            }\n        }\n\n        self.check_solver_result();\n        self.check_progress();\n        self.update_animation();\n        self.handle_input(ctx);\n\n        // ファイル読み込みの結果を確認\n        if let Some(rx) = \u0026self.file_receiver {\n            if let Ok(result) = rx.try_recv() {\n                self.file_receiver = None;\n                match result {\n                    Ok(content) =\u003e match self.load_from_content(\u0026content) {\n                        Ok(warning) =\u003e {\n                            if warning.is_empty() {\n                                self.input_error_message = \"ファイルを読み込みました\".to_string();\n                            } else {\n                                self.input_error_message = format!(\"読み込み完了: {}\", warning);\n                            }\n                        }\n                        Err(e) =\u003e {\n                            self.input_error_message = format!(\"読み込みエラー: {}\", e);\n                        }\n                    },\n                    Err(e) =\u003e {\n                        self.input_error_message = format!(\"ファイル選択エラー: {}\", e);\n                    }\n                }\n            }\n        }\n\n        // 継続的な再描画をリクエスト\n        ctx.request_repaint();\n    }\n}\n\nimpl eframe::App for CubeApp {\n    fn update(\u0026mut self, ctx: \u0026egui::Context, _frame: \u0026mut eframe::Frame) {\n        self.update_logic(ctx);\n\n        // 右側のサイドパネル (コントロールパネル)\n        egui::SidePanel::right(\"control_panel\")\n            .min_width E: Color32 = Color32::from_rgb(0, 100, 255);\npub const COLOR_RED: Color32 = Color32::from_rgb(255, 50, 50);\npub const COLOR_ORANGE: Color32 = Color32::from_rgb(255, 165, 0);\npub const COLOR_GRAY: Color32 = Color32::from_rgb(180, 180, 180);\n\n/// 2D描画パラメータ\npub const STICKER_SIZE_RATIO: f32 = 0.95; // グリッドに対するステッカーの大きさ\npub const STICKER_ROUNDING: f32 = 3.0;\npub const STICKER_STROKE_WIDTH: f32 = 2.0;\n\npub const ARROW_LENGTH_RATIO: f32 = 0.3; // ステッカーサイズに対する矢印の長さ\npub const ARROW_WIDTH: f32 = 2.0;\npub const ARROW_ALPHA: u8 = 180;\npub const ARROW_WING_RATIO: f32 = 0.4;\npub const ARROW_WING_ANGLE_DEG: f32 = 30.0;\npub const ARROW_BASE_RATIO: f32 = 0.3;\n\n/// 2Dグリッド設定\npub const GRID_COLS: f32 = 12.0;\npub const GRID_ROWS: f32 = 9.0;\npub const GRID_PADDING_RATIO: f32 = 0.95;\npub const STICKER_SIZE_IN_GRID: f32 = 0.85;\n\n/// 3D描画パラメータ\npub const VIEW3D_DEFAULT_YAW: f32 = PI / 4.0;\npub const VIEW3D_DEFAULT_PITCH: f32 = PI / 6.0;\npub const VIEW3D_DEFAULT_SCALE: f32 = 1.0;\n\npub const VIEW3D_CAMERA_DISTANCE: f32 = 20.0;\npub const VIEW3D_PROJECTION_SCALE: f32 = 0.25;\n// 3x3キューブでは中心間隔が1.0なので、ステッカーの半径は0.5が適切\n// これにより隣接面のステッカーがぴったり繋がる\npub const VIEW3D_STICKER_SIZE: f32 = 0.5;\npub const VIEW3D_BACKFACE_CULLING_THRESHOLD: f32 = 0.01;\npub const VIEW3D_ARROW_VEC_SCALE: f32 = 0.6;\npub const VIEW3D_ARROW_WIDTH: f32 = 6.0;\npub const VIEW3D_ARROW_HEAD_RATIO: f32 = 0.6;\npub const VIEW3D_PITCH_LIMIT_MARGIN: f32 = 0.1;\n\npub const MOUSE_SENSITIVITY: f32 = 0.01;\npub const ZOOM_FACTOR: f32 = 1.1;\n\n/// UIレイアウト定数\npub const UI_SPACING_LARGE: f32 = 10.0;\npub const UI_SPACING_SMALL: f32 = 5.0;\npub const UI_HEADING_FONT_SIZE: f32 = 18.0;\npub const UI_BODY_FONT_SIZE: f32 = 14.0;\npub const UI_HELP_TEXT_SIZE: f32 = 12.0;\npub const UI_SOLVE_STEP_FONT_SIZE: f32 = 16.0;\npub const UI_SIDE_PANEL_WIDTH: f32 = 250.0;\n\npub const INPUT_PALETTE_BUTTON_SIZE: [f32; 2] = [35.0, 30.0];\npub const INPUT_STICKER_BUTTON_SIZE: [f32; 2] = [50.0, 50.0];\npub const INPUT_SELECTED_STROKE_WIDTH: f32 = 3.0;\npub const INPUT_UNSELECTED_STROKE_WIDTH: f32 = 1.0;\n\n/// アニメーション定数\npub const ANIMATION_FACE_HIGHLIGHT_ALPHA: u8 = 30;\npub const ANIMATION_BULGE_RATIO: f32 = 0.2; // 近接面移動時の膨らみ\npub const ANIMATION_JUMP_BULGE_RATIO: f32 = 1.5; // ジャンプ時の膨らみ\npub const ANIMATION_SHADOW_OFFSET: f32 = 5.0;\npub const ANIMATION_JUMP_SHADOW_OFFSET: f32 = 10.0;\npub const ANIMATION_TRAIL_ALPHA_FACTOR: f32 = 0.3;\npub const ANIMATION_BULGE_MID_FACTOR: f32 = 0.1; // 1.0 + 0.1 * mid_p\npub const ANIMATION_JUMP_SIZE_FACTOR: f32 = 0.3; // 1.0 - 0.3 * mid_p\npub const ANIMATION_JUMP_ALPHA_FACTOR: f32 = 0.5; // 1.0 - 0.5 * mid_p\npub const ANIMATION_SPLIT_DURATION_FACTOR: f32 = 0.5;\n\n/// ハイライト設定\npub const HIGHLIGHT_STROKE_WIDTH: f32 = 4.0;\npub const HIGHLIGHT_COLOR: Color32 = Color32::from_rgb(255, 140, 0);\npub const HIGHLIGHT_PADDING_RATIO: f32 = 0.05;\npub const HIGHLIGHT_EXPAND: f32 = 2.0; // highlight_rect.expand(2.0)\npub const HIGHLIGHT_ROUNDING: f32 = 5.0;\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","gui","controls.rs"],"content":"use crate::cube::{Color, Move};\nuse crate::gui::app::{CubeApp, InputState};\nuse crate::gui::constants::*;\n\n/// コントロールパネルを描画\npub fn draw_controls(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui) {\n    ui.heading(\"操作\");\n    ui.add_space(UI_SPACING_LARGE);\n\n    // 6面スキャン入力モード\n    ui.add_enabled_ui(!app.solving, |ui| {\n        if let InputState::Scanning { face_index } = app.input_state {\n            draw_scanning_ui(app, ui, face_index);\n        } else {\n            // 通常モード: 6面スキャンボタンを表示\n            if ui.button(\"📸 6面スキャン入力\").clicked() {\n                app.start_scanning_mode();\n            }\n            ui.add_space(UI_SPACING_LARGE);\n        }\n    });\n\n    // 基本操作、回転ボタン、ソルバー（探索中は制限）\n    ui.add_enabled_ui(!app.solving, |ui| {\n        draw_base_operations(app, ui);\n        ui.add_space(UI_SPACING_LARGE);\n        draw_rotation_buttons(app, ui);\n        ui.add_space(UI_SPACING_LARGE);\n    });\n\n    draw_solver_ui(app, ui);\n\n    ui.add_space(UI_SPACING_LARGE);\n\n    // 状態表示\n    let is_solved = if app.ignore_orientation {\n        app.cube().is_solved()\n    } else {\n        crate::solver::is_fully_solved(app.cube())\n    };\n\n    if is_solved {\n        ui.colored_label(egui::Color32::GREEN, \"✓ 完成!\");\n    } else {\n        ui.label(\"未完成\");\n    }\n}\n\n/// 6面スキャン入力モードのUIを描画\nfn draw_scanning_ui(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui, face_index: usize) {\n    ui.separator();\n    ui.heading(\"🎯 実物のキューブを入力中\");\n    ui.add_space(UI_SPACING_LARGE);\n\n    // 進捗表示\n    let progress = (face_index as f32 + 1.0) / 6.0;\n    ui.add(egui::ProgressBar::new(progress).text(format!(\"{}/6 面\", face_index + 1)));\n    ui.add_space(UI_SPACING_SMALL);\n\n    // 現在の面\n    ui.label(format!(\"現在の面: {}\", app.get_current_face_name()));\n    ui.add_space(UI_SPACING_LARGE);\n\n    // 色選択パレット\n    ui.label(\"色を選択:\");\n    ui.horizontal(|ui| {\n        let colors = [\n            Color::White,\n            Color::Yellow,\n            Color::Green,\n            Color::Blue,\n            Color::Red,\n            Color::Orange,\n        ];\n\n        for color in colors {\n            let is_selected = app.selected_input_color == color;\n            let rgb = crate::gui::renderer::color_to_color32(color);\n            let label = match color {\n                Color::White =\u003e \"白\",\n                Color::Yellow =\u003e \"黄\",\n                Color::Green =\u003e \"緑\",\n                Color::Blue =\u003e \"青\",\n                Color::Red =\u003e \"赤\",\n                Color::Orange =\u003e \"橙\",\n                _ =\u003e \"?\",\n            };\n\n            let button = egui::Button::new(label)\n                .fill(rgb)\n                .stroke(if is_selected {\n                    egui::Stroke::new(INPUT_SELECTED_STROKE_WIDTH, egui::Color32::BLACK)\n                } else {\n                    egui::Stroke::new(INPUT_UNSELECTED_STROKE_WIDTH, egui::Color32::GRAY)\n                })\n                .min_size(egui::Vec2::from(INPUT_PALETTE_BUTTON_SIZE));\n\n            if ui.add(button).clicked() {\n                app.selected_input_color = color;\n            }\n        }\n    });\n    ui.add_space(UI_SPACING_LARGE);\n\n    // ステッカーグリッド (3x3)\n    ui.label(\"この面のステッカー:\");\n    ui.label(\"(クリックして選択した色を設定)\");\n    ui.add_space(UI_SPACING_SMALL);\n\n    egui::Grid::new(\"sticker_grid\")\n        .spacing([UI_SPACING_SMALL, UI_SPACING_SMALL])\n        .show(ui, |ui| {\n            for row in 0..3 {\n                for col in 0..3 {\n                    let position = row * 3 + col;\n                    let current_color = app.get_current_face_sticker(position);\n\n                    let button_color = if let Some(color) = current_color {\n                        crate::gui::renderer::color_to_color32(color)\n                    } else {\n                        egui::Color32::from_rgb(200, 200, 200) // 未設定\n                    };\n\n                    let button = egui::Button::new(\"\")\n                        .fill(button_color)\n                        .stroke(egui::Stroke::new(\n                            STICKER_STROKE_WIDTH,\n                            egui::Color32::BLACK,\n                        ))\n                        .min_size(egui::Vec2::from(INPUT_STICKER_BUTTON_SIZE));\n\n                    if ui.add(button).clicked() {\n                        app.set_current_face_sticker(position, app.selected_input_color);\n                    }\n                }\n                ui.end_row();\n            }\n        });\n\n    ui.add_space(UI_SPACING_LARGE);\n\n    // エラーメッセージ表示\n    if !app.input_error_message.is_empty() {\n        ui.colored_label(egui::Color32::RED, \u0026app.input_error_message);\n        ui.add_space(UI_SPACING_SMALL);\n    }\n\n    // ナビゲーションボタン\n    ui.horizontal(|ui| {\n        // 前の面へ\n        ui.add_enabled_ui(face_index \u003e 0, |ui| {\n            if ui.button(\"◀ 前の面\").clicked() {\n                app.prev_face();\n            }\n        });\n\n        // キャンセル\n        if ui.button(\"❌ キャンセル\").clicked() {\n            app.cancel_scanning_mode();\n        }\n\n        // 次の面へ / 完了\n        if face_index \u003c 5 {\n            let can_proceed = app.is_current_face_complete();\n            ui.add_enabled_ui(can_proceed, |ui| {\n                if ui.button(\"次の面 ▶\").clicked() {\n                    app.next_face();\n                }\n            });\n        } else {\n            // 最後の面\n            let can_finish = app.is_current_face_complete();\n            ui.add_enabled_ui(can_finish, |ui| {\n                if ui.button(\"✅ 完了\").clicked() {\n                    app.finish_scanning();\n                }\n            });\n        }\n    });\n\n    ui.separator();\n    ui.add_space(UI_SPACING_LARGE);\n}\n\n/// 基本操作（スクランブル、リセット、ファイル）のUIを描画\nfn draw_base_operations(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui) {\n    ui.label(\"基本操作:\");\n    ui.horizontal(|ui| {\n        if ui.button(\"スクランブル\").clicked() {\n            app.scramble();\n        }\n        if ui.button(\"リセット\").clicked() {\n            app.reset();\n        }\n    });\n\n    ui.add_space(UI_SPACING_LARGE);\n\n    // ファイル保存・読み込み\n    ui.label(\"ファイル:\");\n    ui.horizontal(|ui| {\n        if ui.button(\"💾 保存\").clicked() {\n            app.save_with_dialog();\n        }\n        if ui.button(\"📂 読み込み\").clicked() {\n            app.load_with_dialog();\n        }\n    });\n\n    ui.add_space(UI_SPACING_LARGE);\n\n    // Undo/Redo\n    ui.horizontal(|ui| {\n        if ui\n            .add_enabled(app.history.can_undo(), egui::Button::new(\"↶ Undo\"))\n            .clicked()\n        {\n            app.undo();\n        }\n        if ui\n            .add_enabled(app.history.can_redo(), egui::Button::new(\"↷ Redo\"))\n            .clicked()\n        {\n            app.redo();\n        }\n    });\n\n    ui.add_space(UI_SPACING_LARGE);\n\n    // アニメーション制御\n    ui.label(\"アニメーション:\");\n    ui.horizontal(|ui| {\n        ui.label(\"速度:\");\n        ui.add(egui::Slider::new(\u0026mut app.animation_speed, 0.0..=5.0).text(\"秒\"));\n    });\n}\n\n/// 回転操作ボタンの描画\nfn draw_rotation_buttons(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui) {\n    ui.label(\"回転操作:\");\n\n    let move_groups = [\n        (\n            vec![Move::R, Move::Rp, Move::R2],\n            vec![Move::L, Move::Lp, Move::L2],\n        ),\n        (\n            vec![Move::U, Move::Up, Move::U2],\n            vec![Move::D, Move::Dp, Move::D2],\n        ),\n        (\n            vec![Move::F, Move::Fp, Move::F2],\n            vec![Move::B, Move::Bp, Move::B2],\n        ),\n        (\n            vec![Move::M, Move::Mp, Move::M2],\n            vec![Move::E, Move::Ep, Move::E2],\n        ),\n        (\n            vec![Move::S, Move::Sp, Move::S2],\n            vec![Move::X, Move::Xp, Move::X2],\n        ),\n        (\n            vec![Move::Y, Move::Yp, Move::Y2],\n            vec![Move::Z, Move::Zp, Move::Z2],\n        ),\n    ];\n\n    for (group1, group2) in move_groups {\n        ui.horizontal(|ui| {\n            for mv in group1 {\n                if ui.button(format!(\"{}\", mv)).clicked() {\n                    app.queue_move(mv);\n                }\n            }\n            ui.add_space(UI_SPACING_LARGE);\n            for mv in group2 {\n                if ui.button(format!(\"{}\", mv)).clicked() {\n                    app.queue_move(mv);\n                }\n            }\n        });\n    }\n}\n\n/// ソルバー関連のUIを描画\nfn draw_solver_ui(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui) {\n    ui.label(\"ソルバー:\");\n    ui.horizontal(|ui| {\n        ui.add_enabled_ui(!app.solving, |ui| {\n            ui.radio_value(\u0026mut app.ignore_orientation, true, \"向き無視\");\n            ui.radio_value(\u0026mut app.ignore_orientation, false, \"向きも揃える\");\n        });\n    });\n\n    // 「解法を探す」ボタン（探索中は無効化）\n    ui.horizontal(|ui| {\n        ui.add_enabled_ui(!app.solving, |ui| {\n            if ui.button(\"解法を探す\").clicked() {\n                app.solve();\n            }\n        });\n\n        // 探索中のみ「中止」ボタンを表示\n        if app.solving \u0026\u0026 ui.button(\"中止\").clicked() {\n            app.cancel_solve();\n        }\n    });\n\n    // 探索中の進捗表示\n    if app.solving {\n        ui.label(\"探索中...\");\n        ui.add(egui::ProgressBar::new(app.solver_progress));\n\n        if let Some(start_time) = app.solving_start_time {\n            let elapsed = start_time.elapsed().as_secs_f32();\n            let elapsed_display = (elapsed / 0.2).floor() * 0.2;\n            ui.label(format!(\"経過: {:.1}秒\", elapsed_display));\n        }\n    } else {\n        // 探索終了後の結果表示\n        if !app.solution_text.is_empty() {\n            ui.add_space(UI_SPACING_SMALL);\n            ui.label(\u0026app.solution_text);\n        }\n\n        if let Some(solution) = app.solution.clone() {\n            draw_solution_steps(app, ui, \u0026solution);\n        }\n    }\n}\n\n/// 解法ステップ操作の描画\nfn draw_solution_steps(app: \u0026mut CubeApp, ui: \u0026mut egui::Ui, solution: \u0026[Move]) {\n    let solution_len = solution.len();\n    ui.add_space(UI_SPACING_LARGE);\n    ui.label(\"解法ステップ操作:\");\n\n    ui.label(format!(\"ステップ: {}/{}\", app.solution_step, solution_len));\n\n    if !solution.is_empty() {\n        ui.add_space(UI_SPACING_SMALL);\n        ui.label(\"操作内容:\");\n\n        let moves_per_line = 10;\n        for (i, chunk) in solution.chunks(moves_per_line).enumerate() {\n            ui.horizontal(|ui| {\n                for (j, \u0026mv) in chunk.iter().enumerate() {\n                    let global_idx = i * moves_per_line + j;\n                    let move_text = format!(\"{}\", mv);\n\n                    if global_idx == app.solution_step \u0026\u0026 app.solution_step \u003c solution_len {\n                        ui.colored_label(\n                            egui::Color32::from_rgb(255, 200, 0),\n                            format!(\"[{}]\", move_text),\n                        );\n                    } else if global_idx \u003c app.solution_step {\n                        ui.colored_label(egui::Color32::GRAY, move_text);\n                    } else {\n                        ui.label(move_text);\n                    }\n                }\n            });\n        }\n    }\n\n    ui.add_space(UI_SPACING_SMALL);\n    if app.solution_step \u003c solution_len {\n        let next_move = solution[app.solution_step];\n        ui.label(format!(\"次の動き: {}\", next_move));\n    } else {\n        ui.colored_label(egui::Color32::GREEN, \"完了!\");\n    }\n\n    ui.add_space(UI_SPACING_SMALL);\n    ui.horizontal(|ui| {\n        if ui.button(\"⏮ 最初へ\").clicked() {\n            app.solution_step_reset();\n        }\n        ui.add_enabled_ui(app.solution_step \u003e 0, |ui| {\n            if ui.button(\"◀ 前へ\").clicked() {\n                app.solution_step_backward();\n            }\n        });\n        ui.add_enabled_ui(app.solution_step \u003c solution_len, |ui| {\n            if ui.button(\"次へ ▶\").clicked() {\n                app.solution_step_forward();\n            }\n        });\n        if ui.button(\"最後へ ⏭\").clicked() {\n            app.solution_step_to_end();\n        }\n    });\n\n    ui.add_space(5.0);\n    let progress = app.solution_step as f32 / solution_len as f32;\n    ui.add(\n        egui::ProgressBar::new(progress).text(format!(\"{}/{}\", app.solution_step, solution_len)),\n    );\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":0}},{"line":7,"address":[],"length":0,"stats":{"Line":0}},{"line":8,"address":[],"length":0,"stats":{"Line":0}},{"line":11,"address":[],"length":0,"stats":{"Line":0}},{"line":12,"address":[],"length":0,"stats":{"Line":0}},{"line":13,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":19 , 90.0),\n    (usize::MAX, -90.0),\n    (usize::MAX, 180.0), // S, Sp, S2\n    (usize::MAX, 90.0),\n    (usize::MAX, -90.0),\n    (usize::MAX, 180.0), // X, Xp, X2\n    (usize::MAX, 90.0),\n    (usize::MAX, -90.0),\n    (usize::MAX, 180.0), // Y, Yp, Y2\n    (usize::MAX, 90.0),\n    (usize::MAX, -90.0),\n    (usize::MAX, 180.0), // Z, Zp, Z2\n];\n\n/// 指定されたMoveに対する逆引きマッピング (destination_index -\u003e source_index)\npub fn get_source_index(mv: Move, dst_idx: usize) -\u003e usize {\n    let all_moves = Move::all_moves();\n    let move_idx = all_moves.iter().position(|\u0026m| m == mv).unwrap_or(0);\n\n    for \u0026(src, dst) in \u0026MOVE_MAPPING_TABLE[move_idx] {\n        if dst == dst_idx \u0026\u0026 src != 99 {\n            return src;\n        }\n    }\n    dst_idx\n}\n\n/// 指定されたMoveに対する順引きマッピング (source_index -\u003e destination_index)\npub fn get_destination_index(mv: Move, src_idx: usize) -\u003e usize {\n    let all_moves = Move::all_moves();\n    let move_idx = all_moves.iter().position(|\u0026m| m == mv).unwrap_or(0);\n\n    for \u0026(src, dst) in \u0026MOVE_MAPPING_TABLE[move_idx] {\n        if src == src_idx {\n            return dst;\n        }\n    }\n    src_idx\n}\n\n/// 指定されたMoveとインデックスに対する論理的な向きの展開図上での変更量 (0-3)\npub fn get_oris_delta(mv: Move, src_idx: usize) -\u003e u8 {\n    use glam::Mat4;\n    let (axis, angle) = mv.geometric_params();\n    let rot = Mat4::from_axis_angle(axis, angle);\n\n    let src_face_idx = src_idx / 9;\n    let initial_normal = match src_face_idx {\n        0 =\u003e glam::Vec3::Y,\n        1 =\u003e -glam::Vec3::Y,\n        2 =\u003e -glam::Vec3::X,\n        3 =\u003e glam::Vec3::X,\n        4 =\u003e glam::Vec3::Z,\n        5 =\u003e -glam::Vec3::Z,\n        _ =\u003e glam::Vec3::Y,\n    };\n\n    let current_normal = rot.transform_vector3(initial_normal);\n    crate::cube::piece::calculate_orientation_with_rot(initial_normal, current_normal, rot)\n}\n","traces":[{"line":2098,"address":[],"length":0,"stats":{"Line":4}},{"line":2099,"address":[],"length":0,"stats":{"Line":8}},{"line":2100,"address":[],"length":0,"stats":{"Line":120}},{"line":2102,"address":[],"length":0,"stats":{"Line":236}},{"line":2103,"address":[],"length":0,"stats":{"Line":120}},{"line":2104,"address":[],"length":0,"stats":{"Line":4}},{"line":2107,"address":[],"length":0,"stats":{"Line":0}},{"line":2111,"address":[],"length":0,"stats":{"Line":0}},{"line":2112,"address":[],"length":0,"stats":{"Line":0}},{"line":2113,"address":[],"length":0,"stats":{"Line":0}},{"line":2115,"address":[],"length":0,"stats":{"Line":0}},{"line":2116,"address":[],"length":0,"stats":{"Line":0}},{"line":2117,"address":[],"length":0,"stats":{"Line":0}},{"line":2120,"address":[],"length":0,"stats":{"Line":0}},{"line":2124,"address":[],"length":0,"stats":{"Line":24}},{"line":2126,"address":[],"length":0,"stats":{"Line":72}},{"line":2127,"address":[],"length":0,"stats":{"Line":96}},{"line":2129,"address":[],"length":0,"stats":{"Line":48}},{"line":2130,"address":[],"length":0,"stats":{"Line":48}},{"line":2131,"address":[],"length":0,"stats":{"Line":8}},{"line":2132,"address":[],"length":0,"stats":{"Line":4}},{"line":2133,"address":[],"length":0,"stats":{"Line":0}},{"line":2134,"address":[],"length":0,"stats":{"Line":0}},{"line":2135,"address":[],"length":0,"stats":{"Line":4}},{"line":2136,"address":[],"length":0,"stats":{"Line":8}},{"line":2137,"address":[],"length":0,"stats":{"Line":0}},{"line":2140,"address":[],"length":0,"stats":{"Line":96}},{"line":2141,"address":[],"length":0,"stats":{"Line":96}}],"covered":17,"coverable":28},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","gui","mod.rs"],"content":"pub mod app;\npub mod constants;\npub mod controls;\npub mod mapping;\npub mod renderer;\npub mod renderer_3d;\npub mod state;\npub mod statistics_panel;\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","gui","renderer.rs"],"content":"use crate::cube::{Color, Cube, Face, Move, Sticker, STICKERS_PER_FACE};\nuse crate::gui::app::AnimationState;\nuse crate::gui::constants::*;\nuse egui::{Color32, Painter, Pos2, Rect, Stroke, Vec2};\n\n/// キューブのステッカー色（[`Color`]）を egui の [`Color32`] に変換します。\n///\n/// # 引数\n///\n/// - `color` - 変換元のステッカー色\n///\n/// # 戻り値\n///\n/// egui で描画可能な Color32 値\n#[must_use]\npub fn color_to_color32(color: Color) -\u003e Color32 {\n    match color {\n        Color::White =\u003e COLOR_WHITE,\n        Color::Yellow =\u003e COLOR_YELLOW,\n        Color::Green =\u003e COLOR_GREEN,\n        Color::Blue =\u003e COLOR_BLUE,\n        Color::Red =\u003e COLOR_RED,\n        Color::Orange =\u003e COLOR_ORANGE,\n        Color::Gray =\u003e COLOR_GRAY,\n    }\n}\n\n/// 単一のステッカーを描画します。\n///\n/// 指定された回転角度や透明度を適用して、正方形のステッカーとその上の向きを示す矢印を描画します。\nfn draw_sticker(\n    painter: \u0026Painter,\n    center: Pos2,\n    size: f32,\n    sticker: Sticker,\n    rotation_offset_deg: f32,\n    alpha: f32,\n    shadow_offset: Vec2,\n) {\n    let color = color_to_color32(sticker.color).linear_multiply(alpha);\n    let stroke_color = Color32::BLACK.linear_multiply(alpha);\n\n    // 影の描画 (もしあれば)\n    if shadow_offset.length() \u003e 0.1 {\n        let shadow_color = Color32::from_black_alpha((100.0 * alpha) as u8);\n        let shadow_rect = Rect::from_center_size(\n            center + shadow_offset,\n            Vec2::splat(size * STICKER_SIZE_RATIO),\n        );\n        painter.rect_filled(shadow_rect, STICKER_ROUNDING, shadow_color);\n    }\n\n    // ステッカーの背景を描画\n    let rect = Rect::from_center_size(center, Vec2::splat(size * STICKER_SIZE_RATIO));\n\n    // 回転を適用した矩形を描画するために、頂点を計算して回転させる\n    if rotation_offset_deg.abs() \u003e 0.1 {\n        let angle = rotation_offset_deg.to_radians();\n        let cos = angle.cos();\n        let sin = angle.sin();\n\n        let half = size * STICKER_SIZE_RATIO / 2.0;\n        let corners = [\n            Pos2::new(-half, -half),\n            Pos2::new(half, -half),\n            Pos2::new(half, half),\n            Pos2::new(-half, half),\n        ];\n\n        let rotated_corners: Vec\u003cPos2\u003e = corners\n            .iter()\n            .map(|p| {\n                Pos2::new(\n                    center.x + p.x * cos - p.y * sin,\n                    center.y + p.x * sin + p.y * cos,\n                )\n            })\n            .collect();\n\n        painter.add(egui::Shape::convex_polygon(\n            rotated_corners.clone(),\n            color,\n            Stroke::new(STICKER_STROKE_WIDTH, stroke_color),\n        ));\n    } else {\n        painter.rect_filled(rect, STICKER_ROUNDING, color);\n        painter.rect_stroke(\n            rect,\n            STICKER_ROUNDING,\n            Stroke::new(STICKER_STROKE_WIDTH, stroke_color),\n        );\n    }\n\n    // 矢印を描画（向きを示す）\n    let arrow_rotation = (sticker.orientation as f32 * 90.0 + rotation_offset_deg).to_radians();\n    draw_arrow(\n        painter,\n        center,\n        size * ARROW_LENGTH_RATIO,\n        arrow_rotation,\n        alpha,\n    );\n}\n\n/// ステッカーの向き（orientation）を示す矢印を描画します。\nfn draw_arrow(painter: \u0026Painter, center: Pos2, length: f32, rotation: f32, alpha: f32) {\n    let cos = rotation.cos();\n    let sin = rotation.sin();\n\n    // 矢印の先端\n    let tip = Pos2::new(center.x + length * sin, center.y - length * cos);\n\n    // 矢印の根元\n    let base = Pos2::new(\n        center.x - length * ARROW_BASE_RATIO * sin,\n        center.y + length * ARROW_BASE_RATIO * cos,\n    );\n\n    // 矢印の羽\n    let wing_length = length * ARROW_WING_RATIO;\n    let wing_angle = ARROW_WING_ANGLE_DEG.to_radians();\n\n    let left_wing = Pos2::new(\n        tip.x - wing_length * (rotation + wing_angle).sin(),\n        tip.y + wing_length * (rotation + wing_angle).cos(),\n    );\n\n    let right_wing = Pos2::new(\n        tip.x - wing_length * (rotation - wing_angle).sin(),\n        tip.y + wing_length * (rotation - wing_angle).cos(),\n    );\n\n    // 矢印を描画\n    // Color32::from_black_alpha(180) は alpha=180/255 相当。\n    // alpha引数を反映させるため、Color32::BLACK.linear_multiply(alpha)をベースに調整してもいいが、\n    // ここでは単純に linear_multiply を使う\n    let stroke = Stroke::new(\n        ARROW_WIDTH,\n        Color32::from_black_alpha(ARROW_ALPHA).linear_multiply(alpha),\n    );\n    painter.line_segment([base, tip], stroke);\n    painter.line_segment([tip, left_wing], stroke);\n    painter.line_segment([tip, right_wing], stroke);\n}\n\n/// インデックスに対応するグリッド座標 (col, row) を取得\nfn get_grid_coords(index: usize) -\u003e Pos2 {\n    let (col, row) = match index {\n        i if i \u003c 9 =\u003e (3.0 + (i % 3) as f32, 0.0 + (i / 3) as f32), // U\n        i if i \u003c 18 =\u003e (3.0 + ((i - 9) % 3) as f32, 6.0 + ((i - 9) / 3) as f32), // D\n        i if i \u003c 27 =\u003e (0.0 + ((i - 18) % 3) as f32, 3.0 + ((i - 18) / 3) as f32), // L\n        i if i \u003c 36 =\u003e (6.0 + ((i - 27) % 3) as f32, 3.0 + ((i - 27) / 3) as f32), // R\n        i if i \u003c 45 =\u003e (3.0 + ((i - 36) % 3) as f32, 3.0 + ((i - 36) / 3) as f32), // F\n        _ =\u003e (\n            9.0 + ((index - 45) % 3) as f32,\n            3.0 + ((index - 45) / 3) as f32,\n        ), // B\n    };\n    Pos2::new(col, row)\n}\n\n/// アニメーション情報の型エイリアス: (移動マッピング, 回転面情報)\ntype AnimationInfo = (Vec\u003c(usize, usize)\u003e, Option\u003c(usize, f32)\u003e);\n\n/// アニメーション情報：移動マッピングと回転面情報\nfn get_animation_info(mv: Move) -\u003e AnimationInfo {\n    let all_moves = Move::all_moves();\n    let move_idx = all_moves.iter().position(|\u0026m| m == mv).unwrap_or(0);\n\n    let mut mapping = Vec::new();\n    let (face_start, _) = crate::gui::mapping::FACE_ROTATION_TABLE[move_idx];\n\n    for \u0026(src, dst) in \u0026crate::gui::mapping::MOVE_MAPPING_TABLE[move_idx] {\n        if src == 99 {\n            continue;\n        }\n\n        // 移動があるステッカー、または回転面上のステッカーのみを対象にする\n        let is_on_face = if face_start != usize::MAX {\n            src \u003e= face_start \u0026\u0026 src \u003c face_start + STICKERS_PER_FACE\n        } else {\n            false\n        };\n\n        if src != dst || is_on_face {\n            mapping.push((src, dst));\n        }\n    }\n\n    (\n        mapping,\n        Some(crate::gui::mapping::FACE_ROTATION_TABLE[move_idx]),\n    )\n}\n\n/// キューブを展開図（2D）として指定された領域に描画します。\n///\n/// 現在のアニメーション状態（[`AnimationState`]）がある場合は、\n/// 回転や移動の演出を適用して描画します。\n///\n/// # 引数\n///\n/// - `ui` - egui の Ui コンテキスト\n/// - `rect` - 描画先の矩形領域\n/// - `cube` - 描画対象のキューブ\n/// - `animation` - 現在実行中のアニメーション状態（任意）\n/// - `highlight_face_index` - ハイライト表示する面のインデックス（任意、0-5）\npub fn draw_cube(\n    ui: \u0026mut egui::Ui,\n    mut rect: Rect,\n    cube: \u0026Cube,\n    animation: Option\u003c\u0026AnimationState\u003e,\n    highlight_face_index: Option\u003cusize\u003e,\n) {\n    if !rect.is_finite() {\n        rect = ui.available_rect_before_wrap();\n    }\n    let painter = ui.painter();\n\n    let grid_cols = GRID_COLS;\n    let grid_rows = GRID_ROWS;\n\n    // グリッドサイズ計算\n    let mut grid_size =\n        (rect.width() / grid_cols).min(rect.height() / grid_rows) * GRID_PADDING_RATIO;\n    if grid_size.is_nan() || grid_size \u003c 0.1 {\n        grid_size = 1.0;\n    }\n    let sticker_size = grid_size * STICKER_SIZE_IN_GRID;\n\n    let total_width = grid_size * grid_cols;\n    let total_height = grid_size * grid_rows;\n\n    let start_x = rect.left() + (rect.width() - total_width) / 2.0;\n    let start_y = rect.top() + (rect.height() - total_height) / 2.0;\n    let base_pos = Pos2::new(start_x + grid_size * 0.5, start_y + grid_size * 0.5);\n\n    let to_screen = |grid_p: Pos2| -\u003e Pos2 {\n        Pos2::new(\n            base_pos.x + grid_p.x * grid_size,\n            base_pos.y + grid_p.y * grid_size,\n        )\n    };\n\n    let (anim_mapping, anim_face_rot) = if let Some(anim) = animation {\n        get_animation_info(anim.current_move)\n    } else {\n        (vec![], None)\n    };\n\n    // 0. 回転面の強調表示 (Face Overlay)\n    if let Some((face_start, _angle)) = anim_face_rot {\n        if face_start != usize::MAX {\n            let face_grid_rect = get_face_grid_rect(face_start);\n            let top_left = to_screen(face_grid_rect.min) - Vec2::splat(grid_size * 0.5);\n            let bottom_right = to_screen(Pos2::new(\n                face_grid_rect.max.x - 1.0,\n                face_grid_rect.max.y - 1.0,\n            )) + Vec2::splat(grid_size * 0.5);\n            let highlight_rect = Rect::from_min_max(top_left, bottom_right);\n\n            painter.rect_filled(\n                highlight_rect.expand(2.0),\n                5.0,\n                Color32::from_rgba_premultiplied(128, 128, 128, ANIMATION_FACE_HIGHLIGHT_ALPHA),\n            );\n        }\n    }\n\n    // 全ステッカーを描画\n    for i in 0..crate::cube::NUM_STICKERS {\n        let grid_pos = get_grid_coords(i);\n        let screen_pos = to_screen(grid_pos);\n        let mut drawn = false;\n\n        let mut sticker = cube.get_sticker(i);\n\n        if let Some(anim) = animation {\n            let progress = anim.eased_progress();\n\n            // 描画対象を決定: 移動中のスロットであればソースからステッカーを取得\n            if let Some(\u0026(src, _)) = anim_mapping.iter().find(|(_, dst)| *dst == i) {\n                let moving_from_idx = src;\n                let oris_delta =\n                    crate::gui::mapping::get_oris_delta(anim.current_move, moving_from_idx);\n\n                // Piece ベースに移行したため、現在の位置 (i) にあるステッカーを取得します。\n                // アニメーションの開始時 (t=0) の向きを再現するため、oris_delta 分だけ戻した値を src_ori とします。\n                sticker = cube.get_sticker(i);\n                let src_ori = (sticker.orientation as i32 + 4 - (oris_delta % 4) as i32) as u8 % 4;\n\n                let target_grid_pos = grid_pos; //目的地\n                let start_grid_pos = get_grid_coords(src); //出発地\n                let dist = start_grid_pos.distance(target_grid_pos);\n\n                let start_screen = to_screen(start_grid_pos);\n                let end_screen = to_screen(target_grid_pos);\n\n                let (is_arc, rotation_face_start) = match anim.current_move {\n                    Move::U | Move::Up | Move::U2 =\u003e (matches!(i, 0..=8), 0),\n                    Move::D | Move::Dp | Move::D2 =\u003e (matches!(i, 9..=17), 9),\n                    Move::L | Move::Lp | Move::L2 =\u003e (matches!(i, 18..=26), 18),\n                    Move::R | Move::Rp | Move::R2 =\u003e (matches!(i, 27..=35), 27),\n                    Move::F | Move::Fp | Move::F2 =\u003e (\n                        matches!(i, 36..=44 | 6..=8 | 27 | 30 | 33 | 9..=11 | 20 | 23 | 26),\n                        36,\n                    ),\n                    Move::B | Move::Bp | Move::B2 =\u003e (matches!(i, 45..=53), 45),\n                    Move::S | Move::Sp | Move::S2 =\u003e (\n                        matches!(i, 3..=5 | 28 | 31 | 34 | 12..=14 | 19 | 22 | 25),\n                        36,\n                    ),\n                    _ =\u003e (false, 0),\n                };\n\n                // アニメーション中のステッカーの論理的向きは、開始時の状態に固定して描画する\n                // (実際の回転は sub_rot や p_rot で表現される)\n                sticker.orientation = src_ori;\n\n                let calc_state = |p: f32| {\n                    let mut pos = start_screen + (end_screen - start_screen) * p;\n                    let mut rot = 0.0;\n                    let mut alpha = 1.0;\n                    let mut size_scale = 1.0;\n                    let mut shadow = Vec2::ZERO;\n\n                    if is_arc {\n                        if let Some((_, angle)) = anim_face_rot {\n                            let center_grid_base = get_face_grid_rect(rotation_face_start).min;\n                            let center_grid =\n                                Pos2::new(center_grid_base.x + 1.0, center_grid_base.y + 1.0);\n                            let center_screen = to_screen(center_grid);\n\n                            let r = start_screen.distance(center_screen);\n                            let start_angle = (start_screen.y - center_screen
