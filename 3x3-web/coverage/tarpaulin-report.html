<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

tes...\\n\");\n\n    let solved_states = solver::get_solved_states();\n    println!(\"Total solved states: {}\\n\", solved_states.len());\n\n    let clockwise_pattern = [1, 2, 0, 3];\n\n    for (idx, cube) in solved_states.iter().enumerate() {\n        println!(\"Solved state #{}:\", idx);\n\n        // 各面のorientationパターンをチェック\n        let faces = [\n            (\"Up   \", 0..4),\n            (\"Down \", 4..8),\n            (\"Left \", 8..12),\n            (\"Right\", 12..16),\n            (\"Front\", 16..20),\n            (\"Back \", 20..24),\n        ];\n\n        let mut all_clockwise = true;\n\n        for (face_name, range) in \u0026faces {\n            let orientations: Vec\u003cu8\u003e = range\n                .clone()\n                .map(|i| cube.get_sticker(i).orientation)\n                .collect();\n\n            let is_clockwise = orientations == clockwise_pattern;\n\n            print!(\n                \"  {} [{}, {}, {}, {}]\",\n                face_name, orientations[0], orientations[1], orientations[2], orientations[3]\n            );\n\n            if !is_clockwise {\n                print!(\" ❌ NOT clockwise!\");\n                all_clockwise = false;\n            }\n            println!();\n        }\n\n        if all_clockwise {\n            println!(\"  ✅ All faces are clockwise\");\n        } else {\n            println!(\"  ❌ Some faces are NOT clockwise\");\n        }\n        println!();\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_standard_centers.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face};\n\nfn main() {\n    let cube = Cube::new();\n    println!(\"Standard Completed Cube Centers:\");\n    for face in Face::all() {\n        let center_idx = face.start_index() + 4;\n        let color = cube.get_sticker(center_idx).color;\n        println!(\"{:?}: {:?}\", face, color);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_superflip.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Checking if cube_god.txt is Superflip...\");\n\n    let centers = [\n        cube.get_sticker(Face::Up.start_index() + 4).color,\n        cube.get_sticker(Face::Down.start_index() + 4).color,\n        cube.get_sticker(Face::Left.start_index() + 4).color,\n        cube.get_sticker(Face::Right.start_index() + 4).color,\n        cube.get_sticker(Face::Front.start_index() + 4).color,\n        cube.get_sticker(Face::Back.start_index() + 4).color,\n    ];\n\n    println!(\"Centers (U,D,L,R,F,B): {:?}\", centers);\n\n    let mut corners_correct = true;\n    for face in Face::all() {\n        let center_color = cube.get_sticker(face.start_index() + 4).color;\n        for \u0026idx in \u0026[0, 2, 6, 8] {\n            let sticker_color = cube.get_sticker(face.start_index() + idx).color;\n            if sticker_color != center_color {\n                corners_correct = false;\n                println!(\n                    \"Corner mismatch at {:?} index {}: {:?}\",\n                    face, idx, sticker_color\n                );\n            }\n        }\n    }\n\n    println!(\n        \"All corners correct (color matches center): {}\",\n        corners_correct\n    );\n\n    let mut edges_flipped = true;\n    for face in Face::all() {\n        let center_color = cube.get_sticker(face.start_index() + 4).color;\n        for \u0026idx in \u0026[1, 3, 5, 7] {\n            let sticker_color = cube.get_sticker(face.start_index() + idx).color;\n            if sticker_color == center_color {\n                edges_flipped = false;\n                println!(\n                    \"Edge matches center at {:?} index {}: {:?}\",\n                    face, idx, center_color\n                );\n            }\n        }\n    }\n\n    println!(\n        \"All edge stickers MISMATCH their centers (flipped hint): {}\",\n        edges_flipped\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","debug_orientation.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse rubiks_cube_3x3::solver::{solve, DEFAULT_MAX_DEPTH};\nuse std::fs;\n\nfn main() {\n    println!(\"=== cube_ex001.txt の向き復元テスト（修正後）===\\n\");\n\n    // ファイルから読み込み\n    let cube_text =\n        fs::read_to_string(\"cubes/cube_ex001.txt\").expect(\"cube_ex001.txt を読み込めませんでした\");\n\n    println!(\"ファイル内容:\\n{}\\n\", cube_text);\n\n    // キューブを作成\n    let mut cube = Cube::from_file_format(\u0026cube_text).expect(\"キューブのパースに失敗しました\");\n\n    println!(\"パース後のキューブ状態:\\n{}\\n\", cube.to_file_format());\n\n    // 状態チェック\n    println!(\"--- 初期状態チェック ---\");\n    println!(\"is_solved(): {}\", cube.is_solved());\n    println!(\n        \"is_solved_with_orientation(): {}\",\n        cube.is_solved_with_orientation()\n    );\n\n    // 完成状態をスクランブル\n    println!(\"\\n--- スクランブル適用 ---\");\n    let scramble_moves = vec![Move::R, Move::U, Move::Rp, Move::Up, Move::F, Move::D];\n    println!(\"スクランブル: {:?}\", scramble_moves);\n\n    for mv in \u0026scramble_moves {\n        cube.apply_move(*mv);\n    }\n\n    println!(\n        \"\\nスクランブル後のキューブ状態:\\n{}\\n\",\n        cube.to_file_format()\n    );\n    println!(\"is_solved(): {}\", cube.is_solved());\n    println!(\n        \"is_solved_with_orientation(): {}\",\n        cube.is_solved_with_orientation()\n    );\n\n    // ファイルに保存\n    let scrambled_text = cube.to_file_format();\n    fs::write(\"cubes/cube_ex001_scrambled.txt\", \u0026scrambled_text)\n        .expect(\"スクランブル後の状態を保存できませんでした\");\n    println!(\"スクランブル後の状態を cubes/cube_ex001_scrambled.txt に保存しました\");\n\n    // 1. 向きを揃えない解（色のみ）\n    println!(\"\\n--- 1. 向きを揃えない解（色のみ）---\");\n    let solution_color_only = solve(\u0026cube, DEFAULT_MAX_DEPTH, true);\n\n    if solution_color_only.found {\n        println!(\"✓ 解が見つかりました！\");\n        println!(\"  手数: {}\", solution_color_only.moves.len());\n\n        // 検証\n        let mut test_cube = cube.clone();\n        for mv in \u0026solution_color_only.moves {\n            test_cube.apply_move(*mv);\n        }\n        if test_cube.is_solved() {\n            println!(\"  ✓ 検証成功: 色が揃っています\");\n        }\n        if test_cube.is_solved_with_orientation() {\n            println!(\"  ✓ 向きも揃っています\");\n        } else {\n            println!(\"  ℹ 色のみ揃っています（向きは揃っていません）\");\n        }\n    } else {\n        println!(\"✗ 解が見つかりませんでした\");\n        if !solution_color_only.message.is_empty() {\n            println!(\"  メッセージ: {}\", solution_color_only.message);\n        }\n    }\n\n    // 2. 向きを揃える解（supercube）\n    println!(\"\\n--- 2. 向きを揃える解（向きも含む）---\");\n    let solution_with_orientation = solve(\u0026cube, DEFAULT_MAX_DEPTH, false);\n\n    if solution_with_orientation.found {\n        println!(\"✓ 解が見つかりました！\");\n        println!(\"  手数: {}\", solution_with_orientation.moves.len());\n\n        // 検証\n        let mut test_cube = cube.clone();\n        for mv in \u0026solution_with_orientation.moves {\n            test_cube.apply_move(*mv);\n        }\n        if test_cube.is_solved() {\n            println!(\"  ✓ 検証成功: 色が揃っています\");\n        }\n        if test_cube.is_solved_with_orientation() {\n            println!(\"  ✓ 向きも揃っています\");\n        } else {\n            println!(\"  ⚠ 注意: 向きが揃っていません\");\n        }\n    } else {\n        println!(\"✗ 解が見つかりませんでした\");\n        if !solution_with_orientation.message.is_empty() {\n            println!(\"  メッセージ: {}\", solution_with_orientation.message);\n        }\n    }\n\n    println!(\"\\n=== テスト完了 ===\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","final_solve_god.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::kociemba::{RawCube, Search};\nuse std::fs;\nuse std::time::Instant;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n    let rc = RawCube::from_cube(\u0026cube).unwrap();\n\n    println!(\"=== Final Search for God Cube Solution ===\");\n    println!(\"Node Limit: 1,000,000,000 (1 Billion)\");\n\n    let mut search = Search::new();\n    search.max_nodes = 1_000_000_000;\n\n    let start = Instant::now();\n    let sol = search.solve(\u0026rc, 22);\n    let duration = start.elapsed();\n\n    println!(\"Time: {:?}\", duration);\n    if let Some(s) = sol {\n        println!(\"Solution found! Length: {}\", s.len());\n        println!(\"Moves: {:?}\", s);\n\n        // Apply moves to verify\n        let mut test_cube = cube.clone();\n        for \u0026m in \u0026s {\n            test_cube.apply_move(m);\n        }\n        println!(\"Colors solved? {}\", test_cube.is_solved());\n    } else {\n        println!(\"NOT FOUND within 1 Billion nodes.\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","find_superflip_gen.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face, Move};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let target_cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Testing (M' U')*3 variant for Superflip...\");\n\n    // Mp Up Mp Up Mp Up Mp Up flips 4 edges on the M ring and U/D layers?\n    // Let's use the sequence from a reliable source for Superflip:\n    // ((M' U) * 4  x y') * 3\n\n    let mut cube = Cube::new();\n\n n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","verify_superflip_solution.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let target_cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Verifying Superflip sequence...\");\n\n    // many sources say: (M' U')*4 + (rotate) + ... is superflip\n    // Standard 20-move superflip sequence (Singmaster's):\n    // U R2 F B R B2 R U2 L B2 R U' D' R2 F R' L B2 U2 F2\n    let moves = vec![\n        Move::U,\n        Move::R2,\n        Move::F,\n        Move::B,\n        Move::R,\n        Move::B2,\n        Move::R,\n        Move::U2,\n        Move::L,\n        Move::B2,\n        Move::R,\n        Move::Up,\n        Move::D,\n        Move::R2,\n        Move::F,\n        Move::Rp,\n        Move::L,\n        Move::B2,\n        Move::U2,\n        Move::F2,\n    ];\n\n    let mut cube = Cube::new();\n    // Superflip depends on having centers right. Cube::new() has standard centers.\n    for \u0026mv in \u0026moves {\n        cube.apply_move(mv);\n    }\n\n    println!(\"Applied Superflip sequence to solved cube.\");\n    println!(\"Is solved (colors)? {}\", cube.is_solved());\n\n    // Check if it matches target_cube\n    let mut matches = true;\n    for face in rubiks_cube_3x3::cube::Face::all() {\n        for idx in 0..9 {\n            if cube.get_sticker(face.start_index() + idx).color\n                != target_cube.get_sticker(face.start_index() + idx).color\n            {\n                matches = false;\n                // println!(\"Mismatch at {:?} index {}: Expected {:?}, Found {:?}\", face, idx, target_cube.get_sticker(face.start_index() + idx).color, cube.get_sticker(face.start_index() + idx).color);\n            }\n        }\n    }\n\n    println!(\"Does it match cube_god.txt exactly? {}\", matches);\n\n    if matches {\n        println!(\"SUCCESS! The sequence is a solution (in reverse).\");\n        let solution_moves: Vec\u003cMove\u003e = moves.iter().rev().map(|m| m.inverse()).collect();\n        println!(\"Solution moves: {:?}\", solution_moves);\n    } else {\n        println!(\"Trying another variant...\");\n        // try M' U M' U M' U M' U x y ...\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","scripts","gen_cycles.rs"],"content":"#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\nenum Face {\n    Up,\n    Down,\n    Left,\n    Right,\n    Front,\n    Back,\n}\n\nfn get_id(f: Face, row: i32, col: i32) -\u003e usize {\n    let base = match f {\n        Face::Up =\u003e 0,\n        Face::Down =\u003e 9,\n        Face::Left =\u003e 18,\n        Face::Right =\u003e 27,\n        Face::Front =\u003e 36,\n        Face::Back =\u003e 45,\n    };\n    base + (row * 3 + col) as usize\n}\n\nfn get_coords(f: Face, r: i32, c: i32) -\u003e (f32, f32, f32) {\n    let rs = (r as f32 - 1.0) * -1.0;\n    let cs = c as f32 - 1.0;\n    match f {\n        Face::Up =\u003e (cs, 1.5, -rs),\n        Face::Down =\u003e (cs, -1.5, rs),\n        Face::Left =\u003e (-1.5, rs, cs),\n        Face::Right =\u003e (1.5, rs, -cs),\n        Face::Front =\u003e (cs, rs, 1.5),\n        Face::Back =\u003e (-cs, rs, -1.5),\n    }\n}\n\nfn find_id(x: f32, y: f32, z: f32) -\u003e usize {\n    let faces = [\n        Face::Up,\n        Face::Down,\n        Face::Left,\n        Face::Right,\n        Face::Front,\n        Face::Back,\n    ];\n    for f in faces {\n        for r in 0..3 {\n            for c in 0..3 {\n                let (sx, sy, sz) = get_coords(f, r, c);\n                if (x - sx).abs() \u003c 0.1 \u0026\u0026 (y - sy).abs() \u003c 0.1 \u0026\u0026 (z - sz).abs() \u003c 0.1 {\n                    return get_id(f, r, c);\n                }\n            }\n        }\n    }\n    panic!(\"No sticker at ({}, {}, {})\", x, y, z);\n}\n\nfn main() {\n    let corner_coords = [\n        (\"UFR\", 1.0, 1.0, 1.0),\n        (\"UFL\", -1.0, 1.0, 1.0),\n        (\"ULB\", -1.0, 1.0, -1.0),\n        (\"UBR\", 1.0, 1.0, -1.0),\n        (\"DFR\", 1.0, -1.0, 1.0),\n        (\"DLF\", -1.0, -1.0, 1.0),\n        (\"DBL\", -1.0, -1.0, -1.0),\n        (\"DRB\", 1.0, -1.0, -1.0),\n    ];\n\n    for (name, cx, cy, cz) in corner_coords {\n        let mut ids = Vec::new();\n        // Each corner has 3 stickers. They are at distances 1.5 from center.\n        // For UFR (1,1,1), the stickers are at (1,1,1.5) on Front, (1.5,1,1) on Right, (1,1.5,1) on Up.\n        ids.push(find_id(cx, 1.5, cz)); // Up/Down sticker\n\n        // Next two depend on the corner.\n        // For UFR, it's Front and Right.\n        // Let's just find all 3 stickers near this corner.\n        let mut stickers = Vec::new();\n        for f in [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ] {\n            for r in 0..3 {\n                for c in 0..3 {\n                    let (sx, sy, sz) = get_coords(f, r, c);\n                    if (cx - sx).abs() \u003c 0.6 \u0026\u0026 (cy - sy).abs() \u003c 0.6 \u0026\u0026 (cz - sz).abs() \u003c 0.6 {\n                        stickers.push(get_id(f, r, c));\n                    }\n                }\n            }\n        }\n        println!(\"{}: {:?}\", name, stickers);\n    }\n\n    println!(\"\\nEdges:\");\n    let edge_coords = [\n        (\"UR\", 1.0, 1.0, 0.0),\n        (\"UF\", 0.0, 1.0, 1.0),\n        (\"UL\", -1.0, 1.0, 0.0),\n        (\"UB\", 0.0, 1.0, -1.0),\n        (\"DR\", 1.0, -1.0, 0.0),\n        (\"DF\", 0.0, -1.0, 1.0),\n        (\"DL\", -1.0, -1.0, 0.0),\n        (\"DB\", 0.0, -1.0, -1.0),\n        (\"FR\", 1.0, 0.0, 1.0),\n        (\"FL\", -1.0, 0.0, 1.0),\n        (\"BL\", -1.0, 0.0, -1.0),\n        (\"BR\", 1.0, 0.0, -1.0),\n    ];\n    for (name, cx, cy, cz) in edge_coords {\n        let mut stickers = Vec::new();\n        for f in [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ] {\n            for r in 0..3 {\n                for c in 0..3 {\n                    let (sx, sy, sz) = get_coords(f, r, c);\n                    if (cx - sx).abs() \u003c 0.6 \u0026\u0026 (cy - sy).abs() \u003c 0.6 \u0026\u0026 (cz - sz).abs() \u003c 0.6 {\n                        stickers.push(get_id(f, r, c));\n                    }\n                }\n            }\n        }\n        println!(\"{}: {:?}\", name, stickers);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","scripts","gen_move_cubes.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse rubiks_cube_3x3::kociemba::RawCube;\n\nfn main() {\n    let moves = [Move::U, Move::R, Move::F, Move::D, Move::L, Move::B];\n\n    println!(\"pub static MOVE_CUBES: [RawCube; 6] = [\");\n    for mv in moves {\n        let mut cube = Cube::new();\n        cube.apply_move(mv);\n        let rc = RawCube::from_cube(\u0026cube).expect(\"from_cube failed for move\");\n\n        println!(\"    RawCube {{\");\n        print!(\"        cp: [\");\n        for (i, cp) in rc.cp.iter().enumerate() {\n            print!(\"{}\", cp);\n            if i \u003c 7 {\n                print!(\", \");\n            }\n        }\n        println!(\"],\");\n\n        print!(\"        co: [\");\n        for (i, co) in rc.co.iter().enumerate() {\n            print!(\"{}\", co);\n            if i \u003c 7 {\n                print!(\", \");\n            }\n        }\n        println!(\"],\");\n\n        print!(\"        ep: [\");\n        for (i, ep) in rc.ep.iter().enumerate() {\n            print!(\"{}\", ep);\n            if i \u003c 11 c","cube","enums.rs"],"content":"use glam::Vec3;\n\n/// 2x2ルービックキューブの6つの面を表します。\n///\n/// 内部的には0から5の整数値にマップされており、\n/// 各面のステッカー配列の開始インデックスを計算するために使用されます。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Face {\n    /// 上面 (Whiteが標準)\n    Up = 0,\n    /// 下面 (Yellowが標準)\n    Down = 1,\n    /// 左面 (Greenが標準)\n    Left = 2,\n    /// 右面 (Blueが標準)\n    Right = 3,\n    /// 前面 (Redが標準)\n    Front = 4,\n    /// 背面 (Orangeが標準)\n    Back = 5,\n}\n\nimpl Face {\n    /// この面のステッカー配列における開始インデックスを取得します。\n    ///\n    /// 2x2キューブでは各面4枚のステッカーがあるため、\n    /// インデックスは (面の番号 * 4) となります。\n    #[must_use]\n    pub const fn start_index(self) -\u003e usize {\n        (self as usize) * STICKERS_PER_FACE\n    }\n\n    /// 対面を取得します。\n    #[must_use]\n    pub fn opposite(self) -\u003e Face {\n        match self {\n            Face::Up =\u003e Face::Down,\n            Face::Down =\u003e Face::Up,\n            Face::Left =\u003e Face::Right,\n            Face::Right =\u003e Face::Left,\n            Face::Front =\u003e Face::Back,\n            Face::Back =\u003e Face::Front,\n        }\n    }\n\n    /// 適当な隣接面を1つ取得します。\n    #[must_use]\n    pub fn any_adjacent(self) -\u003e Face {\n        match self {\n            Face::Up =\u003e Face::Front,\n            Face::Down =\u003e Face::Front,\n            Face::Left =\u003e Face::Up,\n            Face::Right =\u003e Face::Up,\n            Face::Front =\u003e Face::Up,\n            Face::Back =\u003e Face::Up,\n        }\n    }\n\n    /// すべての面を列挙した配列を返します。\n    ///\n    /// # 例\n    ///\n    /// ```\n    /// use rubiks_cube_3x3::cube::Face;\n    /// for face in Face::all() {\n    ///     println!(\"{:?}\", face);\n    /// }\n    /// ```\n    #[must_use]\n    pub fn all() -\u003e [Face; 6] {\n        [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ]\n    }\n\n    /// インデックスから面を取得します。\n    pub fn from_index(index: usize) -\u003e Self {\n        match index / 9 {\n            0 =\u003e Face::Up,\n            1 =\u003e Face::Down,\n            2 =\u003e Face::Left,\n            3 =\u003e Face::Right,\n            4 =\u003e Face::Front,\n            5 =\u003e Face::Back,\n            _ =\u003e Face::Up,\n        }\n    }\n\n    /// 面内の 0-8 のインデックスから空間座標を返します。\n    pub fn to_pos_for_local_index(\u0026self, local_idx: usize) -\u003e Vec3 {\n        let row = (local_idx / 3) as f32;\n        let col = (local_idx % 3) as f32;\n        match self {\n            Face::Up =\u003e Vec3::new(col - 1.0, 1.0, row - 1.0),\n            Face::Down =\u003e Vec3::new(col - 1.0, -1.0, 1.0 - row),\n            Face::Left =\u003e Vec3::new(-1.0, 1.0 - row, col - 1.0),\n            Face::Right =\u003e Vec3::new(1.0, 1.0 - row, 1.0 - col),\n            Face::Front =\u003e Vec3::new(col - 1.0, 1.0 - row, 1.0),\n            Face::Back =\u003e Vec3::new(1.0 - col, 1.0 - row, -1.0),\n        }\n    }\n}\n\n/// ステッカーの総数\npub const NUM_STICKERS: usize = 54;\n/// 1面あたりのステッカー数\npub const STICKERS_PER_FACE: usize = 9;\n\n/// ステッカーの色の定義です。\n///\n/// 標準的なルービックキューブの6色に加えて、\n/// 未設定状態を表す `Gray` を含みます。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Color {\n    /// 白 (通常は上面)\n    White,\n    /// 黄 (通常は下面)\n    Yellow,\n    /// 緑 (通常は左面)\n    Green,\n    /// 青 (通常は右面)\n    Blue,\n    /// 赤 (通常は前面)\n    Red,\n    /// 橙 (通常は背面)\n    Orange,\n    /// 灰色 (未設定・無効な色)\n    Gray,\n}\n\n/// 1枚のステッカーを表す構造体。\n///\n/// 色情報（[`Color`]）と、そのステッカーの現在の向き（[`orientation`](Self::orientation)）を保持します。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct Sticker {\n    /// ステッカーの色\n    pub color: Color,\n    /// 向き（0-3の値で、90度単位の物理的な回転状態を表す。0が初期状態）\n    pub orientation: u8,\n}\n\nimpl Sticker {\n    /// 指定された色で、向きが0（初期状態）のステッカーを作成します。\n    #[must_use]\n    pub fn new(color: Color) -\u003e Self {\n        Self {\n            color,\n            orientation: 0,\n        }\n    }\n\n    /// ステッカーを時計回りに90度回転させます（向き情報を更新）。\n    pub fn rotate_cw(\u0026mut self) {\n        self.orientation = (self.orientation + 1) % 4;\n    }\n\n    /// ステッカーを反時計回りに90度回転させます（向き情報を更新）。\n    pub fn rotate_ccw(\u0026mut self) {\n        self.orientation = (self.orientation + 3) % 4;\n    }\n}\n\n/// キューブに対する単一の回転操作を定義します。\n///\n/// 各文字（R, L, U, D, F, B）は操作する面を表し、\n/// 接尾辞（なし, p, 2）は回転の量と方向を表します。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Move {\n    /// 右面 時計回り 90度\n    R,\n    /// 右面 反時計回り 90度 (Prime)\n    Rp,\n    /// 右面 180度\n    R2,\n    /// 左面 時計回り 90度\n    L,\n    /// 左面 反時計回り 90度\n    Lp,\n    /// 左面 180度\n    L2,\n    /// 上面 時計回り 90度\n    U,\n    /// 上面 反時計回り 90度\n    Up,\n    /// 上面 180度\n    U2,\n    /// 下面 時計回り 90度\n    D,\n    /// 下面 反時計回り 90度\n    Dp,\n    /// 下面 180度\n    D2,\n    /// 前面 時計回り 90度\n    F,\n    /// 前面 反時計回り 90度\n    Fp,\n    /// 前面 180度\n    F2,\n    /// 背面 時計回り 90度\n    B,\n    /// 背面 反時計回り 90度\n    Bp,\n    /// 背面 180度\n    B2,\n    /// 中層(M) 時計回り 90度\n    M,\n    /// 中層(M) 反時計回り 90度\n    Mp,\n    /// 中層(M) 180度\n    M2,\n    /// 中層(E) 時計回り 90度\n    E,\n    /// 中層(E) 反時計回り 90度\n    Ep,\n    /// 中層(E) 180度\n    E2,\n    /// 中層(S) 時計回り 90度\n    S,\n    /// 中層(S) 反時計回り 90度\n    Sp,\n    /// 中層(S) 180度\n    S2,\n    /// 全体(X) 時計回り 90度\n    X,\n    /// 全体(X) 反時計回り 90度\n    Xp,\n    /// 全体(X) 180度\n    X2,\n    /// 全体(Y) 時計回り 90度\n    Y,\n    /// 全体(Y) 反時計回り 90度\n    Yp,\n    /// 全体(Y) 180度\n    Y2,\n    /// 全体(Z) 時計回り 90度\n    Z,\n    /// 全体(Z) 反時計回り 90度\n    Zp,\n    /// 全体(Z) 180度\n    Z2,\n}\n\nimpl Move {\n    /// 全体回転（X, Y, Z）であるかを判定します。\n    #[must_use]\n    pub fn is_global(self) -\u003e bool {\n        matches!(\n            self,\n            Move::X\n                | Move::Xp\n                | Move::X2\n                | Move::Y\n                | Move::Yp\n                | Move::Y2\n                | Move::Z\n                | Move::Zp\n                | Move::Z2\n        )\n    }\n\n    /// 中層回転（M, E, S）であるかを判定します。\n    #[must_use]\n    pub fn is_middle_layer(self) -\u003e bool {\n        matches!(\n            self,\n            Move::M\n                | Move::Mp\n                | Move::M2\n                | Move::E\n                | Move::Ep\n                | Move::E2\n                | Move::S\n                | Move::Sp\n                | Move::S2\n        )\n    }\n\n    /// 基本面回転（U, D, L, R, F, B）であるかを判定します。\n    #[must_use]\n    pub fn is_face_move(self) -\u003e bool {\n        !self.is_global() \u0026\u0026 !self.is_middle_layer()\n    }\n\n    /// 利用可能なすべての回転操作（36種類）を一覧したベクタを返します。\n    #[must_use]\n    pub fn all_moves() -\u003e Vec\u003cMove\u003e {\n        vec![\n            Move::R,\n            Move::Rp,\n            Move::R2,\n            Move::L,\n            Move::Lp,\n            Move::L2,\n            Move::U,\n            Move::Up,\n            Move::U2,\n            Move::D,\n            Move::Dp,\n            Move::D2,\n            Move::F,\n            Move::Fp,\n            Move::F2,\n            Move::B,\n            Move::Bp,\n            Move::B2,\n            Move::M,\n            Move::Mp,\n            Move::M2,\n            Move::E,\n            Move::Ep,\n            Move::E2,\n            Move::S,\n            Move::Sp,\n            Move::S2,\n            Move::X,\n            Move::Xp,\n            Move::X2,\n            Move::Y,\n            Move::Yp,\n            Move::Y2,\n            Move::Z,\n            Move::Zp,\n            Move::Z2,\n        ]\n    }\n\n    /// 指定された操作の逆操作（反対方向の回転）を返します。\n    ///\n    /// 180度回転（2）の逆操作は、便宜上同じ180度回転を返します。\n    #[must_use]\n    pub fn inverse(self) -\u003e Move {\n        match self {\n            Move::R =\u003e Move::Rp,\n            Move::Rp =\u003e Move::R,\n            Move::R2 =\u003e Move::R2,\n            Move::L =\u003e Move::Lp,\n            Move::Lp =\u003e Move::L,\n            Move::L2 =\u003e Move::L2,\n            Move::U =\u003e Move::Up,\n            Move::Up =\u003e Move::U,\n            Move::U2 =\u003e Move::U2,\n            Move::D =\u003e Move::Dp,\n            Move::Dp =\u003e Move::D,\n            Move::D2 =\u003e Move::D2,\n            Move::F =\u003e Move::Fp,\n            Move::Fp =\u003e Move::F,\n            Move::F2 =\u003e Move::F2,\n            Move::B =\u003e Move::Bp,\n            Move::Bp =\u003e Move::B,\n            Move::B2 =\u003e Move::B2,\n            Move::M =\u003e Move::Mp,\n            Move::Mp =\u003e Move::M,\n            Move::M2 =\u003e Move::M2,\n            Move::E =\u003e Move::Ep,\n            Move::Ep =\u003e Move::E,\n            Move::E2 =\u003e Move::E2,\n            Move::S =\u003e Move::Sp,\n            Move::Sp =\u003e Move::S,\n            Move::S2 =\u003e Move::S2,\n            Move::X =\u003e Move::Xp,\n            Move::Xp =\u003e Move::X,\n            Move::X2 =\u003e Move::X2,\n            Move::Y =\u003e Move::Yp,\n            Move::Yp =\u003e Move::Y,\n            Move::Y2 =\u003e Move::Y2,\n            Move::Z =\u003e Move::Zp,\n            Move::Zp =\u003e Move::Z,\n            Move::Z2 =\u003e Move::Z2,\n        }\n    }\n\n    /// 180度回転操作を90度回転操作2回に分割するための、1回分の操作を取得します。\n    ///\n    /// 90度回転（なし/p）の場合は `None` を返します。\n    #[must_use]\n    pub fn split_to_single(self) -\u003e Option\u003cMove\u003e {\n        match self {\n            Move::R2 =\u003e Some(Move::R),\n            Move::L2 =\u003e Some(Move::L),\n            Move::U2 =\u003e Some(Move::U),\n            Move::D2 =\u003e Some(Move::D),\n            Move::F2 =\u003e Some(Move::F),\n            Move::B2 =\u003e Some(Move::B),\n            Move::M2 =\u003e Some(Move::M),\n            Move::E2 =\u003e Some(Move::E),\n            Move::S2 =\u003e Some(Move::S),\n            Move::X2 =\u003e Some(Move::X),\n            Move::Y2 =\u003e Some(Move::Y),\n            Move::Z2 =\u003e Some(Move::Z),\n            _ =\u003e None,\n        }\n    }\n\n    /// 操作を幾何学的なパラメータ（回転軸、角度）に変換します。\n    pub fn geometric_params(self) -\u003e (Vec3, f32) {\n        let pi_2 = std::f32::consts: esult\u003cCube\u003e {\n    let lines: Vec\u003c\u0026str\u003e = s.lines().collect();\n\n    if lines.len() != 3 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"3行必要ですが{}行しかありません\",\n            lines.len()\n        )));\n    }\n\n    // 色を解析\n    let parse_colors = |s: \u0026str| -\u003e Result\u003cVec\u003cColor\u003e\u003e {\n        s.chars()\n            .filter(|c| !c.is_whitespace())\n            .map(|c| match c.to_ascii_uppercase() {\n                'W' =\u003e Ok(Color::White),\n                'Y' =\u003e Ok(Color::Yellow),\n                'G' =\u003e Ok(Color::Green),\n                'B' =\u003e Ok(Color::Blue),\n                'R' =\u003e Ok(Color::Red),\n                'O' =\u003e Ok(Color::Orange),\n                '.' =\u003e Ok(Color::Gray),\n                _ =\u003e Err(CubeError::InvalidColorChar(c)),\n            })\n            .collect()\n    };\n\n    // 各行から色を取得\n    let line1_colors = parse_colors(lines[0])?;\n    let line2_colors = parse_colors(lines[1])?;\n    let line3_colors = parse_colors(lines[2])?;\n\n    // 検証\n    if line1_colors.len() != 9 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"1行目: 9ステッカー必要ですが{}個です\",\n            line1_colors.len()\n        )));\n    }\n    if line2_colors.len() != 36 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"2行目: 36ステッカー必要ですが{}個です\",\n            line2_colors.len()\n        )));\n    }\n    if line3_colors.len() != 9 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"3行目: 9ステッカー必要ですが{}個です\",\n            line3_colors.len()\n        )));\n    }\n\n    // 24色の配列を作成（内部順序: Up, Down, Left, Right, Front, Back）\n\n    // 各面の配置ルール: (面、ソースとなる色のスライス)\n    const SPF: usize = crate::cube::STICKERS_PER_FACE;\n    use crate::cube::{Face, Sticker};\n    let mut stickers = [Sticker::new(Color::White); crate::cube::NUM_STICKERS];\n\n    let mut map_face = |face: Face, line_colors: \u0026[Color]| {\n        let start = face.start_index();\n        for i in 0..SPF {\n            stickers[start + i] = Sticker::new(line_colors[i]);\n        }\n    };\n\n    map_face(Face::Up, \u0026line1_colors);\n    map_face(Face::Down, \u0026line3_colors);\n    map_face(Face::Left, \u0026line2_colors[0..9]);\n    map_face(Face::Front, \u0026line2_colors[9..18]);\n    map_face(Face::Right, \u0026line2_colors[18..27]);\n    map_face(Face::Back, \u0026line2_colors[27..36]);\n\n    let mut cube = Cube {\n        stickers,\n        pieces: crate::cube::piece::get_initial_pieces(),\n    };\n\n    // スキャン途中（Grayあり）でない場合は、向きを初期化し、ピースモデルを復元\n    let has_gray = cube.stickers.iter().any(|s| s.color == Color::Gray);\n    if !has_gray {\n        // 各ピースの位置と回転を色から物理的に正しく復元\n        cube.restore_orientation_instantly()?;\n    }\n\n    Ok(cube)\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":14}},{"line":7,"address":[],"length":0,"stats":{"Line":28}},{"line":10,"address":[],"length":0,"stats":{"Line":98}},{"line":11,"address":[],"length":0,"stats":{"Line":168}},{"line":12,"address":[],"length":0,"stats":{"Line":168}},{"line":13,"address":[],"length":0,"stats":{"Line":840}},{"line":14,"address":[],"length":0,"stats":{"Line":1512}},{"line":15,"address":[],"length":0,"stats":{"Line":1512}},{"line":16,"address":[],"length":0,"stats":{"Line":124}},{"line":17,"address":[],"length":0,"stats":{"Line":126}},{"line":18,"address":[],"length":0,"stats":{"Line":126}},{"line":19,"address":[],"length":0,"stats":{"Line":126}},{"line":20,"address":[],"length":0,"stats":{"Line":126}},{"line":21,"address":[],"length":0,"stats":{"Line":126}},{"line":22,"address":[],"length":0,"stats":{"Line":2}},{"line":24,"address":[],"length":0,"stats":{"Line":2268}},{"line":26,"address":[],"length":0,"stats":{"Line":84}},{"line":31,"address":[],"length":0,"stats":{"Line":42}},{"line":32,"address":[],"length":0,"stats":{"Line":42}},{"line":33,"address":[],"length":0,"stats":{"Line":28}},{"line":36,"address":[],"length":0,"stats":{"Line":42}},{"line":37,"address":[],"length":0,"stats":{"Line":28}},{"line":38,"address":[],"length":0,"stats":{"Line":42}},{"line":39,"address":[],"length":0,"stats":{"Line":28}},{"line":40,"address":[],"length":0,"stats":{"Line":42}},{"line":41,"address":[],"length":0,"stats":{"Line":28}},{"line":42,"address":[],"length":0,"stats":{"Line":42}},{"line":43,"address":[],"length":0,"stats":{"Line":28}},{"line":46,"address":[],"length":0,"stats":{"Line":42}},{"line":47,"address":[],"length":0,"stats":{"Line":42}},{"line":48,"address":[],"length":0,"stats":{"Line":28}},{"line":50,"address":[],"length":0,"stats":{"Line":14}},{"line":54,"address":[],"length":0,"stats":{"Line":34}},{"line":55,"address":[],"length":0,"stats":{"Line":170}},{"line":57,"address":[],"length":0,"stats":{"Line":34}},{"line":58,"address":[],"length":0,"stats":{"Line":8}},{"line":59,"address":[],"length":0,"stats":{"Line":4}},{"line":60,"address":[],"length":0,"stats":{"Line":4}},{"line":65,"address":[],"length":0,"stats":{"Line":116}},{"line":66,"address":[],"length":0,"stats":{"Line":172}},{"line":67,"address":[],"length":0,"stats":{"Line":4430}},{"line":68,"address":[],"length":0,"stats":{"Line":1594}},{"line":69,"address":[],"length":0,"stats":{"Line":220}},{"line":70,"address":[],"length":0,"stats":{"Line":208}},{"line":71,"address":[],"length":0,"stats":{"Line":216}},{"line":72,"address":[],"length":0,"stats":{"Line":212}},{"line":73,"address":[],"length":0,"stats":{"Line":216}},{"line":74,"address":[],"length":0,"stats":{"Line":216}},{"line":75,"address":[],"length":0,"stats":{"Line":218}},{"line":76,"address":[],"length":0,"stats":{"Line":2}},{"line":82,"address":[],"length":0,"stats":{"Line":90}},{"line":83,"address":[],"length":0,"stats":{"Line":84}},{"line":84,"address":[],"length":0,"stats":{"Line":84}},{"line":87,"address":[],"length":0,"stats":{"Line":28}},{"line":88,"address":[],"length":0,"stats":{"Line":4}},{"line":89,"address":[],"length":0,"stats":{"Line":2}},{"line":90,"address":[],"length":0,"stats":{"Line":2}},{"line":93,"address":[],"length":0,"stats":{"Line":26}},{"line":94,"address":[],"length":0,"stats":{"Line":4}},{"line":95,"address":[],"length":0,"stats":{"Line":2}},{"line":96,"address":[],"length":0,"stats":{"Line":2}},{"line":99,"address":[],"length":0,"stats":{"Line":24}},{"line":100,"address":[],"length":0,"stats":{"Line":4}},{"line":101,"address":[],"length":0,"stats":{"Line":2}},{"line":102,"address":[],"length":0,"stats":{"Line":2}},{"line":111,"address":[],"length":0,"stats":{"Line":44}},{"line":113,"address":[],"length":0,"stats":{"Line":154}},{"line":114,"address":[],"length":0,"stats":{"Line":396}},{"line":115,"address":[],"length":0,"stats":{"Line":2508}},{"line":116,"address":[],"length":0,"stats":{"Line":2376}},{"line":120,"address":[],"length":0,"stats":{"Line":44}},{"line":121,"address":[],"length":0,"stats":{"Line":44}},{"line":122,"address":[],"length":0,"stats":{"Line":66}},{"line":123,"address":[],"length":0,"stats":{"Line":66}},{"line":124,"address":[],"length":0,"stats":{"Line":66}},{"line":125,"address":[],"length":0,"stats":{"Line":66}},{"line":129,"address":[],"length":0,"stats":{"Line":22}},{"line":133,"address":[],"length":0,"stats":{"Line":1810}},{"line":134,"address":[],"length":0,"stats":{"Line":22}},{"line":136,"address":[],"length":0,"stats":{"Line":32}},{"line":139,"address":[],"length":0,"stats":{"Line":22}}],"covered":81,"coverable":81},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","cube","mod.rs"],"content":"pub mod enums;\npub mod io;\npub mod piece;\npub mod rotation;\npub mod validation;\n\npub use self::enums::{Color, Face, Move, Sticker, NUM_STICKERS, STICKERS_PER_FACE};\n\n/// 完成状態における標準的なステッカーの向きパターン。\npub const CLOCKWISE_ORIENTATION_PATTERN: [u8; 9] = [0; 9];\n\n/// 3x3 ルービックキューブを表す構造体。\n///\n/// 54枚のステッカー（[`Sticker`]）をフラットな配列として保持します。\n/// 内部構造は面の順序と各面内のインデックスによって定義されます。\n#[derive(Debug, Clone)]\npub struct Cube {\n    pub stickers: [Sticker; 54],\n    pub pieces: [piece::Cubie; 26],\n}\n\nimpl PartialEq for Cube {\n    fn eq(\u0026self, other: \u0026Self) -\u003e bool {\n        self.stickers == other.stickers\n    }\n}\n\nimpl Eq for Cube {}\n\nimpl std::hash::Hash for Cube {\n    fn hash\u003cH: std::hash::Hasher\u003e(\u0026self, state: \u0026mut H) {\n        self.stickers.hash(state);\n    }\n}\n\nimpl Cube {\n    #[must_use]\n    pub fn new() -\u003e Self {\n        let stickers = [Sticker::new(Color::White); NUM_STICKERS];\n        let pieces = piece::get_initial_pieces();\n        let mut cube = Self { stickers, pieces };\n        cube.sync_stickers();\n        cube\n    }\n\n    /// ピースの状態からステッカー配列を更新します。\n    pub fn sync_stickers(\u0026mut self) {\n        for p in \u0026self.pieces {\n            p.project_to_stickers(\u0026mut self.stickers);\n        }\n    }\n\n    /// 各面のステッカーの色がすべて一致しているか（完成しているか）を判定します。\n    ///\n    /// ステッカー自体の向き（矢印などの方向）は無視されます。\n    ///\n    /// # 戻り値\n    ///\n    /// すべての面が単色であれば `true` を返します。\n    #[must_use]\n    pub fn is_solved(\u0026self) -\u003e bool {\n        for face in Face::all() {\n            let face_start = face.start_index();\n            let color = self.stickers[face_start].color;\n            for i in 1..STICKERS_PER_FACE {\n                if self.stickers[face_start + i].color != color {\n                    return false;\n                }\n            }\n        }\n        true\n    }\n\n    /// 色が揃っており、かつステッカーの向きも初期状態と同じであるかを判定します。\n    ///\n    /// # 戻り値\n    ///\n    /// 色と向きの両方が初期状態と一致していれば `true` を返します。\n    #[must_use]\n    pub fn is_solved_with_orientation(\u0026self) -\u003e bool {\n        if !self.is_solved() {\n            return false;\n        }\n        for face in Face::all() {\n            let start = face.start_index();\n            for (i, \u0026expected_orientation) in CLOCKWISE_ORIENTATION_PATTERN.iter().enumerate() {\n                if self.stickers[start + i].orientation != expected_orientation {\n                    return false;\n                }\n            }\n        }\n        true\n    }\n\n    /// 指定した絶対インデックス（0-23）のステッカーを取得します。\n    #[must_use]\n    pub fn get_sticker(\u0026self, index: usize) -\u003e Sticker {\n        self.stickers[index]\n    }\n\n    /// 指定した絶対インデックスのステッカーの色を設定します。\n    ///\n    /// 色を変更すると、そのステッカーの向き（orientation）は 0 にリセットされます。\n    pub fn set_sticker_color(\u0026mut self, index: usize, color: Color) {\n        self.stickers[index].color = color;\n        // 向きはリセット（手動入力時は向きを0にする）\n        self.stickers[index].orientation = 0;\n    }\n\n    /// 各ステッカーの色を維持したまま、向き情報のみを標準的な時計回りパターンにリセットした新しいキューブを返します。\n    ///\n    /// ソルバーで色のみを解いた後に、物理的に正しい向きを再設定する場合などに使用されます。\n    #[must_use]\n    pub fn with_clockwise_orientations(\u0026self) -\u003e Self {\n        let mut new_cube = self.clone();\n\n        for face in Face::all() {\n            let face_start = face.start_index();\n            for (offset, \u0026pattern) in CLOCKWISE_ORIENTATION_PATTERN.iter().enumerate() {\n                let idx = face_start + offset;\n                new_cube.stickers[idx].orientation = pattern;\n            }\n        }\n\n        new_cube\n    }\n\n    /// 54個の色配列から新しいキューブを作成します（物理的な向きを自動復元）。\n    ///\n    /// 色の配置が物理的に可能でない場合はエラーを返します。\n    pub fn from_colors(colors: \u0026[Color; 54]) -\u003e crate::error::Result\u003cSelf\u003e {\n        let mut stickers = [Sticker::new(Color::White); 54];\n        for (i, \u0026color) in colors.iter().enumerate() {\n            stickers[i] = Sticker {\n                color,\n                orientation: 0, // 一時的に0で初期化\n            };\n        }\n\n        let mut cube = Cube {\n            stickers,\n            pieces: piece::get_initial_pieces(),\n        };\n        // Call the static validate_colors method\n        Self::validate_colors(colors)?;\n\n        // 3色から物理的に正しい向きを復元\n        cube.restore_orientation_instantly()?;\n\n        Ok(cube)\n    }\n\n    /// 指定された色配列（54要素）がキューブとして妥当であるかを検証します。\n    pub fn validate_colors(colors: \u0026[Color; 54]) -\u003e crate::error::Result\u003c()\u003e {\n        validation::validate_colors(colors)\n    }\n\n    /// キューブの現在の状態（色と向きの組み合わせ）が、物理的に到達可能な有効な状態であるかを判定します。\n    pub fn is_valid_state(\u0026self) -\u003e crate::error::Result\u003c()\u003e {\n        validation::is_valid_state(self)\n    }\n\n    /// キューブの現在の内容を、ファイル保存用のテキスト形式に変換します。\n    pub fn to_file_format(\u0026self) -\u003e String {\n        io::to_file_format(self)\n    }\n\n    /// ファイル保存形式の文字列をパースして、新しいキューブを作成します。\n    pub fn from_file_format(s: \u0026str) -\u003e crate::error::Result\u003cSelf\u003e {\n        io::from_file_format(s)\n    }\n\n    /// 回転操作を適用します。\n    pub fn apply_move(\u0026mut self, mv: Move) {\n        rotation::apply_move(self, mv);\n    }\n\n    /// 指定回数のランダムな回転操作を適用します。\n    pub fn scramble(\u0026mut self, moves: usize) {\n        rotation::scramble(self, moves);\n    }\n\n    /// 現在の色配置に基づいて、物理的に正しいステッカー向（twist）を瞬時に復元します。\n    ///\n    /// 各コーナーピースの3色の配置を、24通りの完成状態のいずれかと照合することで、\n    /// 探索を行わずに正しい向きを特定します。\n    ///\n    /// # エラー\n    ///\n    /// 各ステッカーの色情報から、ピースの位置と回転を物理的に正しい状態に復元します。\n    pub fn restore_orientation_instantly(\u0026mut self) -\u003e crate::error::Result\u003c()\u003e {\n        // 色の妥当性チェック\n        let mut colors_array = [Color::White; 54];\n        for (i, color) in colors_array.iter_mut().enumerate() {\n            *color = self.stickers[i].color;\n        }\n        Self::validate_colors(\u0026colors_array)?;\n\n        use crate::cube::validation::{CENTER_STICKERS, CORNER_STICKERS, EDGE_STICKERS};\n\n        // 24通りの完成状態（全方位）を取得\n        let solved_states = crate::solver::get_solved_states();\n        let mut new_pieces_vec = Vec::new();\n\n        // 1. まずセンターの位置関係から、現在の「全体の方位」を特定する。\n        //    センターのみが完全に一致する solved_state を探す。\n        let mut preferred_state_idx = 0;\n        let mut found_preferred = false;\n        for (idx, solved) in solved_states.iter().enumerate() {\n            let mut centers_match = true;\n            for \u0026c_idx in \u0026CENTER_STICKERS {\n                if self.stickers[c_idx].color != solved.stickers[c_idx].color {\n                    centers_match = false;\n                    break;\n                }\n            }\n            if centers_match {\n                preferred_state_idx = idx;\n                found_preferred = true;\n                break;\n            }\n        }\n\n        if !found_preferred {\n            return Err(crate::error::CubeError::InvalidState(\n                \"中心ピースの色配置が不正です\".to_string(),\n            ));\n        }\n        let preferred_state = \u0026solved_states[preferred_state_idx];\n\n        if !preferred_state.is_solved_with_orientation() {\n            return Err(crate::error::CubeError::InvalidState(\n                \"内部解決状態の不整合\".to_string(),\n            ));\n        }\n\n        // 2. 特定された preferred_state に基づいてセンターピースを復元\n        for \u0026idx in \u0026CENTER_STICKERS {\n            self.restore_piece_at_slot(\n                \u0026[idx],\n                std::slice::from_ref(preferred_state),\n                \u0026mut new_pieces_vec,\n            )?;\n        }\n\n        // 3. コーナーとエッジを復元（これらは色情報から物理的に一義的に決まる）\n        // コーナー (8個)\n        for \u0026slot_indices in \u0026CORNER_STICKERS {\n            self.restore_piece_at_slot(\u0026slot_indices, solved_states, \u0026mut new_pieces_vec)?;\n        }\n\n        // エッジ (12個)\n        for \u0026slot_indices in \u0026EDGE_STICKERS {\n            self.restore_piece_at_slot(\u0026slot_indices, solved_states, \u0026mut new_pieces_vec)?;\n        }\n\n        if new_pieces_vec.len() != 26 {\n            return Err(crate::error::CubeError::InvalidState(format!(\n                \"ピースの復元に失敗しました（計{}個）\",\n                new_pieces_vec.len()\n            )));\n        }\n\n        // pieces 配列を更新\n        self.pieces = new_pieces_vec.try_into().map_err(|_| {\n            crate::error::CubeError::InvalidState(\"ピース配列の変換に失敗しました\".to_string())\n        })?;\n\n        // 最後に pieces の状態を stickers (特に orientation) に反映\n        self.sync_stickers();\n\n        // 最終的なチェック\n        self.is_valid_state()\n    }\n\n    /// 特定のスロットにあるピースを、 solved_states を利用して復元します。\n    fn restore_piece_at_slot(\n        \u0026self,\n        slot_indices: \u0026[usize],\n        solved_states: \u0026[Cube],\n        target_pieces: \u0026mut Vec\u003cpiece::Cubie\u003e,\n    ) -\u003e crate::error::Result\u003c()\u003e {\n        let current_colors: Vec\u003cColor\u003e = slot_indices\n            .iter()\n            .map(|\u0026idx| self.stickers[idx].color)\n            .collect();\n\n        for solved in solved_states {\n            let solved_colors: Vec\u003cColor\u003e = slot_indices\n                .iter()\n                .map(|\u0026idx| solved.stickers[idx].color)\n                .collect();\n\n            if current_colors == solved_colors {\n                // どのステッカーも同じピースに属しているはずなので、slot_indices[0] を使ってピースを特定する\n                let test_idx = slot_indices[0];\n\n                // solved.pieces を探索して、test_idx にステッカーを投影するピースを探す\n                for p in \u0026solved.pieces {\n                    let mut temp_stickers = [Sticker::new(Color::Gray); NUM_STICKERS];\n                    p.project_to_stickers(\u0026mut temp_stickers);\n                    if temp_stickers[test_idx].color != Color::Gray {\n                        // 見つけた！(位置も回転も solved Cube のものが現在のスロットの状態を正しく表している)\n                        target_pieces.push(p.clone());\n                        return Ok(());\n                    }\n                }\n            }\n        }\n\n        Err(crate::error::CubeError::InvalidState(format!(\n            \"指定された色の組み合わせを持つピースが見つかりません: {:?}\",\n            current_colors\n        )))\n    }\n\n    /// ソルバーで見つかった解を利用して向きを復元します（現在は内部で `restore_orientation_instantly` を呼び出します）。\n    pub fn apply_orientation_solution(\n        \u0026mut self,\n        _solution: \u0026crate::solver::Solution,\n    ) -\u003e crate::error::Result\u003c()\u003e {\n        self.restore_orientation_instantly()\n    }\n\n    /// ステッカー配列に設定された中央方位（orientation）情報を、内部のピース状態に強制的に同期させます。\n    ///\n    /// 通常、`apply_move` を呼ぶとピースの状態からステッカーが再生成されますが、\n    /// テストなどでステッカーの方位を直接書き換えた場合、このメソッドを呼ぶことで\n    /// その方位を物理的なピースの回転状態として定着させることができます。\n    pub fn force_sync_orientation_to_pieces(\u0026mut self) {\n        use crate::cube::validation::CENTER_STICKERS;\n\n        for \u0026idx in \u0026CENTER_STICKERS {\n            let ori = self.stickers[idx].orientation;\n            if ori == 0 {\n                continue;\n            }\n\n            // 該当するセンターピースを見つける\n            let target_color = self.stickers[idx].color;\n            for p in \u0026mut self.pieces {\n                if p.piece_type == crate::cube::piece::PieceType::Center\n                    \u0026\u0026 p.stickers[0].color == target_color\n                {\n                    // センターピースの向きを更新する\n                    // calculate_orientation の逆関数的な動作が必要。\n                    // 0 -\u003e 単位行列\n                    // 1 -\u003e 軸を中心に時計回り 90度\n                    // 2 -\u003e 180度\n                    // 3 -\u003e 反時計回り 90度\n\n                    let normal = p.stickers[0].initial_normal;\n                    let angle = match ori {\n                        1 =\u003e -std::f32::consts::FRAC_PI_2, // CW\n                        2 =\u003e std::f32::consts::PI,         // 180\n                        3 =\u003e std::f32::consts::FRAC_PI_2,  // CCW\n                        _ =\u003e 0.0,\n                    };\n\n                    // 現在の回転をリセットして、指定された方位に設定する\n                    // (注意: このメソッドは「色が揃っている解決状態」付近での使用を想定している)\n                    p.current_rot = glam::Mat4::from_axis_angle(normal, angle);\n                    break;\n                }\n            }\n        }\n        // pieces を更新したので、再度 stickers に反映（整合性確保）\n        self.sync_stickers();\n    }\n\n    /// 各ステッカーの向き情報をリセット（0に設定）したキューブの複製を返します。\n    ///\n    /// ハッシュマップやセットで、向きによらず「色の配置」のみで状態を管理したい場合に使用します。\n    #[must_use]\n    pub fn normalized(\u0026self) -\u003e Self {\n        let mut new_cube = self.clone();\n        for sticker in \u0026mut new_cube.stickers {\n            sticker.orientation = 0;\n        }\n        new_cube\n    }\n}\n\nimpl Default for Cube {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":704}},{"line":24,"address":[],"length":0,"stats":{"Line":704}},{"line":31,"address":[],"length":0,"stats":{"Line":1358}},{"line":32,"address":[],"length":0,"stats":{"Line":4074}},{"line":38,"address":[],"length":0,"stats":{"Line":342}},{"line":39,"address":[],"length":0,"stats":{"Line":684}},{"line":40,"address":[],"length":0,"stats":{"Line":684}},{"line":41,"address":[],"length":0,"stats":{"Line":684}},{"line":42,"address":[],"length":0,"stats":{"Line":684}},{"line":43,"address":[],"length":0,"stats":{"Line":342}},{"line":47,"address":[],"length":0,"stats":{"Line":298402}},{"line":48,"address":[],"length":0,"stats":{"Line":15815306}},{"line":49,"address":[],"length":0,"stats":{"Line":15516904}},{"line":61,"address":[],"length":0,"stats":{"Line":24262}},{"line":62,"address":[],"length":0,"stats":{"Line":169284}},{"line":63,"address":[],"length":0,"stats":{"Line":435066}},{"line":64,"address":[],"length":0,"stats":{"Line":290044}},{"line":65,"address":[],"length":0,"stats":{"Line":1304610}},{"line":66,"address":[],"length":0,"stats":{"Line":1159588}},{"line":67,"address":[],"length":0,"stats":{"Line":110}},{"line":71,"address":[],"length":0,"stats":{"Line":24152}},{"line":80,"address":[],"length":0,"stats":{"Line":32}},{"line":81,"address":[],"length":0,"stats":{"Line":32}},{"line":82,"address":[],"length":0,"stats":{"Line":2}},{"line":84,"address":[],"length":0,"stats":{"Line":210}},{"line":85,"address":[],"length":0,"stats":{"Line":540}},{"line":86,"address":[],"length":0,"stats":{"Line":3780}},{"line":87,"address":[],"length":0,"stats":{"Line":1620}},{"line":88,"address":[],"l :Center,\n            2 =\u003e PieceType::Edge,\n            3 =\u003e PieceType::Corner,\n            _ =\u003e panic!(\"Invalid number of stickers for a piece: {}\", stickers.len()),\n        };\n\n        Self {\n            piece_type,\n            initial_pos: pos,\n            current_pos: pos,\n            current_rot: Mat4::IDENTITY,\n            stickers,\n        }\n    }\n\n    /// ピースを特定の軸を中心に指定された角度だけ回転させます。\n    pub fn rotate(\u0026mut self, axis: Vec3, angle_rad: f32) {\n        let rot_mat = Mat4::from_axis_angle(axis, angle_rad);\n\n        // 位置の更新 (浮動小数点の誤差を丸める)\n        let new_pos = rot_mat.transform_point3(self.current_pos);\n        self.current_pos = Vec3::new(new_pos.x.round(), new_pos.y.round(), new_pos.z.round());\n\n        // 回転状態の更新\n        self.current_rot = rot_mat * self.current_rot;\n    }\n\n    /// このピースが持つステッカーを、現在の回転状態に基づいて Facelet 配列（54枚）に投影します。\n    pub fn project_to_stickers(\u0026self, target: \u0026mut [Sticker; 54]) {\n        for cubie_sticker in \u0026self.stickers {\n            // 現在の法線を計算\n            let current_normal = self\n                .current_rot\n                .transform_vector3(cubie_sticker.initial_normal);\n            let n = Vec3::new(\n                current_normal.x.round(),\n                current_normal.y.round(),\n                current_normal.z.round(),\n            );\n\n            // どの面に属するか特定\n            let face = if n.y \u003e 0.5 {\n                Face::Up\n            } else if n.y \u003c -0.5 {\n                Face::Down\n            } else if n.x \u003c -0.5 {\n                Face::Left\n            } else if n.x \u003e 0.5 {\n                Face::Right\n            } else if n.z \u003e 0.5 {\n                Face::Front\n            } else if n.z \u003c -0.5 {\n                Face::Back\n            } else {\n                continue; // 内部に向いている面（通常はないはず）\n            };\n\n            // その面内でのインデックスを計算\n            let face_idx = face_to_local_index(face, self.current_pos);\n            let abs_idx = face.start_index() + face_idx;\n\n            // ステッカーの「向き (orientation)」を計算\n            // Piece の rotation 行列から、どの程度自転しているかを導出\n            let ori = self.calculate_orientation(cubie_sticker.initial_normal, n);\n\n            target[abs_idx] = Sticker {\n                color: cubie_sticker.color,\n                orientation: ori,\n            };\n        }\n    }\n\n    /// ステッカーの piece 内での向きを 0-3 で計算します。\n    pub fn calculate_orientation(\u0026self, initial_normal: Vec3, current_normal: Vec3) -\u003e u8 {\n        calculate_orientation_with_rot(initial_normal, current_normal, self.current_rot)\n    }\n\n    /// 与えられた色（順序不同）をすべて持っているピースかどうか判定します。\n    pub fn matches_colors(\u0026self, target_colors: \u0026[Color]) -\u003e bool {\n        if self.stickers.len() != target_colors.len() {\n            return false;\n        }\n        let mut available_colors: Vec\u003cColor\u003e = self.stickers.iter().map(|s| s.color).collect();\n        for \u0026tc in target_colors {\n            if let Some(pos) = available_colors.iter().position(|\u0026c| c == tc) {\n                available_colors.remove(pos);\n            } else {\n                return false;\n            }\n        }\n        true\n    }\n}\n\n/// 指定された回転行列に基づいて向きを計算します（アニメーション用）。\npub fn calculate_orientation_with_rot(\n    _initial_normal: Vec3,\n    current_normal: Vec3,\n    rot: Mat4,\n) -\u003e u8 {\n    let current_v_base = get_face_up_axis(current_normal);\n\n    // ピースの初期「上」方向（Whiteステッカーなら -Z等）が、今の回転行列でどこを向いているか\n    // すべてのステッカーについて、初期状態 (rot=IDENTITY) での initial_normal 方向の面において\n    // get_face_up_axis(initial_normal) が「上 (orientation=0)」を指していると仮定する。\n    // しかし、Cubie には複数のステッカーがあるので、各ステッカーごとに初期の上方向が異なる。\n\n    // 正しいアプローチ: 各ステッカーの initial_normal に対応する initial_v_base を求める。\n    let initial_v_base = get_face_up_axis(_initial_normal);\n    let actual_v = rot.transform_vector3(initial_v_base);\n\n    // actual_v と、現在の面の基準上方向 current_v_base のズレを計算する。\n    let dot = actual_v.dot(current_v_base);\n    if dot \u003e 0.9 {\n        0\n    } else if dot \u003c -0.9 {\n        2\n    } else {\n        let cross = current_v_base.cross(actual_v);\n        if cross.dot(current_normal) \u003e 0.9 {\n            3 // CCW\n        } else {\n            1 // CW\n        }\n    }\n}\n\n/// 面と空間座標から、面内の 0-8 のインデックスを返します。\npub fn face_to_local_index(face: Face, pos: Vec3) -\u003e usize {\n    match face {\n        Face::Up =\u003e {\n            let col = (pos.x + 1.0) as usize;\n            let row = (pos.z + 1.0) as usize;\n            row * 3 + col\n        }\n        Face::Down =\u003e {\n            let col = (pos.x + 1.0) as usize;\n            let row = (1.0 - pos.z) as usize;\n            row * 3 + col\n        }\n        Face::Left =\u003e {\n            let col = (pos.z + 1.0) as usize;\n            let row = (1.0 - pos.y) as usize;\n            row * 3 + col\n        }\n        Face::Right =\u003e {\n            let col = (1.0 - pos.z) as usize;\n            let row = (1.0 - pos.y) as usize;\n            row * 3 + col\n        }\n        Face::Front =\u003e {\n            let col = (pos.x + 1.0) as usize;\n            let row = (1.0 - pos.y) as usize;\n            row * 3 + col\n        }\n        Face::Back =\u003e {\n            let col = (1.0 - pos.x) as usize;\n            let row = (1.0 - pos.y) as usize;\n            row * 3 + col\n        }\n    }\n}\n\n/// 各面の「上」方向（orientation=0 の基準）を定義します。\n/// 展開図の接続 (U \u003c-\u003e B, B \u003c-\u003e D) がスムーズになるように定義。\nfn get_face_up_axis(normal: Vec3) -\u003e Vec3 {\n    let n = Vec3::new(normal.x.round(), normal.y.round(), normal.z.round());\n    if n == Vec3::Y {\n        -Vec3::Z // U\n    } else if n == -Vec3::Y {\n        Vec3::Z // D\n    } else {\n        Vec3::Y // L, R, F, B\n    }\n}\n\n/// 全26個のピースを初期完成状態で生成します。\npub fn get_initial_pieces() -\u003e [Cubie; 26] {\n    let mut pieces = Vec::new();\n\n    // -1, 0, 1 の全組み合わせ（(0,0,0)を除く）\n    for x in -1..=1 {\n        for y in -1..=1 {\n            for z in -1..=1 {\n                if x == 0 \u0026\u0026 y == 0 \u0026\u0026 z == 0 {\n                    continue;\n                }\n\n                let pos = Vec3::new(x as f32, y as f32, z as f32);\n                let mut stickers = Vec::new();\n\n                // 各座標が面の境界にある場合、ステッカーを追加\n                if x == 1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: Vec3::X,\n                        color: Color::Blue,\n                    });\n                }\n                if x == -1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: -Vec3::X,\n                        color: Color::Green,\n                    });\n                }\n                if y == 1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: Vec3::Y,\n                        color: Color::White,\n                    });\n                }\n                if y == -1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: -Vec3::Y,\n                        color: Color::Yellow,\n                    });\n                }\n                if z == 1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: Vec3::Z,\n                        color: Color::Red,\n                    });\n                }\n                if z == -1 {\n                    stickers.push(CubieSticker {\n                        initial_normal: -Vec3::Z,\n                        color: Color::Orange,\n                    });\n                }\n\n                pieces.push(Cubie::new(pos, stickers));\n            }\n        }\n    }\n\n    pieces.try_into().expect(\"Must have 26 pieces\")\n}\n","traces":[{"line":30,"address":[],"length":0,"stats":{"Line":9580}},{"line":31,"address":[],"length":0,"stats":{"Line":19158}},{"line":32,"address":[],"length":0,"stats":{"Line":2212}},{"line":33,"addre es {\n        if is_global || is_in_layer(piece.current_pos, axis, layer_val) {\n            piece.rotate(axis, angle);\n        }\n    }\n\n    // ピースの状態を Facelet（ステッカー）配列に反映\n    cube.sync_stickers();\n}\n\n/// 指定回数のランダムな回転操作を適用します。\npub fn scramble(cube: \u0026mut Cube, moves: usize) {\n    use rand::Rng;\n    let mut rng = rand::thread_rng();\n    let all_moves: Vec\u003cMove\u003e = Move::all_moves()\n        .into_iter()\n        .filter(|m| !m.is_global() \u0026\u0026 !m.is_middle_layer())\n        .collect();\n\n    for _ in 0..moves {\n        let mv = all_moves[rng.gen_range(0..all_moves.len())];\n        apply_move(cube, mv);\n    }\n}\n\n/// 操作を幾何学的なパラメータ（回転軸、対象層、角度）に変換します。\nfn move_to_geometric_params(mv: Move) -\u003e (Vec3, i8, f32) {\n    let pi_2 = std::f32::consts::FRAC_PI_2;\n    match mv {\n        // R層 (x = 1)\n        Move::R =\u003e (Vec3::X, 1, -pi_2),\n        Move::Rp =\u003e (Vec3::X, 1, pi_2),\n        Move::R2 =\u003e (Vec3::X, 1, pi_2 * 2.0),\n        // L層 (x = -1)\n        Move::L =\u003e (Vec3::X, -1, pi_2),\n        Move::Lp =\u003e (Vec3::X, -1, -pi_2),\n        Move::L2 =\u003e (Vec3::X, -1, pi_2 * 2.0),\n        // M層 (x = 0) - Lと同じ回転方向\n        Move::M =\u003e (Vec3::X, 0, pi_2),\n        Move::Mp =\u003e (Vec3::X, 0, -pi_2),\n        Move::M2 =\u003e (Vec3::X, 0, pi_2 * 2.0),\n\n        // U層 (y = 1)\n        Move::U =\u003e (Vec3::Y, 1, -pi_2),\n        Move::Up =\u003e (Vec3::Y, 1, pi_2),\n        Move::U2 =\u003e (Vec3::Y, 1, pi_2 * 2.0),\n        // D層 (y = -1)\n        Move::D =\u003e (Vec3::Y, -1, pi_2),\n        Move::Dp =\u003e (Vec3::Y, -1, -pi_2),\n        Move::D2 =\u003e (Vec3::Y, -1, pi_2 * 2.0),\n        // E層 (y = 0) - Dと同じ回転方向\n        Move::E =\u003e (Vec3::Y, 0, pi_2),\n        Move::Ep =\u003e (Vec3::Y, 0, -pi_2),\n        Move::E2 =\u003e (Vec3::Y, 0, pi_2 * 2.0),\n\n        // F層 (z = 1)\n        Move::F =\u003e (Vec3::Z, 1, -pi_2),\n        Move::Fp =\u003e (Vec3::Z, 1, pi_2),\n        Move::F2 =\u003e (Vec3::Z, 1, pi_2 * 2.0),\n        // B層 (z = -1)\n        Move::B =\u003e (Vec3::Z, -1, pi_2),\n        Move::Bp =\u003e (Vec3::Z, -1, -pi_2),\n        Move::B2 =\u003e (Vec3::Z, -1, pi_2 * 2.0),\n        // S層 (z = 0) - Fと同じ回転方向\n        Move::S =\u003e (Vec3::Z, 0, -pi_2),\n        Move::Sp =\u003e (Vec3::Z, 0, pi_2),\n        Move::S2 =\u003e (Vec3::Z, 0, pi_2 * 2.0),\n\n        // 全体 X\n        Move::X =\u003e (Vec3::X, 2, -pi_2),\n        Move::Xp =\u003e (Vec3::X, 2, pi_2),\n        Move::X2 =\u003e (Vec3::X, 2, pi_2 * 2.0),\n        // 全体 Y\n        Move::Y =\u003e (Vec3::Y, 2, -pi_2),\n        Move::Yp =\u003e (Vec3::Y, 2, pi_2),\n        Move::Y2 =\u003e (Vec3::Y, 2, pi_2 * 2.0),\n        // 全体 Z\n        Move::Z =\u003e (Vec3::Z, 2, -pi_2),\n        Move::Zp =\u003e (Vec3::Z, 2, pi_2),\n        Move::Z2 =\u003e (Vec3::Z, 2, pi_2 * 2.0),\n    }\n}\n\n/// ピースがある回転軸上の指定された層に含まれるか判定します。\nfn is_in_layer(pos: Vec3, axis: Vec3, layer_val: i8) -\u003e bool {\n    if axis == Vec3::X {\n        (pos.x.round() as i8) == layer_val\n    } else if axis == Vec3::Y {\n        (pos.y.round() as i8) == layer_val\n    } else if axis == Vec3::Z {\n        (pos.z.round() as i8) == layer_val\n    } else {\n        false\n    }\n}\n","traces":[{"line":5,"address":[],"length":0,"stats":{"Line":298022}},{"line":6,"address":[],"length":0,"stats":{"Line":1192088}},{"line":9,"address":[],"length":0,"stats":{"Line":531066}},{"line":10,"address":[],"length":0,"stats":{"Line":298022}},{"line":22,"address":[],"length":0,"stats":{"Line":8046594}},{"line":23,"address":[],"length":0,"stats":{"Line":35750210}},{"line":24,"address":[],"length":0,"stats":{"Line":11295186}},{"line":29,"address":[],"length":0,"stats":{"Line":596044}},{"line":33,"address":[],"length":0,"stats":{"Line":14}},{"line":35,"address":[],"length":0,"stats":{"Line":28}},{"line":36,"address":[],"length":0,"stats":{"Line":42}},{"line":38,"address":[],"length":0,"stats":{"Line":896}},{"line":41,"address":[],"length":0,"stats" olors(format!(\n                    \"{color:?}の数が{count}個です（{}個である必要があります）\",\n                    crate::cube::STICKERS_PER_FACE\n                )));\n            }\n        }\n    }\n\n    Ok(())\n}\n\n/// キューブの状態が有効かどうかを判定します。\npub fn is_valid_state(cube: \u0026Cube) -\u003e Result\u003c()\u003e {\n    // まず色数のチェック\n    let mut colors_array = [Color::White; crate::cube::NUM_STICKERS];\n    for (i, color) in colors_array.iter_mut().enumerate() {\n        *color = cube.stickers[i].color;\n    }\n    validate_colors(\u0026colors_array)?;\n\n    // コーナーのパリティと一貫性をチェック\n    check_corner_parity(cube)?;\n\n    // エッジのパリティと一貫性をチェック\n    check_edge_parity(cube)?;\n\n    // 置換パリティをチェック\n    check_total_permutation_parity(cube)?;\n\n    Ok(())\n}\n\npub const CORNER_STICKERS: [[usize; 3]; 8] = [\n    [8, 38, 27],  // UFR\n    [6, 20, 36],  // UFL\n    [0, 47, 18],  // ULB\n    [2, 29, 45],  // UBR\n    [11, 33, 44], // DFR\n    [9, 42, 26],  // DLF\n    [15, 24, 53], // DBL\n    [17, 51, 35], // DRB\n];\n\npub const EDGE_STICKERS: [[usize; 2]; 12] = [\n    [5, 28],  // UR\n    [7, 37],  // UF\n    [3, 19],  // UL\n    [1, 46],  // UB\n    [14, 34], // DR\n    [10, 43], // DF\n    [12, 25], // DL\n    [16, 52], // DB\n    [41, 30], // FR\n    [39, 23], // FL\n    [50, 21], // BL\n    [48, 32], // BR\n];\n\npub const CENTER_STICKERS: [usize; 6] = [4, 13, 22, 31, 40, 49];\n\n/// コーナーのパリティをチェックします。\npub fn check_corner_parity(cube: \u0026Cube) -\u003e Result\u003c()\u003e {\n    let rc = crate::kociemba::RawCube::from_cube(cube).map_err(CubeError::InvalidState)?;\n\n    // ユニーク性チェック\n    let mut corner_counts = [0u8; 8];\n    for \u0026c in \u0026rc.cp {\n        corner_counts[c as usize] += 1;\n    }\n    if corner_counts.iter().any(|\u0026count| count != 1) {\n        return Err(CubeError::InvalidState(\n            \"コーナーピースの重複または欠落があります\".to_string(),\n        ));\n    }\n\n    let total_twist: u8 = rc.co.iter().sum();\n    if !total_twist.is_multiple_of(3) {\n        return Err(CubeError::InvalidState(format!(\n            \"コーナーの向きパリティが不正です (合計捻れ: {})\",\n            total_twist\n        )));\n    }\n    Ok(())\n}\n\n/// エッジのパリティをチェックします。\npub fn check_edge_parity(cube: \u0026Cube) -\u003e Result\u003c()\u003e {\n    let rc = crate::kociemba::RawCube::from_cube(cube).map_err(CubeError::InvalidState)?;\n\n    // ユニーク性チェック\n    let mut edge_counts = [0u8; 12];\n    for \u0026e in \u0026rc.ep {\n        edge_counts[e as usize] += 1;\n    }\n    if edge_counts.iter().any(|\u0026count| count != 1) {\n        return Err(CubeError::InvalidState(\n            \"エッジピースの重複または欠落があります\".to_string(),\n        ));\n    }\n\n    let total_flip: u8 = rc.eo.iter().sum();\n    if !total_flip.is_multiple_of(2) {\n        return Err(CubeError::InvalidState(format!(\n            \"エッジの向きパリティが不正です (合計反転: {})\",\n            total_flip\n        )));\n    }\n    Ok(())\n}\n\n/// 置換パリティのチェック。\npub fn check_total_permutation_parity(cube: \u0026Cube) -\u003e Result\u003c()\u003e {\n    use crate::kociemba::RawCube;\n    let rc = RawCube::from_cube(cube).map_err(CubeError::InvalidState)?;\n\n    fn get_permutation_parity(p: \u0026[usize]) -\u003e usize {\n        let mut visited = vec![false; p.len()];\n        let mut total_swaps = 0;\n        for i in 0..p.len() {\n            if !visited[i] {\n                let mut curr = i;\n                let mut cycle_len = 0;\n                while !visited[curr] {\n                    visited[curr] = true;\n                    curr = p[curr];\n                    cycle_len += 1;\n                }\n                if cycle_len \u003e 1 {\n                    total_swaps += cycle_len - 1;\n                }\n            }\n        }\n        total_swaps % 2\n    }\n\n    let cp_p: Vec\u003cusize\u003e = rc.cp.iter().map(|\u0026c| c as usize).collect();\n    let ep_p: Vec\u003cusize\u003e = rc.ep.iter().map(|\u0026e| e as usize).collect();\n\n    // 置換パリティを計算する前に、既にユニーク性チェックが通っている前提\n    // (重複があると permutation として成立しない)\n\n    let cp_parity = get_permutation_parity(\u0026cp_p);\n    let ep_parity = get_permutation_parity(\u0026ep_p);\n\n    if !(cp_parity + ep_parity).is_multiple_of(2) {\n        return Err(CubeError::InvalidState(\n            \"置換パリティが不正です。コーナーとエッジの配置が物理的に不可能です。\".to_string(),\n        ));\n    }\n\n    Ok(())\n}\n","traces":[{"line":7,"address":[],"length":0,"stats":{"Line":124}},{"line":8,"address":[],"length":0,"stats":{"Line":248}},{"line":9,"address":[],"length":0,"stats":{"Line":6820}},{"line":10,"address":[],"length":0,"stats":{"Line":13392}},{"line":11,"address":[],"length":0,"stats":{"Line":13392}},{"line":12,"address":[],"length":0,"stats":{"Line":6696}},{"line":17,"address":[],"length":0,"stats":{"Line":248}},{"line":18,"address":[],"length":0,"stats":{"Line":248}},{"line":19,"address":[],"length":0,"stats":{"Line":248}},{"line":20,"address":[],"length":0,"stats":{"Line":248}},{"line":21,"address":[],"length":0,"stats":{"Line":248}},{"line":22,"address":[],"length":0,"stats":{"Line":124}},{"line":23,"address":[],"length":0,"stats":{"Line":124}},{"line":26,"address":[],"length":0,"stats":{"Line":818}},{"line":27,"address":[],"length":0,"stats":{"Line":1388}},{"line":28,"address":[],"length":0,"stats":{"Line":694}},{"line":29,"address":[],"length":0,"stats":{"Line":10}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":10}},{"line":33,"address":[],"length":0,"stats":{"Line":10}},{"line":34,"address":[],"length":0,"stats":{"Line":10}},{"line":40,"address":[],"length":0,"stats":{"Line":114}},{"line":44,"address":[],"length":0,"stats":{"Line":88}},{"line":46,"address":[],"length":0,"stats":{"Line":176}},{"line":47,"address":[],"length":0,"stats":{"Line":14520}},{"line":48,"address":[],"length":0,"stats":{"Line":4752}},{"line":50,"address":[],"length":0,"stats":{"Line":180}},{"line":53,"address":[],"length":0,"stats":{"Line":170}},{"line":56,"address":[],"length":0,"stats":{"Line":166}},{"line":59,"
