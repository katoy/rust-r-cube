\npub mod fix;\npub use fix::{\n    apply_rot_to_face, apply_supercube_fixes, get_buffer_face, get_setup_to_up, is_opposite_face,\n};\n\npub struct SolverState {\n    pub raw_cube: Result\u003cRawCube, String\u003e,\n    pub initial_cube: Cube,\n    pub max_depth: usize,\n    pub ignore_orientation: bool,\n    pub solution: Option\u003cSolution\u003e,\n    pub finished: bool,\n}\n\nstatic SOLVED_ORIS: OnceLock\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e = OnceLock::new();\nstatic SOLVED_STATES: OnceLock\u003cVec\u003cCube\u003e\u003e = OnceLock::new();\n\npub fn get_solved_oris() -\u003e \u0026'static [Vec\u003cu8\u003e] {\n    SOLVED_ORIS.get_or_init(generate_all_solved_oris)\n}\n\npub fn get_solved_states() -\u003e \u0026'static [Cube] {\n    SOLVED_STATES.get_or_init(generate_all_solved_states)\n}\n\nfn generate_all_solved_states() -\u003e Vec\u003cCube\u003e {\n    use rustc_hash::FxHashSet;\n    use std::collections::VecDeque;\n\n    let base = Cube::new();\n    let mut states = Vec::new();\n    let mut queue = VecDeque::new();\n    let mut visited: FxHashSet\u003cCube\u003e = FxHashSet::default();\n\n    queue.push_back(base.clone());\n    visited.insert(base.clone());\n    states.push(base);\n\n    let basic_rotations = [Move::X, Move::Y, Move::Z];\n\n    while let Some(current) = queue.pop_front() {\n        for \u0026rot in \u0026basic_rotations {\n            let mut next: Cube = current.clone();\n            next.apply_move(rot);\n            if visited.insert(next.clone()) {\n                states.push(next.clone());\n                queue.push_back(next);\n            }\n        }\n    }\n    states\n}\n\nfn generate_all_solved_oris() -\u003e Vec\u003cVec\u003cu8\u003e\u003e {\n    let states = get_solved_states();\n    states.iter().map(get_orientations_vec).collect()\n}\n\npub fn is_fully_solved(cube: \u0026Cube) -\u003e bool {\n    if !cube.is_solved() {\n        return false;\n    }\n\n    let current_oris = get_orientations_vec(cube);\n    let solved_oris = get_solved_oris();\n    let mut matched_pattern = None;\n    for (i, target) in solved_oris.iter().enumerate() {\n        if current_oris == *target {\n            matched_pattern = Some(i);\n            break;\n        }\n    }\n\n    if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n        if let Some(pattern_idx) = matched_pattern {\n            println!(\n                \"DEBUG: is_fully_solved: MATCHED orientation pattern {}! RelativeOris={:?}\",\n                pattern_idx, current_oris\n            );\n        } else {\n            println!(\n                \"DEBUG: is_fully_solved: Color=Solved, RelativeOris={:?}\",\n                current_oris\n            );\n            // 全パターンを詳細比較\n            for (i, target) in solved_oris.iter().enumerate() {\n                if i % 8 == 0 {\n                    print!(\"  \");\n                }\n                print!(\"P{}:{} \", i, current_oris == *target);\n                if i % 8 == 7 {\n                    println!();\n                }\n            }\n        }\n    }\n\n    matched_pattern.is_some()\n}\n\npub fn is_orientation_solvable(cube: \u0026Cube) -\u003e bool {\n    if !cube.is_solved() {\n        return false;\n    }\n    let oris = get_orientations_vec(cube);\n    let total_ori: u32 = oris.iter().map(|\u0026o| o as u32).sum();\n    total_ori.is_multiple_of(2)\n}\n\npub fn solve_with_progress(\n    start_cube: \u0026Cube,\n    max_depth: usize,\n    ignore_orientation: bool,\n    progress_tx: Option\u003cstd::sync::mpsc::Sender\u003cf32\u003e\u003e,\n) -\u003e Solution {\n    solve_internal(start_cube, max_depth, ignore_orientation, progress_tx)\n}\n\npub fn solve(start_cube: \u0026Cube, max_depth: usize, ignore_orientation: bool) -\u003e Solution {\n    // 物理的妥当性チェック\n    if let Err(e) = start_cube.is_valid_state() {\n        return Solution {\n            moves: vec![],\n            found: false,\n            message: format!(\"無効なキューブ状態: {}\", e),\n        };\n    }\n\n    solve_internal(start_cube, max_depth, ignore_orientation, None)\n}\n\n/// プログレス報告を抽象化するヘルパー\nstruct ProgressReporter {\n    tx: Option\u003cstd::sync::Mutex\u003cstd::sync::mpsc::Sender\u003cf32\u003e\u003e\u003e,\n}\n\nimpl ProgressReporter {\n    fn new(tx: Option\u003cstd::sync::mpsc::Sender\u003cf32\u003e\u003e) -\u003e Self {\n        Self {\n            tx: tx.map(std::sync::Mutex::new),\n        }\n    }\n\n    fn report(\u0026self, progress: f32) {\n        if let Some(ref tx_mutex) = self.tx {\n            if let Ok(tx) = tx_mutex.lock() {\n                let _ = tx.send(progress);\n            }\n        }\n    }\n}\n\npub enum TrySolveResult {\n    Perfect(Solution),\n    ColorOnly(Solution),\n}\n\n/// setup_moves と rotation を適用してソルバーを実行し、解の検証と向き修正を行う\npub fn try_solve_with_rotation(\n    start_cube: \u0026Cube,\n    setup_moves: \u0026[Move],\n    rotation: \u0026[Move],\n    max_depth: usize,\n    ignore_orientation: bool,\n    search: \u0026mut Search,\n) -\u003e Option\u003cTrySolveResult\u003e {\n    // setup_moves + rotation を適用したキューブを作成\n    let mut test_cube = start_cube.clone();\n    for \u0026m in setup_moves {\n        test_cube.apply_move(m);\n    }\n    for \u0026m in rotation {\n        test_cube.apply_move(m);\n    }\n\n    // RawCube に変換\n    let rc = RawCube::from_cube(\u0026test_cube).ok()?;\n\n    // 必要な手数を計算\n    let needed = setup_moves.len() + rotation.len();\n    if needed \u003e= max_depth {\n        return None;\n    }\n\n    // Kociemba ソルバーで解を探索\n    let m_fix = search.solve(\u0026rc, max_depth.saturating_sub(needed))?;\n\n    // 全ての手順を結合\n    let mut moves = Vec::new();\n    moves.extend_from_slice(setup_moves);\n    moves.extend_from_slice(rotation);\n    moves.extend(m_fix);\n\n    // 解を適用して検証\n    let mut check_cube = start_cube.clone();\n    for \u0026m in \u0026moves {\n        check_cube.apply_move(m);\n    }\n\n    // 完全に解けている場合 (方位も含めて)\n    if is_fully_solved(\u0026check_cube) \u0026\u0026 moves.len() \u003c= max_depth {\n        return Some(TrySolveResult::Perfect(Solution {\n            moves: moves.clone(),\n            found: true,\n            message: \"方位も含めて完全に解決しました。\".to_string(),\n        }));\n    }\n\n    // 向きを無視する場合に限り、色が揃っていれば即座に返す\n    if ignore_orientation \u0026\u0026 check_cube.is_solved() \u0026\u0026 moves.len() \u003c= max_depth {\n        return Some(TrySolveResult::Perfect(Solution {\n            moves: moves.clone(),\n            found: true,\n            message: \"色の揃った解（向きは無視）を見つけました。\".to_string(),\n        }));\n    }\n\n    // 色が揃っている場合、向き修正を試みる\n    if check_cube.is_solved() {\n        if !is_orientation_solvable(\u0026check_cube) {\n            let oris = get_orientations_vec(\u0026check_cube);\n            let sum: u32 = oris.iter().map(|\u0026o| o as u32).sum();\n            if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n                println!(\"DEBUG: try_solve_with_rotation: Odd parity detected (sum={}). Physically impossible.\", sum);\n            }\n            return Some(TrySolveResult::ColorOnly(Solution {\n                moves: moves.clone(),\n                found: ignore_orientation, // 向きを無視する場合のみ \"成功\" とみなす\n                message: if ignore_orientation {\n                    format!(\"色は解決しましたが、方位パリティが異常(sum={})なため、方位の解決は不可能です。\", sum)\n                } else {\n                    format!(\"方位パリティが異常(sum={})なため、解決できません。物理的に不可能な状態です。\", sum)\n                },\n            }));\n        }\n\n        if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n            println!(\n                \"DEBUG: try_solve_with_rotation: color solved. oris={:?}\",\n                get_orientations_vec(\u0026check_cube)\n            );\n        }\n        let fixes = apply_supercube_fixes(\u0026check_cube, search);\n        if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n            println!(\n                \"DEBUG: try_solve_with_rotation: apply_supercube_fixes returned {} moves.\",\n                fixes.len()\n            );\n        }\n        let mut final_moves = moves.clone();\n        final_moves.extend(fixes.clone());\n\n        let mut final_cube = check_cube.clone();\n        for \u0026m in \u0026fixes {\n            final_cube.apply_move(m);\n        }\n\n        if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n            println!(\n                \"DEBUG: try_solve_with_rotation: after fixes, oris={:?}, is_solved={}\",\n                get_orientations_vec(\u0026final_cube),\n                final_cube.is_solved()\n            );\n        }\n\n        if is_fully_solved(\u0026final_cube) {\n            if final_moves.len() \u003c= max_depth {\n                return Some(TrySolveResult::Perfect(Solution {\n                    moves: final_moves,\n                    found: true,\n                    message: \"色解決後にセンターの向きを修正しました。\".to_string(),\n                }));\n            } else {\n                return Some(TrySolveResult::ColorOnly(Solution {\n                    moves: final_moves,\n                    found: ignore_orientation,\n                    message: \"色は揃いましたが、向きの修正を含めると探索深度を超えます。\"\n                        .to_string(),\n                }));\n            }\n        }\n    }\n    // (color_only_solution は色が揃っているが向きが揃っていない状態を保存するために使用される)\n    // また、色が揃っているが向きが揃わない状態（パリティエラー）も、ignore_orientation=false の場合は\n    // color_only_solution には保存しない。\n\n    None\n}\n\nfn solve_internal(\n    start_cube: \u0026Cube,\n    max_depth: usize,\n    ignore_orientation: bool,\n    progress_tx: Option\u003cstd::sync::mpsc::Sender\u003cf32\u003e\u003e,\n) -\u003e Solution {\n    let progress = ProgressReporter::new(progress_tx);\n    progress.report(0.0);\n\n    if is_fully_solved(start_cube) {\n        progress.report(1.0);\n        return Solution {\n            moves: vec![],\n            found: true,\n            message: \"既に完全に解決されています。\".to_string(),\n        };\n    }\n    // 向きを無視する場合に限り、色が揃っていれば即座に返す\n    if ignore_orientation \u0026\u0026 start_cube.is_solved() {\n        progress.report(1.0);\n        return Solution {\n            moves: vec![],\n            found: true,\n            message: \"既に色が揃っています（向きは無視）。\".to_string(),\n        };\n    }\n\n    let mut color_only_solution: Option\u003cSolution\u003e = None;\n\n    // 1. 直近方位試行（探索を伴わない純粋な回転と方位修正）\n    if let Some(res) = attempt_direct_solve(start_cube, max_depth, ignore_orientation) {\n        match res {\n            TrySolveResult::Perfect(sol) =\u003e {\n                progress.report(1.0);\n                return sol;\n            }\n            TrySolveResult::ColorOnly(sol) =\u003e {\n                color_only_solution = Some(sol);\n            }\n        }\n    }\n\n    // ignore_orientation が true の場合、色が揃った解があればそれを優先\n    if ignore_orientation {\n        if let Some(sol) = color_only_solution.clone() {\n            progress.report(1.0);\n            return sol;\n        }\n    }\n\n    // 2. 探索的解決 (ランダムなセットアップを用いた探索)\n    if let Some(sol) = attempt_search(\n        start_cube,\n        max_depth,\n        ignore_orientation,\n        \u0026progress,\n        color_only_solution.clone(),\n    ) {\n        progress.report(1.0);\n        return sol;\n    }\n\n    // 解決不能な原因の特定とエラーメッセージの返却\n    fail_solution(start_cube, \u0026progress)\n}\n\nfn attempt_direct_solve(\n    cube: \u0026Cube,\n    max_depth: usize,\n    ignore_orientation: bool,\n) -\u003e Option\u003cTrySolveResult\u003e {\n    let mut search = Search::new();\n\n    // 色が既に揃っている場合\n    if cube.is_solved() {\n        if let Some(res) = try_solve_with_rotation(cube, \u0026[], \u0026[], max_depth, false, \u0026mut search) {\n            return Some(res);\n        }\n    }\n\n    // 24通りの回転を試行\n    let rotations = get_all_rotations();\n    for rot in \u0026rotations {\n        if let Some(res) =\n            try_solve_with_rotation(cube, \u0026[], rot, max_depth, ignore_orientation, \u0026mut search)\n        {\n            if let TrySolveResult::Perfect(_) = res {\n                return Some(res);\n            }\n            // ColorOnly の場合は後で使うために保持するが、ループは続行して Perfect を探す\n            // (呼び出し元で最初の ColorOnly をキャプチャする)\n        }\n    }\n\n    // 最初に見つかった ColorOnly を返すための再ループ (効率のため改善の余地ありだが分解を優先)\n    for rot in \u0026rotations {\n        if let Some(res) =\n            try_solve_with_rotation(cube, \u0026[], rot, max_depth, ignore_orientation, \u0026mut search)\n        {\n            return Some(res);\n        }\n    }\n\n    None\n}\n\nfn attempt_search(\n    start_cube: \u0026Cube,\n    max_depth: usize,\n    ignore_orientation: bool,\n    progress: \u0026ProgressReporter,\n    mut color_only_solution: Option\u003cSolution\u003e,\n) -\u003e Option\u003cSolution\u003e {\n    let mut _search = Search::new();\n    let rotations = get_all_rotations();\n    let all_moves = Move::all_moves();\n    use crate::kociemba::DEFAULT_MAX_NODES;\n\n    #[cfg(not(target_arch = \"wasm32\"))]\n    {\n        use rayon::prelude::*;\n        use std::sync::Mutex;\n\n        let color_only_mutex = Mutex::new(color_only_solution);\n\n        let perfect_sol = (0..RANDOM_TRIALS)\n            .into_par_iter()\n            .find_map_any(|trial_iter| {\n                let mut local_search = Search::new();\n                if trial_iter \u003e 100 {\n                    local_search.max_nodes = DEFAULT_MAX_NODES * 5;\n                }\n                if trial_iter \u003e 500 {\n                    local_search.max_nodes = DEFAULT_MAX_NODES * 10;\n                }\n                if trial_iter \u003e 1000 {\n                    local_search.max_nodes = DEFAULT_MAX_NODES * 25;\n                }\n\n                let mut local_seed = RANDOM_SEED.wrapping_add(trial_iter * 12345);\n                let next_rn_local = |s: \u0026mut usize| -\u003e usize {\n                    *s = s.wrapping_mul(LCG_MULTIPLIER).wrapping_add(LCG_INCREMENT);\n                    (*s / 65536) % 32768\n                };\n\n                let n_random = (next_rn_local(\u0026mut local_seed) % MAX_SETUP_MOVES) + 1;\n                let mut setup_moves = vec![];\n                for _ in 0..n_random {\n                    let m = all_moves[next_rn_local(\u0026mut local_seed) % TOTAL_BASIC_MOVES];\n                    setup_moves.push(m);\n                }\n                let rot = \u0026rotations[next_rn_local(\u0026mut local_seed) % TOTAL_ROTATIONS];\n\n                if let Some(res) = try_solve_with_rotation(\n                    start_cube,\n                    \u0026setup_moves,\n                    rot,\n                    max_depth,\n                    ignore_orientation,\n                    \u0026mut local_search,\n                ) {\n                    match res {\n                        TrySolveResult::Perfect(sol) =\u003e return Some(sol),\n                        TrySolveResult::ColorOnly(sol) =\u003e {\n                            let mut guard = color_only_mutex.lock().unwrap();\n                            if guard.is_none() {\n                                *guard = Some(sol);\n                            }\n                        }\n                    }\n                }\n                if trial_iter % 100 == 0 {\n                    progress.report(trial_iter as f32 / RANDOM_TRIALS as f32 * PROGRESS_WEIGHT);\n                }\n                None\n            });\n\n        if let Some(sol) = perfect_sol {\n            return Some(sol);\n        }\n        color_only_solution = color_only_mutex.into_inner().unwrap();\n    }\n\n    #[cfg(target_arch = \"wasm32\")]\n    {\n        let mut seed: usize = RANDOM_SEED;\n        let next_rn = |s: \u0026mut usize| -\u003e usize {\n            *s = s.wrapping_mul(LCG_MULTIPLIER).wrapping_add(LCG_INCREMENT);\n            (*s / 65536) % 32768\n        };\n\n        for trial_iter in 0..RANDOM_TRIALS {\n            if trial_iter \u003e 100 {\n                _search.max_nodes = DEFAULT_MAX_NODES * 5;\n            }\n            if trial_iter \u003e 500 {\n                _search.max_nodes = DEFAULT_MAX_NODES * 10;\n            }\n            if trial_iter \u003e 1000 {\n                _search.max_nodes = DEFAULT_MAX_NODES * 25;\n            }\n\n            progress.report(trial_iter as f32 / RANDOM_TRIALS as f32 * PROGRESS_WEIGHT);\n            let n_random = (next_rn(\u0026mut seed) % MAX_SETUP_MOVES) + 1;\n            let mut setup_moves = vec![];\n            for _ in 0..n_random {\n                let m = all_moves[next_rn(\u0026mut seed) % TOTAL_BASIC_MOVES];\n                setup_moves.push(m);\n            }\n            let rot = \u0026rotations[next_rn(\u0026mut seed) % TOTAL_ROTATIONS];\n\n            if let Some(res) = try_solve_with_rotation(\n                start_cube,\n                \u0026setup_moves,\n                rot,\n                max_depth,\n                ignore_orientation,\n                \u0026mut _search,\n            ) {\n                match res {\n                    TrySolveResult::Perfect(sol) =\u003e return Some(sol),\n                    TrySolveResult::ColorOnly(sol) =\u003e {\n                        if color_only_solution.is_none() {\n                            color_only_solution = Some(sol);\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    if let Some(sol) = color_only_solution {\n        return Some(sol);\n    }\n    None\n}\n\nfn fail_solution(start_cube: \u0026Cube, progress: \u0026ProgressReporter) -\u003e Solution {\n    if std::env::var(\"SOLVER_DEBUG\").is_ok() {\n        println!(\"DEBUG: solve_internal: no solution found.\");\n    }\n    progress.report(1.0);\n    let mut msg = \"解が見つかりませんでした。\".to_string();\n    if !is_orientation_solvable(start_cube) {\n        let oris = get_orientations_vec(start_cube);\n        let sum: u32 = oris.iter().map(|\u0026o| o as u32).sum();\n        msg += \u0026format!(\n            \"方位パリティが異常(sum={})なため、現在の色配置のままでは解決不可能です。\",\n            sum\n        );\n    } else {\n        msg += \"物理的に不可能な状態か、探索深度（最大128手）を超えている可能性があります。\";\n    }\n\n    Solution {\n        moves: vec![],\n        found: false,\n        message: msg,\n    }\n}\n\npub fn get_orientations_vec(cube: \u0026Cube) -\u003e Vec\u003cu8\u003e {\n    Face::all()\n        .iter()\n        .map(|\u0026f: \u0026Face| cube.stickers[f.start_index() + 4].orientation)\n        .collect()\n}\n\npub fn undo_setup(mut setup: Vec\u003cMove\u003e) -\u003e Vec\u003cMove\u003e {\n    for m in \u0026mut setup {\n        *m = m.inverse();\n    }\n    setup.reverse();\n    setup\n}\n\npub fn get_all_rotations() -\u003e Vec\u003cVec\u003cMove\u003e\u003e {\n    vec![\n        vec![],\n        vec![Move::X],\n        vec![Move::X2],\n        vec![Move::Xp],\n        vec![Move::Y],\n        vec![Move::Y2],\n        vec![Move::Yp],\n        vec![Move::Z],\n        vec![Move::Z2],\n        vec![Move::Zp],\n        vec![Move::X, Move::Y],\n        vec![Move::X, Move::Y2],\n        vec![Move::X, Move::Yp],\n        vec![Move::X, Move::Z],\n        vec![Move::X, Move::Z2],\n        vec![Move::X, Move::Zp],\n        vec![Move::Xp, Move::Y],\n        vec![Move::Xp, Move::Y2],\n        vec![Move::Xp, Move::Yp],\n        vec![Move::Xp, Move::Z],\n        vec![Move::Xp, Move::Z2],\n        vec![Move::Xp, Move::Zp],\n        vec![Move::X2, Move::Y],\n        vec![Move::X2, Move::Z],\n    ]\n}\n\n// Functions moved to fix.rs:\n// get_target_oris\n// apply_supercube_fixes\n// is_opposite_face\n// get_buffer_face\n// get_fix_180\n// get_fix_90_pair\n// get_setup_to_up\n// get_setup_to_up_right\n// apply_rot_to_face\n// move_to_geometric_params_for_rot\n\nimpl SolverState {\n    pub fn new(start_cube: \u0026Cube, max_depth: usize, ignore_orientation: bool) -\u003e Self {\n        let rc = RawCube::from_cube(start_cube);\n        Self {\n            raw_cube: rc,\n            initial_cube: start_cube.clone(),\n            max_depth,\n            ignore_orientation,\n            solution: None,\n            finished: false,\n        }\n    }\n    pub fn error(\u0026self) -\u003e Option\u003cString\u003e {\n        match \u0026self.raw_cube {\n            Ok(_) =\u003e None,\n            Err(e) =\u003e Some(e.clone()),\n        }\n    }\n    pub fn process_chunk(\u0026mut self, _: usize) -\u003e (usize, bool) {\n        if self.finished {\n            return (0, true);\n        }\n        let result = solve_internal(\n            \u0026self.initial_cube,\n            self.max_depth,\n            self.ignore_orientation,\n            None,\n        );\n        self.solution = Some(result);\n        self.finished = true;\n        (1, true)\n    }\n    pub fn get_solution(\u0026self) -\u003e Option\u003cSolution\u003e {\n        self.solution.clone()\n    }\n    pub fn estimate_progress(\u0026self) -\u003e f32 {\n        if self.finished {\n            1.0\n        } else {\n            0.5\n        }\n    }\n}\n","traces":[{"line":41,"address":[],"length":0,"stats":{"Line":9028}},{"line":42,"address":[],"length":0,"stats":{"Line":9028}},{"line":45,"address":[],"length":0,"stats":{"Line":1514}},{"line":46,"address":[],"length":0,"stats":{"Line":1514}},{"line":49,"address":[],"length":0,"stats":{"Line":14}},{"line":53,"address":[],"length":0,"stats":{"Line":28}},{"line":54,"address":[],"length":0,"stats":{"Line":28}},{"line":55,"address":[],"length":0,"stats":{"Line":28}},{"line":56,"address":[],"length":0,"stats":{"Line":42}},{"line":58,"address":[],"length":0,"stats":{"Line":56}},{"line":59,"address":[],"length":0,"stats":{"Line":56}},{"line":60,"address":[],"length":0,"stats":{"Line":42}},{"line":62,"address":[],"length":0,"stats":{"Line":42}},{"line":64,"address":[],"length":0,"stats":{"Line":686}},{"line":65,"address":[],"length":0,"stats":{"Line":1344}},{"line":66,"address":[],"length":0,"stats":{"Line":4032}},{"line":67,"address":[],"length":0,"stats":{"Line":3024}},{"line":68,"address":[],"length":0,"stats":{"Line":4354}},{"line":69,"address":[],"length":0,"stats":{"Line":1610}},{"line":70,"address":[],"length":0,"stats":{ .best_solve_time = Some(solve_time);\n        }\n    }\n\n    /// 解法失敗時に統計を更新\n    pub fn record_solve_failure(\u0026mut self) {\n        self.total_solves += 1;\n    }\n\n    /// 手動操作を記録\n    pub fn record_manual_move(\u0026mut self) {\n        self.total_manual_moves += 1;\n    }\n\n    /// 平均解法時間を計算\n    #[must_use]\n    pub fn avg_solve_time(\u0026self) -\u003e Option\u003cDuration\u003e {\n        if self.successful_solves \u003e 0 {\n            // successful_solvesは実用上数百程度なu32へのキャストは安全\n            #[allow(clippy::cast_possible_truncation)]\n            let count_u32 = self.successful_solves as u32;\n            Some(self.total_solve_time / count_u32)\n        } else {\n            None\n        }\n    }\n\n    /// 成功率を計算（0.0 ~ 1.0）\n    #[must_use]\n    pub fn success_rate(\u0026self) -\u003e f64 {\n        if self.total_solves \u003e 0 {\n            // 統計値は実用上f64の52bit精度で十分\n            #[allow(clippy::cast_precision_loss)]\n            {\n                self.successful_solves as f64 / self.total_solves as f64\n            }\n        } else {\n            0.0\n        }\n    }\n\n    /// セッション時間を取得\n    #[must_use]\n    pub fn session_duration(\u0026self) -\u003e Duration {\n        self.session_start.elapsed()\n    }\n}\n","traces":[{"line":28,"address":[],"length":0,"stats":{"Line":16}},{"line":35,"address":[],"length":0,"stats":{"Line":16}},{"line":43,"address":[],"length":0,"stats":{"Line":16}},{"line":44,"address":[],"length":0,"stats":{"Line":16}},{"line":48,"address":[],"length":0,"stats":{"Line":12}},{"line":49,"address":[],"length":0,"stats":{"Line":12}},{"line":50,"address":[],"length":0,"stats":{"Line":12}},{"line":51,"address":[],"length":0,"stats":{"Line":12}},{"line":53,"address":[],"length":0,"stats":{"Line":18}},{"line":54,"address":[],"length":0,"stats":{"Line":8}},{"line":55,"address":[],"length":0,"stats":{"Line":2}},{"line":58,"address":[],"length":0,"stats":{"Line":6}},{"line":63,"address":[],"length":0,"stats":{"Line":4}},{"line":64, = solver::solve(black_box(\u0026cube), 11, false);\n            assert!(result.found);\n        });\n    });\n}\n\n/// 向きを無視したソルバーのベンチマーク\nfn benchmark_solver_ignore_orientation(c: \u0026mut Criterion) {\n    c.bench_function(\"solver_ignore_orientation\", |b| {\n        b.iter(|| {\n            let mut cube = Cube::new();\n            cube.scramble(5);\n            let result = solver::solve(black_box(\u0026cube), 11, true);\n            assert!(result.found);\n        });\n    });\n}\n\n/// 基本的なキューブ操作のベンチマーク\nfn benchmark_cube_operations(c: \u0026mut Criterion) {\n    c.bench_function(\"cube_apply_move\", |b| {\n        let mut cube = Cube::new();\n        b.iter(|| {\n            cube.apply_move(black_box(Move::R));\n        });\n    });\n\n    c.bench_function(\"cube_scramble_100\", |b| {\n        b.iter(|| {\n            let mut cube = Cube::new();\n            cube.scramble(black_box(100));\n        });\n    });\n\n    c.bench_function(\"cube_clone\", |b| {\n        let cube = Cube::new();\n        b.iter(|| {\n            black_box(cube.clone());\n        });\n    });\n}\n\n/// ハッシュ計算のベンチマーク\nfn benchmark_cube_hash(c: \u0026mut Criterion) {\n    use std::collections::hash_map::DefaultHasher;\n    use std::hash::{Hash, Hasher};\n\n    c.bench_function(\"cube_hash\", |b| {\n        let cube = Cube::new();\n        b.iter(|| {\n            let mut hasher = DefaultHasher::new();\n            black_box(\u0026cube).hash(\u0026mut hasher);\n            hasher.finish()\n        });\n    });\n}\n\n/// 正規化処理のベンチマーク\nfn benchmark_cube_normalization(c: \u0026mut Criterion) {\n    c.bench_function(\"cube_normalized\", |b| {\n        let cube = Cube::new();\n        b.iter(|| {\n            let _ = black_box(\u0026cube).normalized();\n        });\n    });\n\n    c.bench_function(\"cube_with_clockwise_orientations\", |b| {\n        let cube = Cube::new();\n        b.iter(|| {\n            let _ = black_box(\u0026cube).with_clockwise_orientations();\n        });\n    });\n}\ ;\n        }\n\n        // check if it matches target\n        let mut matches = true;\n        for face in Face::all() {\n            for idx in 0..9 {\n                if cube.get_sticker(face.start_index() + idx).color\n                    != target_cube.get_sticker(face.start_index() + idx).color\n                {\n                    matches = false;\n                    break;\n                }\n            }\n            if !matches {\n                break;\n            }\n        }\n\n        if matches {\n            println!(\"MATCH FOUND at rotation index {}!\", i);\n            println!(\"Rotation moves: {:?}\", rot);\n\n            // Now we have the generator. The solution is the inverse.\n            return;\n        }\n    }\n\n    println!(\"No match found. Trying with (Mp Up)*4...\");\n    for (i, rot) in rotations.iter().enumerate() {\n        let mut cube = Cube::new();\n        for \u0026m in rot {\n            cube.apply_move(m);\n        }\n        for _ in 0..3 {\n            for _ in 0..4 {\n                cube.apply_move(Move::Mp);\n                cube.apply_move(Move::Up);\n            }\n            cube.apply_move(Move::X);\n            cube.apply_move(Move::Yp);\n        }\n        let mut matches = true;\n        for face in Face::all() {\n            for idx in 0..9 {\n                if cube.get_sticker(face.start_index() + idx).color\n                    != target_cube.get_sticker(face.start_index() + idx).color\n                {\n                    matches = false;\n                    break;\n                }\n            }\n            if !matches {\n                break;\n            }\n        }\n        if matches {\n            println!(\"MATCH FOUND (variant 2) at rotation index {}!\", i);\n            return;\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_color_preservation.rs"],"content":"use rubiks_cube_3x          check_corners(\u0026c_rand);\n                return;\n            }\n        }\n    }\n    println!(\"✅ ランダムテスト 100回 クリア\");\n}\n\nfn get_corners() -\u003e Vec\u003c(\u0026'static str, Vec\u003cusize\u003e)\u003e {\n    vec![\n        (\"ULF\", vec![2, 9, 16]),  // Up-Left-Front\n        (\"URF\", vec![3, 12, 17]), // Up-Right-Front\n        (\"ULB\", vec![0, 8, 21]),  // Up-Left-Back\n        (\"URB\", vec![1, 13, 20]), // Up-Right-Back\n        (\"DLF\", vec![4, 11, 18]), // Down-Left-Front\n        (\"DRF\", vec![5, 14, 19]), // Down-Right-Front\n        (\"DLB\", vec![6, 10, 23]), // Down-Left-Back\n        (\"DRB\", vec![7, 15, 22]), // Down-Right-Back\n    ]\n}\n\nfn check_corners(cube: \u0026Cube) {\n    let corners = get_corners();\n    for (name, indices) in corners {\n        let colors: Vec\u003cString\u003e = indices\n            .iter()\n            .map(|\u0026i| format!(\"{:?}\", cube.get_sticker(i).color))\n            .collect();\n        let unique: HashSet\u003c\u0026String\u003e = colors.iter().collect();\n\n        if unique.len() != 3 {\n            println!(\n                \"❌ {}: 異なる色が{}個しかありません {:?} (indices: {:?})\",\n                name,\n                unique.len(),\n                colors,\n                indices\n            );\n        } else {\n            // println!(\"✅ {}: OK {:?}\", name, colors);\n        }\n    }\n}\n\nfn check_corners_silent(cube: \u0026Cube) -\u003e bool {\n    let corners = get_corners();\n    for (_, indices) in corners {\n        let colors: HashSet\u003cString\u003e = indices\n            .iter()\n            .map(|\u0026i| format!(\"{:?}\", cube.get_sticker(i).color))\n            .collect();\n        if colors.len() != 3 {\n            return false;\n        }\n    }\n    true\n}\n\nfn check_color_distribution(cube: \u0026Cube) {\n    use std::collections::HashMap;\n    let mut count = HashMap::new();\n    for i in 0..24 {\n        let c = format!(\"{:?}\", cube.get_sticker(i).color);\n        *count.entry(c).or_insert(0) += 1;\n    }\n    println!(\"色の分布: {:?}\", count);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_dist_god.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::kociemba::{RawCube, Search};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    let rc = RawCube::from_cube(\u0026cube).expect(\"Failed to convert to RawCube\");\n\n    println!(\"Checking distance for cube_god.txt using pruning tables...\");\n\n    let twist = rc.get_twist();\n    let flip = rc.get_flip();\n    let slice = rc.get_ud_slice();\n\n    // We need to access Search to use its pruning table logic, but Search::new() is private?\n    // No, it's public.\n    Search::new();\n\n    // Search has pruning tables. Let's see if we can get the distance.\n    // The pruning tables are MoveTable and PruningTable.\n    // In search.rs:\n    // let d1 = self.pruning_table.twist_slice[twist as usize * 495 + slice as usize];\n    // let d2 = self.pruning_table.flip_slice[flip as usize * 495 + slice as usize];\n    // distance = d1.max(d2)\n\n    // However, PruningTable is not public in kociemba::tables.\n    // But Search::solve calls it.\n\n    println!(\"Twist: {}, Flip: {}, Slice: {}\", twist, flip, slice);\n\n    // Since I can't access PruningTable directly easily without modifying the library,\n    // I will try to solve it with depth 1, 2, 3... and see if it hits pruning.\n\n    println!(\"Attempting to solve with Kociemba solver...\");\n    let mut search = Search::new();\n    let sol = search.solve(\u0026rc, 24);\n\n    if let Some(s) = sol {\n        println!(\"Solution found! Length: {}\", s.len());\n        println!(\"Moves: {:?}\", s);\n    } else {\n        println!(\"Solution NOT found within Node Limit.\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_orientation.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\n\nfn main() {\n    // 初期状態（時計回りパターン）\n    let base = Cube::new();\n    println!(\"Base cube (Cube::new()):\");\n    for i in 0..24 {\n        let s = base.get_sticker(i);\n        print!(\"idx{}: o{}, \", i, s.orientation);\n        if (i + 1) % 4 == 0 {\n            println!();\n        }\n    }\n    println!();\n\n    // Y軸回転（U D'）を適用\n    let mut rotated = base.clone();\n    rotated.apply_move(Move::U);\n    rotated.apply_move(Move::Dp);\n    println!(\"After Y-rotation (U D'):\");\n    for i in 0..24 {\n        let s = rotated.get_sticker(i);\n        print!(\"idx{}: o{}, \", i, s.orientation);\n        if (i + 1) % 4 == 0 {\n            println!();\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_phase1_dist.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::kociemba::{RawCube, Search};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n    let rc = RawCube::from_cube(\u0026cube).unwrap();\n\n    let mut search = Search::new();\n\n    let twist = rc.get_twist();\n    let flip = rc.get_flip();\n    let slice = rc.get_ud_slice();\n\n    println!(\n        \"Initial Phase 1 Coords: twist={}, flip={}, slice={}\",\n        twist, flip, slice\n    );\n\n    // We want to know the distance.\n    // Since we can't access PruningTable directly, we can use search_phase1 with increasing depth.\n    for depth in 0..=15 {\n        search.node_count = 0;\n        search.max_nodes = 1_000_000;\n        if search.search_phase1(twist, flip, slice, depth as u8, 99) {\n            println!(\"Phase 1 Solution found at depth {}\", depth);\n            return;\n        }\n        println!(\n            \"Depth {}: No solution (Nodes: {})\",\n            depth, search.node_count\n        );\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_r_orientation.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\n\nfn main() {\n    let mut cube = Cube::new();\n\n    println!(\"初期状態（Right面）:\");\n    for i in 12..16 {\n        let s = cube.get_sticker(i);\n        println!(\"  位置{}: orientation={}\", i, s.orientation);\n    }\n    println!(\n        \"  パターン: [{}, {}, {}, {}]\",\n        cube.get_sticker(12).orientation,\n        cube.get_sticker(13).orientation,\n        cube.get_sticker(14).orientation,\n        cube.get_sticker(15).orientation\n    );\n\n    // R操作を実行\n    cube.apply_move(Move::R);\n\n    println!(\"\\nR操作後（Right面）:\");\n    for i in 12..16 {\n        let s = cube.get_sticker(i);\n        println!(\"  位置{}: orientation={}\", i, s.orientation);\n    }\n    println!(\n        \"  パターン: [{}, {}, {}, {}]\",\n        cube.get_sticker(12).orientation,\n        cube.get_sticker(13).orientation,\n        cube.get_sticker(14).orientation,\n        cube.get_sticker(15).orientation\n    );\n\n    let clockwise = [1, 2, 0, 3];\n    let is_clockwise = (0..4).all(|i| cube.get_sticker(12 + i).orientation == clockwise[i]);\n\n    if is_clockwise {\n        println!(\"\\n✅ 時計回りパターンが維持されています\");\n    } else {\n        println!(\"\\n❌ 時計回りパターンが崩れています！\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_rp_orientation.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\n\nfn main() {\n    let mut cube = Cube::new();\n\n    println!(\"初期状態（Right面）:\");\n    for i in 12..16 {\n        let s = cube.get_sticker(i);\n        println!(\"  位置{}: orientation={}\", i, s.orientation);\n    }\n    println!(\n        \"  パターン: [{}, {}, {}, {}]\",\n        cube.get_sticker(12).orientation,\n        cube.get_sticker(13).orientation,\n        cube.get_sticker(14).orientation,\n        cube.get_sticker(15).orientation\n    );\n\n    // Rp操作を実行\n    cube.apply_move(Move::Rp);\n\n    println!(\"\\nRp操作後（Right面）:\");\n    for i in 12..16 {\n        let s = cube.get_sticker(i);\n        println!(\"  位置{}: orientation={}\", i, s.orientation);\n    }\n    println!(\n        \"  パターン: [{}, {}, {}, {}]\",\n        cube.get_sticker(12).orientation,\n        cube.get_sticker(13).orientation,\n        cube.get_sticker(14).orientation,\n        cube.get_sticker(15).orientation\n    );\n\n    let clockwise = [1, 2, 0, 3];\n    let is_clockwise = (0..4).all(|i| cube.get_sticker(12 + i).orientation == clockwise[i]);\n\n    if is_clockwise {\n        println!(\"\\n✅ 時計回りパターンが維持されています\");\n    } else {\n        println!(\"\\n❌ 時計回りパターンが崩れています！\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_solvability_god.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::solver::is_orientation_solvable;\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").unwrap();\n    let cube = Cube::from_file_format(\u0026cube_text).unwrap();\n\n    println!(\"Cube state check for cube_god.txt:\");\n    println!(\"is_solved(): {}\", cube.is_solved());\n    println!(\"is_valid_state(): {:?}\", cube.is_valid_state());\n    println!(\n        \"is_orientation_solvable(): {}\",\n        is_orientation_solvable(\u0026cube)\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_solved_states.rs"],"content":"use rubiks_cube_3x3::solver;\n\nfn main() {\n    println!(\"Checking all 24 solved states...\\n\");\n\n    let solved_states = solver::get_solved_states();\n    println!(\"Total solved states: {}\\n\", solved_states.len());\n\n    let clockwise_pattern = [1, 2, 0, 3];\n\n    for (idx, cube) in solved_states.iter().enumerate() {\n        println!(\"Solved state #{}:\", idx);\n\n        // 各面のorientationパターンをチェック\n        let faces = [\n            (\"Up   \", 0..4),\n            (\"Down \", 4..8),\n            (\"Left \", 8..12),\n            (\"Right\", 12..16),\n            (\"Front\", 16..20),\n            (\"Back \", 20..24),\n        ];\n\n        let mut all_clockwise = true;\n\n        for (face_name, range) in \u0026faces {\n            let orientations: Vec\u003cu8\u003e = range\n                .clone()\n                .map(|i| cube.get_sticker(i).orientation)\n                .collect();\n\n            let is_clockwise = orientations == clockwise_pattern;\n\n            print!(\n                \"  {} [{}, {}, {}, {}]\",\n                face_name, orientations[0], orientations[1], orientations[2], orientations[3]\n            );\n\n            if !is_clockwise {\n                print!(\" ❌ NOT clockwise!\");\n                all_clockwise = false;\n            }\n            println!();\n        }\n\n        if all_clockwise {\n            println!(\"  ✅ All faces are clockwise\");\n        } else {\n            println!(\"  ❌ Some faces are NOT clockwise\");\n        }\n        println!();\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_standard_centers.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face};\n\nfn main() {\n    let cube = Cube::new();\n    println!(\"Standard Completed Cube Centers:\");\n    for face in Face::all() {\n        let center_idx = face.start_index() + 4;\n        let color = cube.get_sticker(center_idx).color;\n        println!(\"{:?}: {:?}\", face, color);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","check_superflip.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Checking if cube_god.txt is Superflip...\");\n\n    let centers = [\n        cube.get_sticker(Face::Up.start_index() + 4).color,\n        cube.get_sticker(Face::Down.start_index() + 4).color,\n        cube.get_sticker(Face::Left.start_index() + 4).color,\n        cube.get_sticker(Face::Right.start_index() + 4).color,\n        cube.get_sticker(Face::Front.start_index() + 4).color,\n        cube.get_sticker(Face::Back.start_index() + 4).color,\n    ];\n\n    println!(\"Centers (U,D,L,R,F,B): {:?}\", centers);\n\n    let mut corners_correct = true;\n    for face in Face::all() {\n        let center_color = cube.get_sticker(face.start_index() + 4).color;\n        for \u0026idx in \u0026[0, 2, 6, 8] {\n            let sticker_color = cube.get_sticker(face.start_index() + idx).color;\n            if sticker_color != center_color {\n                corners_correct = false;\n                println!(\n                    \"Corner mismatch at {:?} index {}: {:?}\",\n                    face, idx, sticker_color\n                );\n            }\n        }\n    }\n\n    println!(\n        \"All corners correct (color matches center): {}\",\n        corners_correct\n    );\n\n    let mut edges_flipped = true;\n    for face in Face::all() {\n        let center_color = cube.get_sticker(face.start_index() + 4).color;\n        for \u0026idx in \u0026[1, 3, 5, 7] {\n            let sticker_color = cube.get_sticker(face.start_index() + idx).color;\n            if sticker_color == center_color {\n                edges_flipped = false;\n                println!(\n                    \"Edge matches center at {:?} index {}: {:?}\",\n                    face, idx, center_color\n                );\n            }\n        }\n    }\n\n    println!(\n        \"All edge stickers MISMATCH their centers (flipped hint): {}\",\n        edges_flipped\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","debug_orientation.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse rubiks_cube_3x3::solver::{solve, DEFAULT_MAX_DEPTH};\nuse std::fs;\n\nfn main() {\n    println!(\"=== cube_ex001.txt の向き復元テスト（修正後）===\\n\");\n\n    // ファイルから読み込み\n    let cube_text =\n        fs::read_to_string(\"cubes/cube_ex001.txt\").expect(\"cube_ex001.txt を読み込めませんでした\");\n\n    println!(\"ファイル内容:\\n{}\\n\", cube_text);\n\n    // キューブを作成\n    let mut cube = Cube::from_file_format(\u0026cube_text).expect(\"キューブのパースに失敗しました\");\n\n    println!(\"パース後のキューブ状態:\\n{}\\n\", cube.to_file_format());\n\n    // 状態チェック\n    println!(\"--- 初期状態チェック ---\");\n    println!(\"is_solved(): {}\", cube.is_solved());\n    println!(\n        \"is_solved_with_orientation(): {}\",\n        cube.is_solved_with_orientation()\n    );\n\n    // 完成状態をスクランブル\n    println!(\"\\n--- スクランブル適用 ---\");\n    let scramble_moves = vec![Move::R, Move::U, Move::Rp, Move::Up, Move::F, Move::D];\n    println!(\"スクランブル: {:?}\", scramble_moves);\n\n    for mv in \u0026scramble_moves {\n        cube.apply_move(*mv);\n    }\n\n    println!(\n        \"\\nスクランブル後のキューブ状態:\\n{}\\n\",\n        cube.to_file_format()\n    );\n    println!(\"is_solved(): {}\", cube.is_solved());\n    println!(\n        \"is_solved_with_orientation(): {}\",\n        cube.is_solved_with_orientation()\n    );\n\n    // ファイルに保存\n    let scrambled_text = cube.to_file_format();\n    fs::write(\"cubes/cube_ex001_scrambled.txt\", \u0026scrambled_text)\n        .expect(\"スクランブル後の状態を保存できませんでした\");\n    println!(\"スクランブル後の状態を cubes/cube_ex001_scrambled.txt に保存しました\");\n\n    // 1. 向きを揃えない解（色のみ）\n    println!(\"\\n--- 1. 向きを揃えない解（色のみ）---\");\n    let solution_color_only = solve(\u0026cube, DEFAULT_MAX_DEPTH, true);\n\n    if solution_color_only.found {\n        println!(\"✓ 解が見つかりました！\");\n        println!(\"  手数: {}\", solution_color_only.moves.len());\n\n        // 検証\n        let mut test_cube = cube.clone();\n        for mv in \u0026solution_color_only.moves {\n            test_cube.apply_move(*mv);\n        }\n        if test_cube.is_solved() {\n            println!(\"  ✓ 検証成功: 色が揃っています\");\n        }\n        if test_cube.is_solved_with_orientation() {\n            println!(\"  ✓ 向きも揃っています\");\n        } else {\n            println!(\"  ℹ 色のみ揃っています（向きは揃っていません）\");\n        }\n    } else {\n        println!(\"✗ 解が見つかりませんでした\");\n        if !solution_color_only.message.is_empty() {\n            println!(\"  メッセージ: {}\", solution_color_only.message);\n        }\n    }\n\n    // 2. 向きを揃える解（supercube）\n    println!(\"\\n--- 2. 向きを揃える解（向きも含む）---\");\n    let solution_with_orientation = solve(\u0026cube, DEFAULT_MAX_DEPTH, false);\n\n    if solution_with_orientation.found {\n        println!(\"✓ 解が見つかりました！\");\n        println!(\"  手数: {}\", solution_with_orientation.moves.len());\n\n        // 検証\n        let mut test_cube = cube.clone();\n        for mv in \u0026solution_with_orientation.moves {\n            test_cube.apply_move(*mv);\n        }\n        if test_cube.is_solved() {\n            println!(\"  ✓ 検証成功: 色が揃っています\");\n        }\n        if test_cube.is_solved_with_orientation() {\n            println!(\"  ✓ 向きも揃っています\");\n        } else {\n            println!(\"  ⚠ 注意: 向きが揃っていません\");\n        }\n    } else {\n        println!(\"✗ 解が見つかりませんでした\");\n        if !solution_with_orientation.message.is_empty() {\n            println!(\"  メッセージ: {}\", solution_with_orientation.message);\n        }\n    }\n\n    println!(\"\\n=== テスト完了 ===\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","final_solve_god.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::kociemba::{RawCube, Search};\nuse std::fs;\nuse std::time::Instant;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n    let rc = RawCube::from_cube(\u0026cube).unwrap();\n\n    println!(\"=== Final Search for God Cube Solution ===\");\n    println!(\"Node Limit: 1,000,000,000 (1 Billion)\");\n\n    let mut search = Search::new();\n    search.max_nodes = 1_000_000_000;\n\n    let start = Instant::now();\n    let sol = search.solve(\u0026rc, 22);\n    let duration = start.elapsed();\n\n    println!(\"Time: {:?}\", duration);\n    if let Some(s) = sol {\n        println!(\"Solution found! Length: {}\", s.len());\n        println!(\"Moves: {:?}\", s);\n\n        // Apply moves to verify\n        let mut test_cube = cube.clone();\n        for \u0026m in \u0026s {\n            test_cube.apply_move(m);\n        }\n        println!(\"Colors solved? {}\", test_cube.is_solved());\n    } else {\n        println!(\"NOT FOUND within 1 Billion nodes.\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","find_superflip_gen.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Face, Move};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let target_cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Testing (M' U')*3 variant for Superflip...\");\n\n    // Mp Up Mp Up Mp Up Mp Up flips 4 edges on the M ring and U/D layers?\n    // Let's use the sequence from a reliable source for Superflip:\n    // ((M' U) * 4  x y') * 3\n\n    let mut cube = Cube::new();\n\n    for _ in 0..3 {\n        // (Mp U)*4\n        for _ in 0..4 {\n            cube.apply_move(Move::Mp);\n            cube.apply_move(Move::U);\n        }\n        // x y'\n        cube.apply_move(Move::X);\n        cube.apply_move(Move::Yp);\n    }\n\n    println!(\"Applied ((Mp U)*4 x Yp)*3\");\n\n    let mut matches = true;\n    for face in Face::all() {\n        for idx in 0..9 {\n            if cube.get_sticker(face.start_index() + idx).color\n                != target_cube.get_sticker(face.start_index() + idx).color\n            {\n                matches = false;\n            }\n        }\n    }\n\n    if matches {\n        println!(\"SUCCESS! Matches cube_god.txt exactly.\");\n    } else {\n        println!(\"Mismatch. Corner orientation check:\");\n        let mut corners_ok = true;\n        for face in Face::all() {\n            let center = cube.get_sticker(face.start_index() + 4).color;\n            for \u0026idx in \u0026[0, 2, 6, 8] {\n                if cube.get_sticker(face.start_index() + idx).color != center {\n                    corners_ok = false;\n                }\n            }\n        }\n        println!(\"Corners OK? {}\", corners_ok);\n\n        // try another rotation variant\n        println!(\"Trying ((Mp Up)*4 x y')*3 ...\");\n        let mut cube2 = Cube::new();\n        for _ in 0..3 {\n            for _ in 0..4 {\n                cube2.apply_move(Move::Mp);\n                cube2.apply_move(Move::Up);\n            }\n            cube2.apply_move(Move::X);\n            cube2.apply_move(Move::Yp);\n        }\n\n        let mut matches2 = true;\n        for face in Face::all() {\n            for idx in 0..9 {\n                if cube2.get_sticker(face.start_index() + idx).color\n                    != target_cube.get_sticker(face.start_index() + idx).color\n                {\n                    matches2 = false;\n                }\n            }\n        }\n        if matches2 {\n            println!(\"SUCCESS (variant 2)! Matches cube_god.txt exactly.\");\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","search_god_solution.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::solver::solve;\nuse std::fs;\nuse std::time::Instant;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").unwrap();\n    let cube = Cube::from_file_format(\u0026cube_text).unwrap();\n\n    println!(\"=== Searching for Color-Only Solution (ignore_orientation = true) ===\");\n    let start = Instant::now();\n    // 探索の深さを20程度に制限してみる（God's Numberは20）\n    let solution = solve(\u0026cube, 22, true);\n    let duration = start.elapsed();\n\n    println!(\"Time: {:?}\", duration);\n    if solution.found {\n        println!(\"Solution found! ({} moves)\", solution.moves.len());\n        println!(\"Moves: {:?}\", solution.moves);\n\n        let mut test_cube = cube.clone();\n        for mv in \u0026solution.moves {\n            test_cube.apply_move(*mv);\n        }\n        println!(\"Is solved (colors): {}\", test_cube.is_solved());\n        println!(\n            \"Is solved (supercube): {}\",\n            test_cube.is_solved_with_orientation()\n        );\n    } else {\n        println!(\"Solution not found within depth limit.\");\n        println!(\"Message: {}\", solution.message);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","solve_cube_god.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::solver::{solve, DEFAULT_MAX_DEPTH};\nuse std::fs;\n\nfn main() {\n    let test_files = vec![\"cubes/cube_normal.txt\", \"cubes/cube_ex001.txt\"];\n\n    for file_path in test_files {\n        println!(\"\\n{}\", \"=\".repeat(60));\n        println!(\"Testing: {}\", file_path);\n        println!(\"{}\\n\", \"=\".repeat(60));\n\n        // キューブファイルを読み込む\n        let cube_text = match fs::read_to_string(file_path) {\n            Ok(text) =\u003e text,\n            Err(e) =\u003e {\n                println!(\"✗ ファイルの読み込みに失敗: {}\", e);\n                continue;\n            }\n        };\n\n        // テキストをパースしてCubeを作成\n        let cube = match Cube::from_file_format(\u0026cube_text) {\n            Ok(c) =\u003e c,\n            Err(e) =\u003e {\n                println!(\"✗ キューブのパースに失敗: {}\", e);\n                continue;\n            }\n        };\n\n        println!(\"キューブの状態:\\n{}\\n\", cube.to_file_format());\n\n        // 1. 向きを揃えない解（色のみ）\n        println!(\"--- 1. 向きを揃えない解（色のみ）---\");\n        let solution_color_only = solve(\u0026cube, DEFAULT_MAX_DEPTH, true);\n\n        if solution_color_only.found {\n            println!(\"✓ 解が見つかりました！\");\n            println!(\"  手数: {}\", solution_color_only.moves.len());\n\n            // 検証\n            let mut test_cube = cube.clone();\n            for mv in \u0026solution_color_only.moves {\n                test_cube.apply_move(*mv);\n            }\n            if test_cube.is_solved() {\n                println!(\"  ✓ 検証成功: 色が揃っています\");\n            }\n            if test_cube.is_solved_with_orientation() {\n                println!(\"  ✓ 向きも揃っています\");\n            } else {\n                println!(\"  ℹ 色のみ揃っています（向きは揃っていません）\");\n            }\n        } else {\n            println!(\"✗ 解が見つかりませんでした\");\n            if !solution_color_only.message.is_empty() {\n                println!(\"  メッセージ: {}\", solution_color_only.message);\n            }\n        }\n\n        println!();\n\n        // 2. 向きを揃える解（supercube）\n        println!(\"--- 2. 向きを揃える解（向きも含む）---\");\n        let solution_with_orientation = solve(\u0026cube, DEFAULT_MAX_DEPTH, false);\n\n        if solution_with_orientation.found {\n            println!(\"✓ 解が見つかりました！\");\n            println!(\"  手数: {}\", solution_with_orientation.moves.len());\n\n            // 検証\n            let mut test_cube = cube.clone();\n            for mv in \u0026solution_with_orientation.moves {\n                test_cube.apply_move(*mv);\n            }\n            if test_cube.is_solved() {\n                println!(\"  ✓ 検証成功: 色が揃っています\");\n            }\n            if test_cube.is_solved_with_orientation() {\n                println!(\"  ✓ 向きも揃っています\");\n            } else {\n                println!(\"  ⚠ 注意: 向きが揃っていません\");\n            }\n        } else {\n            println!(\"✗ 解が見つかりませんでした\");\n            if !solution_with_orientation.message.is_empty() {\n                println!(\"  メッセージ: {}\", solution_with_orientation.message);\n            }\n        }\n    }\n\n    println!(\"\\n{}\", \"=\".repeat(60));\n    println!(\"テスト完了\");\n    println!(\"{}\", \"=\".repeat(60));\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","solve_god_heavy.rs"],"content":"use rubiks_cube_3x3::cube::Cube;\nuse rubiks_cube_3x3::solver::solve;\nuse std::fs;\nuse std::time::Instant;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").unwrap();\n    let cube = Cube::from_file_format(\u0026cube_text).unwrap();\n\n    println!(\"=== Searching for Color-Only Solution for God Cube ===\");\n    println!(\"Using high node limit from the start.\");\n\n    // solver.rs に追加した段階的引き上げロジックを待つのではなく、\n    // ここで直接重い探索を試みる。\n    // ただし、現在の solve インターフェースでは外部からノード制限を指定できないため、\n    // solve_internal の trial 0 から重くなるように solver.rs を微調整した後の状態を想定するか、\n    // あるいは solve を呼び出す回数を調整する。\n\n    let start = Instant::now();\n    // 深度を 20 に固定（God's Number）\n    let solution = solve(\u0026cube, 20, true);\n    let duration = start.elapsed();\n\n    println!(\"Time: {:?}\", duration);\n    if solution.found {\n        println!(\"Solution found! ({} moves)\", solution.moves.len());\n        println!(\"Moves: {:?}\", solution.moves);\n    } else {\n        println!(\"Solution not found.\");\n        println!(\"Message: {}\", solution.message);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","examples","verify_superflip_solution.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse std::fs;\n\nfn main() {\n    let cube_text = fs::read_to_string(\"cubes/cube_god.txt\").expect(\"Failed to read cube_god.txt\");\n    let target_cube = Cube::from_file_format(\u0026cube_text).expect(\"Failed to parse cube_god.txt\");\n\n    println!(\"Verifying Superflip sequence...\");\n\n    // many sources say: (M' U')*4 + (rotate) + ... is superflip\n    // Standard 20-move superflip sequence (Singmaster's):\n    // U R2 F B R B2 R U2 L B2 R U' D' R2 F R' L B2 U2 F2\n    let moves = vec![\n        Move::U,\n        Move::R2,\n        Move::F,\n        Move::B,\n        Move::R,\n        Move::B2,\n        Move::R,\n        Move::U2,\n        Move::L,\n        Move::B2,\n        Move::R,\n        Move::Up,\n        Move::D,\n        Move::R2,\n        Move::F,\n        Move::Rp,\n        Move::L,\n        Move::B2,\n        Move::U2,\n        Move::F2,\n    ];\n\n    let mut cube = Cube::new();\n    // Superflip depends on having centers right. Cube::new() has standard centers.\n    for \u0026mv in \u0026moves {\n        cube.apply_move(mv);\n    }\n\n    println!(\"Applied Superflip sequence to solved cube.\");\n    println!(\"Is solved (colors)? {}\", cube.is_solved());\n\n    // Check if it matches target_cube\n    let mut matches = true;\n    for face in rubiks_cube_3x3::cube::Face::all() {\n        for idx in 0..9 {\n            if cube.get_sticker(face.start_index() + idx).color\n                != target_cube.get_sticker(face.start_index() + idx).color\n            {\n                matches = false;\n                // println!(\"Mismatch at {:?} index {}: Expected {:?}, Found {:?}\", face, idx, target_cube.get_sticker(face.start_index() + idx).color, cube.get_sticker(face.start_index() + idx).color);\n            }\n        }\n    }\n\n    println!(\"Does it match cube_god.txt exactly? {}\", matches);\n\n    if matches {\n        println!(\"SUCCESS! The sequence is a solution (in reverse).\");\n        let solution_moves: Vec\u003cMove\u003e = moves.iter().rev().map(|m| m.inverse()).collect();\n        println!(\"Solution moves: {:?}\", solution_moves);\n    } else {\n        println!(\"Trying another variant...\");\n        // try M' U M' U M' U M' U x y ...\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","scripts","gen_cycles.rs"],"content":"#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\nenum Face {\n    Up,\n    Down,\n    Left,\n    Right,\n    Front,\n    Back,\n}\n\nfn get_id(f: Face, row: i32, col: i32) -\u003e usize {\n    let base = match f {\n        Face::Up =\u003e 0,\n        Face::Down =\u003e 9,\n        Face::Left =\u003e 18,\n        Face::Right =\u003e 27,\n        Face::Front =\u003e 36,\n        Face::Back =\u003e 45,\n    };\n    base + (row * 3 + col) as usize\n}\n\nfn get_coords(f: Face, r: i32, c: i32) -\u003e (f32, f32, f32) {\n    let rs = (r as f32 - 1.0) * -1.0;\n    let cs = c as f32 - 1.0;\n    match f {\n        Face::Up =\u003e (cs, 1.5, -rs),\n        Face::Down =\u003e (cs, -1.5, rs),\n        Face::Left =\u003e (-1.5, rs, cs),\n        Face::Right =\u003e (1.5, rs, -cs),\n        Face::Front =\u003e (cs, rs, 1.5),\n        Face::Back =\u003e (-cs, rs, -1.5),\n    }\n}\n\nfn find_id(x: f32, y: f32, z: f32) -\u003e usize {\n    let faces = [\n        Face::Up,\n        Face::Down,\n        Face::Left,\n        Face::Right,\n        Face::Front,\n        Face::Back,\n    ];\n    for f in faces {\n        for r in 0..3 {\n            for c in 0..3 {\n                let (sx, sy, sz) = get_coords(f, r, c);\n                if (x - sx).abs() \u003c 0.1 \u0026\u0026 (y - sy).abs() \u003c 0.1 \u0026\u0026 (z - sz).abs() \u003c 0.1 {\n                    return get_id(f, r, c);\n                }\n            }\n        }\n    }\n    panic!(\"No sticker at ({}, {}, {})\", x, y, z);\n}\n\nfn main() {\n    let corner_coords = [\n        (\"UFR\", 1.0, 1.0, 1.0),\n        (\"UFL\", -1.0, 1.0, 1.0),\n        (\"ULB\", -1.0, 1.0, -1.0),\n        (\"UBR\", 1.0, 1.0, -1.0),\n        (\"DFR\", 1.0, -1.0, 1.0),\n        (\"DLF\", -1.0, -1.0, 1.0),\n        (\"DBL\", -1.0, -1.0, -1.0),\n        (\"DRB\", 1.0, -1.0, -1.0),\n    ];\n\n    for (name, cx, cy, cz) in corner_coords {\n        let mut ids = Vec::new();\n        // Each corner has 3 stickers. They are at distances 1.5 from center.\n        // For UFR (1,1,1), the stickers are at (1,1,1.5) on Front, (1.5,1,1) on Right, (1,1.5,1) on Up.\n        ids.push(find_id(cx, 1.5, cz)); // Up/Down sticker\n\n        // Next two depend on the corner.\n        // For UFR, it's Front and Right.\n        // Let's just find all 3 stickers near this corner.\n        let mut stickers = Vec::new();\n        for f in [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ] {\n            for r in 0..3 {\n                for c in 0..3 {\n                    let (sx, sy, sz) = get_coords(f, r, c);\n                    if (cx - sx).abs() \u003c 0.6 \u0026\u0026 (cy - sy).abs() \u003c 0.6 \u0026\u0026 (cz - sz).abs() \u003c 0.6 {\n                        stickers.push(get_id(f, r, c));\n                    }\n                }\n            }\n        }\n        println!(\"{}: {:?}\", name, stickers);\n    }\n\n    println!(\"\\nEdges:\");\n    let edge_coords = [\n        (\"UR\", 1.0, 1.0, 0.0),\n        (\"UF\", 0.0, 1.0, 1.0),\n        (\"UL\", -1.0, 1.0, 0.0),\n        (\"UB\", 0.0, 1.0, -1.0),\n        (\"DR\", 1.0, -1.0, 0.0),\n        (\"DF\", 0.0, -1.0, 1.0),\n        (\"DL\", -1.0, -1.0, 0.0),\n        (\"DB\", 0.0, -1.0, -1.0),\n        (\"FR\", 1.0, 0.0, 1.0),\n        (\"FL\", -1.0, 0.0, 1.0),\n        (\"BL\", -1.0, 0.0, -1.0),\n        (\"BR\", 1.0, 0.0, -1.0),\n    ];\n    for (name, cx, cy, cz) in edge_coords {\n        let mut stickers = Vec::new();\n        for f in [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ] {\n            for r in 0..3 {\n                for c in 0..3 {\n                    let (sx, sy, sz) = get_coords(f, r, c);\n                    if (cx - sx).abs() \u003c 0.6 \u0026\u0026 (cy - sy).abs() \u003c 0.6 \u0026\u0026 (cz - sz).abs() \u003c 0.6 {\n                        stickers.push(get_id(f, r, c));\n                    }\n                }\n            }\n        }\n        println!(\"{}: {:?}\", name, stickers);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","scripts","gen_move_cubes.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse rubiks_cube_3x3::kociemba::RawCube;\n\nfn main() {\n    let moves = [Move::U, Move::R, Move::F, Move::D, Move::L, Move::B];\n\n    println!(\"pub static MOVE_CUBES: [RawCube; 6] = [\");\n    for mv in moves {\n        let mut cube = Cube::new();\n        cube.apply_move(mv);\n        let rc = RawCube::from_cube(\u0026cube).expect(\"from_cube failed for move\");\n\n        println!(\"    RawCube {{\");\n        print!(\"        cp: [\");\n        for (i, cp) in rc.cp.iter().enumerate() {\n            print!(\"{}\", cp);\n            if i \u003c 7 {\n                print!(\", \");\n            }\n        }\n        println!(\"],\");\n\n        print!(\"        co: [\");\n        for (i, co) in rc.co.iter().enumerate() {\n            print!(\"{}\", co);\n            if i \u003c 7 {\n                print!(\", \");\n            }\n        }\n        println!(\"],\");\n\n        print!(\"        ep: [\");\n        for (i, ep) in rc.ep.iter().enumerate() {\n            print!(\"{}\", ep);\n            if i \ ngth":0,"stats":{"Line":0}},{"line":12,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":14},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","bin","test_centers.rs"],"content":"use rubiks_cube_3x3::cube::{Cube, Move};\nuse rubiks_cube_3x3::solver::get_orientations_vec;\n\nfn main() {\n    let mut cube = Cube::new();\n    // (U Dp Ep) rotates Up CW (1) and Down CCW (3)\n    let seq = vec![Move::U, Move::Dp, Move::Ep];\n    for \u0026m in \u0026seq {\n        cube.apply_move(m);\n    }\n    println!(\"Initial state (after sequence):\");\n    println!(\"  Solved (colors): {}\", cube.is_solved());\n    println!(\"  Orientations: {:?}\", get_orientations_vec(\u0026cube));\n\n    let sol = rubiks_cube_3x3::solver::solve(\u0026cube, 24, false);\n    println!(\"Solver found solution: {}\", sol.found);\n    if sol.found {\n        let mut final_cube = cube.clone();\n        for \u0026mv in \u0026sol.moves {\n            final_cube.apply_move(mv);\n        }\n        println!(\"Final state:\");\n        println!(\"  Solved (colors): {}\", final_cube.is_solved());\n        println!(\n            \"  Fully Solved: {}\",\n            final_cube.is_solved_with_orientation()\n        );\n        println!(\"  Orientations: {:?}\", get_orientations_vec(\u0026final_cube));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","katoy","github","study-rust","rust-r-cube","3x3-web","src","cube","enums.rs"],"content":"use glam::Vec3;\n\n/// 2x2ルービックキューブの6つの面を表します。\n///\n/// 内部的には0から5の整数値にマップされており、\n/// 各面のステッカー配列の開始インデックスを計算するために使用されます。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Face {\n    /// 上面 (Whiteが標準)\n    Up = 0,\n    /// 下面 (Yellowが標準)\n    Down = 1,\n    /// 左面 (Greenが標準)\n    Left = 2,\n    /// 右面 (Blueが標準)\n    Right = 3,\n    /// 前面 (Redが標準)\n    Front = 4,\n    /// 背面 (Orangeが標準)\n    Back = 5,\n}\n\nimpl Face {\n    /// この面のステッカー配列における開始インデックスを取得します。\n    ///\n    /// 2x2キューブでは各面4枚のステッカーがあるため、\n    /// インデックスは (面の番号 * 4) となります。\n    #[must_use]\n    pub const fn start_index(self) -\u003e usize {\n        (self as usize) * STICKERS_PER_FACE\n    }\n\n    /// 対面を取得します。\n    #[must_use]\n    pub fn opposite(self) -\u003e Face {\n        match self {\n            Face::Up =\u003e Face::Down,\n            Face::Down =\u003e Face::Up,\n            Face::Left =\u003e Face::Right,\n            Face::Right =\u003e Face::Left,\n            Face::Front =\u003e Face::Back,\n            Face::Back =\u003e Face::Front,\n        }\n    }\n\n    /// 適当な隣接面を1つ取得します。\n    #[must_use]\n    pub fn any_adjacent(self) -\u003e Face {\n        match self {\n            Face::Up =\u003e Face::Front,\n            Face::Down =\u003e Face::Front,\n            Face::Left =\u003e Face::Up,\n            Face::Right =\u003e Face::Up,\n            Face::Front =\u003e Face::Up,\n            Face::Back =\u003e Face::Up,\n        }\n    }\n\n    /// すべての面を列挙した配列を返します。\n    ///\n    /// # 例\n    ///\n    /// ```\n    /// use rubiks_cube_3x3::cube::Face;\n    /// for face in Face::all() {\n    ///     println!(\"{:?}\", face);\n    /// }\n    /// ```\n    #[must_use]\n    pub fn all() -\u003e [Face; 6] {\n        [\n            Face::Up,\n            Face::Down,\n            Face::Left,\n            Face::Right,\n            Face::Front,\n            Face::Back,\n        ]\n    }\n\n    /// インデックスから面を取得します。\n    pub fn from_index(index: usize) -\u003e Self {\n        match index / 9 {\n            0 =\u003e Face::Up,\n            1 =\u003e Face::Down,\n            2 =\u003e Face::Left,\n            3 =\u003e Face::Right,\n            4 =\u003e Face::Front,\n            5 =\u003e Face::Back,\n            _ =\u003e Face::Up,\n        }\n    }\n\n    /// 面内の 0-8 のインデックスから空間座標を返します。\n    pub fn to_pos_for_local_index(\u0026self, local_idx: usize) -\u003e Vec3 {\n        let row = (local_idx / 3) as f32;\n        let col = (local_idx % 3) as f32;\n        match self {\n            Face::Up =\u003e Vec3::new(col - 1.0, 1.0, row - 1.0),\n            Face::Down =\u003e Vec3::new(col - 1.0, -1.0, 1.0 - row),\n            Face::Left =\u003e Vec3::new(-1.0, 1.0 - row, col - 1.0),\n            Face::Right =\u003e Vec3::new(1.0, 1.0 - row, 1.0 - col),\n            Face::Front =\u003e Vec3::new(col - 1.0, 1.0 - row, 1.0),\n            Face::Back =\u003e Vec3::new(1.0 - col, 1.0 - row, -1.0),\n        }\n    }\n}\n\n/// ステッカーの総数\npub const NUM_STICKERS: usize = 54;\n/// 1面あたりのステッカー数\npub const STICKERS_PER_FACE: usize = 9;\n\n/// ステッカーの色の定義です。\n///\n/// 標準的なルービックキューブの6色に加えて、\n/// 未設定状態を表す `Gray` を含みます。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Color {\n    /// 白 (通常は上面)\n    White,\n    /// 黄 (通常は下面)\n    Yellow,\n    /// 緑 (通常は左面)\n    Green,\n    /// 青 (通常は右面)\n    Blue,\n    /// 赤 (通常は前面)\n    Red,\n    /// 橙 (通常は背面)\n    Orange,\n    /// 灰色 (未設定・無効な色)\n    Gray,\n}\n\n/// 1枚のステッカーを表す構造体。\n///\n/// 色情報（[`Color`]）と、そのステッカーの現在の向き（[`orientation`](Self::orientation)）を保持します。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct Sticker {\n    /// ステッカーの色\n    pub color: Color,\n    /// 向き（0-3の値で、90度単位の物理的な回転状態を表す。0が初期状態）\n    pub orientation: u8,\n}\n\nimpl Sticker {\n    /// 指定された色で、向きが0（初期状態）のステッカーを作成します。\n    #[must_use]\n    pub fn new(color: Color) -\u003e Self {\n        Self {\n            color,\n            orientation: 0,\n        }\n    }\n\n    /// ステッカーを時計回りに90度回転させます（向き情報を更新）。\n    pub fn rotate_cw(\u0026mut self) {\n        self.orientation = (self.orientation + 1) % 4;\n    }\n\n    /// ステッカーを反時計回りに90度回転させます（向き情報を更新）。\n    pub fn rotate_ccw(\u0026mut self) {\n        self.orientation = (self.orientation + 3) % 4;\n    }\n}\n\n/// キューブに対する単一の回転操作を定義します。\n///\n/// 各文字（R, L, U, D, F, B）は操作する面を表し、\n/// 接尾辞（なし, p, 2）は回転の量と方向を表します。\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub enum Move {\n    /// 右面 時計回り 90度\n    R,\n    /// 右面 反時計回り 90度 (Prime)\n    Rp,\n    /// 右面 180度\n    R2,\n    /// 左面 時計回り 90度\n    L,\n    /// 左面 反時計回り 90度\n    Lp,\n    /// 左面 180度\n    L2,\n    /// 上面 時計回り 90度\n    U,\n    /// 上面 反時計回り 90度\n    Up,\n    /// 上面 180度\n    U2,\n    /// 下面 時計回り 90度\n    D,\n    /// 下面 反時計回り 90度\n    Dp,\n    /// 下面 180度\n    D2,\n    /// 前面 時計回り 90度\n    F,\n    /// 前面 反時計回り 90度\n    Fp,\n    /// 前面 180度\n    F2,\n    /// 背面 時計回り 90度\n    B,\n    /// 背面 反時計回り 90度\n    Bp,\n    /// 背面 180度\n    B2,\n    /// 中層(M) 時計回り 90度\n    M,\n    /// 中層(M) 反時計回り 90度\n    Mp,\n    /// 中層(M) 180度\n    M2,\n    /// 中層(E) 時計回り 90度\n    E,\n    /// 中層(E) 反時計回り 90度\n    Ep,\n    /// 中層(E) 180度\n    E2,\n    /// 中層(S) 時計回り 90度\n    S,\n    /// 中層(S) 反時計回り 90度\n    Sp,\n    /// 中層(S) 180度\n    S2,\n    /// 全体(X) 時計回り 90度\n    X,\n    /// 全体(X) 反時計回り 90度\n    Xp,\n    /// 全体(X) 180度\n    X2,\n    /// 全体(Y) 時計回り 90度\n    Y,\n    /// 全体(Y) 反時計回り 90度\n    Yp,\n    /// 全体(Y) 180度\n    Y2,\n    /// 全体(Z) 時計回り 90度\n    Z,\n    /// 全体(Z) 反時計回り 90度\n    Zp,\n    /// 全体(Z) 180度\n    Z2,\n}\n\nimpl Move {\n    /// 全体回転（X, Y, Z）であるかを判定します。\n    #[must_use]\n    pub fn is_global(self) -\u003e bool {\n        matches!(\n            self,\n            Move::X\n                | Move::Xp\n                | Move::X2\n                | Move::Y\n                | Move::Yp\n                | Move::Y2\n                | Move::Z\n                | Move::Zp\n                | Move::Z2\n        )\n    }\n\n    /// 中層回転（M, E, S）であるかを判定します。\n    #[must_use]\n    pub fn is_ \u003e Result\u003cCube\u003e {\n    let lines: Vec\u003c\u0026str\u003e = s.lines().collect();\n\n    if lines.len() != 3 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"3行必要ですが{}行しかありません\",\n            lines.len()\n        )));\n    }\n\n    // 色を解析\n    let parse_colors = |s: \u0026str| -\u003e Result\u003cVec\u003cColor\u003e\u003e {\n        s.chars()\n            .filter(|c| !c.is_whitespace())\n            .map(|c| match c.to_ascii_uppercase() {\n                'W' =\u003e Ok(Color::White),\n                'Y' =\u003e Ok(Color::Yellow),\n                'G' =\u003e Ok(Color::Green),\n                'B' =\u003e Ok(Color::Blue),\n                'R' =\u003e Ok(Color::Red),\n                'O' =\u003e Ok(Color::Orange),\n                '.' =\u003e Ok(Color::Gray),\n                _ =\u003e Err(CubeError::InvalidColorChar(c)),\n            })\n            .collect()\n    };\n\n    // 各行から色を取得\n    let line1_colors = parse_colors(lines[0])?;\n    let line2_colors = parse_colors(lines[1])?;\n    let line3_colors = parse_colors(lines[2])?;\n\n    // 検証\n    if line1_colors.len() != 9 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"1行目: 9ステッカー必要ですが{}個です\",\n            line1_colors.len()\n        )));\n    }\n    if line2_colors.len() != 36 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"2行目: 36ステッカー必要ですが{}個です\",\n            line2_colors.len()\n        )));\n    }\n    if line3_colors.len() != 9 {\n        return Err(CubeError::InvalidFormat(format!(\n            \"3行目: 9ステッカー必要ですが{}個です\",\n            line3_colors.len()\n        )));\n    }\n\n    // 24色の配列を作成（内部順序: Up, Down, Left, Right, Front, Back）\n\n    // 各面の配置ルール: (面、ソースとなる色のスライス)\n    const SPF: usize = crate::cube::STICKERS_PER_FACE;\n    use crate::cube::{Face, Sticker};\n    let mut stickers = [Sticker::new(Color::White); crate::cube::NUM_STICKERS];\n\n    let mut map_face = |face: Face, line_colors: \u0026[Color]| {\n        let start = face.start_index();\n        for i in 0..SPF {\n            stickers[start + i] = Sticker::new(line_colors[i]);\n        }\n    };\n\n    map_face(Face::Up, \u0026line1_colors);\n    map_face(Face::Down, \u0026line3_colors);\n    map_face(Face::Left, \u0026line2_colors[0..9]);\n    map_face(Face::Front, \u0026line2_colors[9..18]);\n    map_face(Face::Right, \u0026line2_colors[18..27]);\n    map_face(Face::Back, \u0026line2_colors[27..36]);\n\n    let mut cube = Cube {\n        stickers,\n        pieces: crate::cube::piece::get_initial_pieces(),\n    };\n\n    // スキャン途中（Grayあり）でない場合は、向きを初期化し、ピースモデルを復元\n    let has_gray = cube.stickers.iter().any(|s| s.color == Color::Gray);\n    if !has_gray {\n        // 各ピースの位置と回転を色から物理的に正しく復元\n        cube.restore_orientation_instantly()?;\n    }\n\n    Ok(cube)\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":12}},{"line":7,"address":[],"length":0,"stats":{"Line":24}},{"line":10,"address":[],"length":0,"stats":{"Line":84}},{"line":11,"address":[],"length":0,"stats":{"Line":144}},{"line":12,"address":[],"length":0,"stats":{"Line":144}},{"line":13,"address":[],"length":0,"stats":{"Line":720}},{"line":14,"address":[],"length":0,"stats":{"Line":1296}},{"line":15,"address":[],"length":0,"stats":{"Line":1296}},{"line":16,"address":[],"length":0,"stats":{"Line":108}},{"line":17,"address":[],"length":0,"stats":{"Line":108}},{"line":18,"address":[],"length":0,"stats":{"Line":108}},{"line":19,"address":[],"length":0,"stats":{"Line":108}},{"line":20,"address":[],"length":0,"stats":{"Line":108}},{"line":21,"address":[],"length":0,"stats":{"Line":108}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":1944}},{"line":26,"address":[],"length":0,"stats":{"Line":72}},{"line":31,"address":[],"length":0,"stats":{"Line":36}},{"line":32,"address":[],"length":0,"stats":{"Line":36}},{"line":33,"address":[],"length":0,"stats":{"Line":24}},{"line":36,"address":[],"length":0
